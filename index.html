<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tattva Reels</title>
<meta name="description" content="Short reels that teach the eight tattvas of the Dakṣiṇāmūrti Aṣṭakam. Watch, sing the verse, and share what you learnt.">
<meta name="theme-color" content="#07050F">
<meta property="og:title" content="Tattva Reels"><meta property="og:description" content="The world, like a city in a mirror. Watch, sing and share the eight tattvas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307050F'/%3E%3Cg fill='none' stroke='%23E9B44C' stroke-width='3' stroke-linejoin='round'%3E%3Cpath d='M32 52c-6-5-9-11-9-19 0-7 3-14 9-19 6 5 9 12 9 19 0 8-3 14-9 19Z'/%3E%3Cpath d='M32 52c-11 0-20-6-23-16 6-1 12 1 16 5'/%3E%3Cpath d='M32 52c11 0 20-6 23-16-6-1-12 1-16 5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, full-height; Reels feed is a vertical snap scroller, sheets rise from the bottom. Single deliberate dark world: temple night, lamp gold, kumkum. */
:root{
  --night:#0D0918;--deep:#07050F;--panel:#171026;--panel2:#221836;
  --ink:#F6EBD2;--muted:#B9AC90;--faint:rgba(246,235,210,.14);
  --gold:#E9B44C;--gold2:#F6D58E;--saffron:#EE8A2A;--kumkum:#D23B3B;--ok:#7FD1A6;--bad:#FF8E84;
  --f-disp:'Rozha One',Georgia,serif;--f-dev:'Tiro Devanagari Sanskrit','Noto Serif Devanagari',Georgia,serif;--f-ui:'Mukta','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  background:var(--night) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g fill='none' stroke='%23E9B44C' stroke-opacity='.07'><circle cx='120' cy='120' r='100'/><circle cx='120' cy='120' r='70'/><path d='M120 30 198 165H42Z'/><path d='M120 210 42 75h156Z'/><circle cx='120' cy='120' r='4'/></g></svg>") center/240px repeat}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--deep)}
@media (min-width:720px){#app{height:calc(100% - 32px);margin-top:16px;border-radius:26px;box-shadow:0 0 0 1px var(--faint),0 40px 90px rgba(0,0,0,.7)}}
.view{position:absolute;left:0;right:0;top:0;bottom:58px}
.view.full{bottom:0;z-index:8;background:var(--deep)}
.nav{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:6;display:flex;justify-content:space-around;align-items:center;background:var(--deep);border-top:1px solid var(--faint)}
.nav button{width:72px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11px;font-weight:600}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .create{width:54px;height:36px;border-radius:11px;border:1.5px solid var(--gold);color:var(--gold);flex-direction:row}
.topbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{font-family:var(--f-disp);font-size:27px;line-height:1;display:flex;align-items:baseline;gap:8px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.logo small{font-family:var(--f-dev);font-size:18px;color:var(--gold)}
.glass{background:rgba(7,5,15,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--faint)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.hint{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;animation:bob 2.4s ease-in-out infinite}
.hint svg{width:18px;height:18px}
@keyframes bob{50%{transform:translateX(-50%) translateY(3px)}}
.reels{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--deep);-webkit-user-select:none;user-select:none}
.reel>canvas,.stagecv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(7,5,15,.6) 0,rgba(7,5,15,0) 16%,rgba(7,5,15,0) 48%,rgba(7,5,15,.88) 100%)}
.rail{position:absolute;right:6px;bottom:104px;z-index:2;display:flex;flex-direction:column;gap:18px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.rbtn svg{width:32px;height:32px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.rbtn.on{color:var(--gold)}
.rbtn.on svg{fill:rgba(233,180,76,.38)}
.rbtn.pop svg{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.cap{position:absolute;left:14px;right:70px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-disp);font-size:15px;color:#1A1206;text-shadow:none;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 2px var(--deep),0 0 0 3.5px var(--gold)}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:5px;border:1px solid rgba(246,235,210,.45)}
.rtitle{font-family:var(--f-disp);font-size:21px;line-height:1.15}
.rtitle span{color:var(--gold2)}
.rcap{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pada{min-height:3.5em;display:flex;flex-direction:column;gap:1px;transition:opacity .35s}
.pada.swap{opacity:0}
.pada .dev{font-family:var(--f-dev);font-size:19px;line-height:1.35;color:var(--gold2)}
.pada .ia{font-family:var(--f-dev);font-style:italic;font-size:13px;color:var(--muted)}
.music{display:flex;align-items:center;gap:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.music svg{width:15px;height:15px}
.music .mq{overflow:hidden;flex:1;min-width:0;-webkit-mask-image:linear-gradient(to right,#000 80%,transparent);mask-image:linear-gradient(to right,#000 80%,transparent)}
.music .mq span{display:inline-block;padding-right:40px;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(246,235,210,.16);z-index:2}
.prog i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.flash{position:absolute;left:50%;top:46%;width:78px;height:78px;margin:-39px;border-radius:50%;background:rgba(7,5,15,.55);display:grid;place-items:center;z-index:3;pointer-events:none;animation:flash .75s ease forwards}
.flash svg{width:34px;height:34px}
@keyframes flash{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.burst{position:absolute;width:120px;height:120px;margin:-60px;pointer-events:none;z-index:5;color:var(--gold)}
.burst svg{width:100%;height:100%;fill:rgba(233,180,76,.6);stroke-width:1.2;filter:drop-shadow(0 0 14px rgba(233,180,76,.8));animation:burst .95s cubic-bezier(.2,1.4,.4,1) forwards}
.burst i{position:absolute;left:50%;top:50%;width:8px;height:15px;margin:-7px -4px;border-radius:50%;background:var(--gold2);transform:rotate(var(--a));animation:petal .9s ease-out forwards}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.12);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.25) translateY(-36px);opacity:0}}
@keyframes petal{to{transform:rotate(var(--a)) translateY(-78px);opacity:0}}
.endcard{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;padding:16px 16px 22px;background:rgba(7,5,15,.5);animation:fade .35s}
.ecard{width:100%;background:rgba(23,16,38,.94);border:1px solid rgba(233,180,76,.35);border-radius:22px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:rise .5s cubic-bezier(.2,.9,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.teach{font-family:var(--f-disp);font-size:22px;line-height:1.25;text-wrap:balance}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{height:48px;border-radius:13px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 14px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--saffron));color:#1A1206}
.btn.line{border:1px solid var(--faint)}
.btn.done{background:rgba(233,180,76,.14);color:var(--gold);border:1px solid rgba(233,180,76,.5)}
.row2{display:flex;gap:10px}
.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid rgba(233,180,76,.32);transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s}
.sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1)}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(246,235,210,.25);margin:10px auto 2px;flex:none}
.sbody{overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-title{font-family:var(--f-disp);font-size:25px;line-height:1.15;margin:0;text-wrap:balance}
.lab{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--faint);font-size:14px;background:var(--panel2)}
.chip.on{background:var(--gold);color:#1A1206;border-color:var(--gold);font-weight:600}
.learnbox{background:linear-gradient(180deg,rgba(233,180,76,.13),rgba(233,180,76,.03));border:1px solid rgba(233,180,76,.32);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.bignum{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.bignum.bump{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.shloka{display:flex;flex-direction:column}
.ln{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--faint)}
.ln:last-child{border-bottom:0}
.ln .dev{font-family:var(--f-dev);font-size:19px;line-height:1.4;color:var(--gold2)}
.ln .ia{font-family:var(--f-dev);font-style:italic;font-size:13px;color:var(--muted)}
.ln .en{font-size:14px}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.word{background:var(--panel2);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;min-width:0}
.word b{font-family:var(--f-dev);font-style:italic;font-weight:400;color:var(--gold2);font-size:15px}
.word span{font-size:13px;color:var(--muted)}
.keep{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.keep li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.keep svg{color:var(--gold);width:20px;height:20px;margin-top:2px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--faint);background:var(--deep);color:var(--ink);padding:0 12px;font:inherit;font-size:13px}
.linkbox .btn{width:auto}
.field{height:50px;border-radius:13px;border:1px solid var(--faint);background:var(--deep);color:var(--ink);padding:0 14px;font:inherit;width:100%}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.trow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);text-align:left;width:100%}
.trow .n{font-family:var(--f-disp);font-size:24px;width:28px;text-align:center;color:var(--gold)}
.trow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.trow .t b{font-weight:600}
.trow .t small{color:var(--muted);font-size:12px}
.trow[disabled]{opacity:.5;cursor:default}
.trow.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
.ctop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}
.tpill{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;min-width:0}
.tpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpill svg{width:18px;height:18px}
.tools{position:absolute;right:10px;top:72px;z-index:4;display:flex;flex-direction:column;gap:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tool .ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);color:#1A1206;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;text-shadow:none}
.cbottom{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:40px 0 18px;background:linear-gradient(to top,rgba(7,5,15,.92),rgba(7,5,15,0));display:flex;flex-direction:column;gap:10px;align-items:center}
.fxname{font-family:var(--f-disp);font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.9);min-height:1.3em}
.fxname.rec{color:var(--kumkum);font-family:var(--f-ui);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.fx{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:6px calc(50% - 31px);scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fxb{flex:none;width:62px;height:62px;border-radius:50%;overflow:hidden;scroll-snap-align:center;border:2px solid rgba(246,235,210,.3);position:relative;background:var(--panel);transition:transform .2s,border-color .2s}
.fxb canvas{width:100%;height:100%;object-fit:cover;display:block}
.fxb.on{border-color:var(--gold);transform:scale(1.08);box-shadow:0 0 0 3px rgba(233,180,76,.25),0 0 20px rgba(233,180,76,.45)}
.fxb .tx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;color:var(--gold2)}
.shrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 18px}
.side{width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.side .ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.shutter{width:80px;height:80px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;position:relative}
.shutter i{width:62px;height:62px;border-radius:50%;background:var(--kumkum);transition:all .25s cubic-bezier(.3,1.4,.5,1)}
.shutter.live{border-color:var(--kumkum)}
.shutter.live i{width:28px;height:28px;border-radius:8px}
.next{height:42px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--deep);font-weight:700;display:flex;align-items:center;gap:4px}
.next svg{width:18px;height:18px}
.guide{position:absolute;left:14px;right:72px;top:72px;z-index:4;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.guide canvas{width:100%;height:60px;border-radius:8px;display:block}
.rescard{position:absolute;left:14px;right:14px;bottom:214px;z-index:5;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .45s cubic-bezier(.2,.9,.2,1)}
.rescard.ok{background:rgba(16,44,34,.95);border:1px solid rgba(127,209,166,.5)}
.rescard.bad{background:rgba(58,16,22,.95);border:1px solid rgba(255,142,132,.5)}
.rescard canvas{width:100%;height:64px;border-radius:10px;display:block;background:rgba(7,5,15,.6)}
.resrow{display:flex;align-items:center;gap:12px}
.resrow b{font-family:var(--f-disp);font-size:21px;display:block;line-height:1.1}
.resrow small{font-size:13px;color:var(--ink)}
.rescard.ok .resrow b,.rescard.ok .pct{color:var(--ok)}
.rescard.bad .resrow b,.rescard.bad .pct{color:var(--bad)}
.pct{font-family:var(--f-disp);font-size:34px;margin-left:auto;font-variant-numeric:tabular-nums}
.rpanel{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:56px 16px 18px;background:linear-gradient(to top,var(--deep) 62%,rgba(7,5,15,0));display:flex;flex-direction:column;gap:12px}
.rpanel textarea{width:100%;height:58px;border-radius:13px;background:rgba(23,16,38,.9);border:1px solid var(--faint);color:var(--ink);padding:10px 12px;font:inherit;resize:none}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.sum span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(246,235,210,.08);border:1px solid var(--faint)}
.top{position:absolute;inset:0;overflow-y:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border-radius:16px;padding:14px;border:1px solid var(--faint)}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:32px;color:var(--gold2);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lb{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-radius:18px;background:var(--panel);border:1px solid var(--faint);width:100%;text-align:left}
.lrow .rk{font-family:var(--f-disp);font-size:26px;width:30px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.lrow:first-child{border-color:rgba(233,180,76,.45);background:linear-gradient(90deg,rgba(233,180,76,.1),var(--panel) 60%)}
.lthumb{width:50px;height:78px;border-radius:10px;overflow:hidden;flex:none;background:var(--deep)}
.lthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.lmid{flex:1;min-width:0}
.lmid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmid small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcount{display:flex;flex-direction:column;align-items:center;color:var(--gold2);font-family:var(--f-disp);font-size:20px;line-height:1;gap:2px;font-variant-numeric:tabular-nums}

/* ---------- sing: Yousician-style practice ---------- */
const SN=TT[0].notes,SPB=60/TT[0].bpm,SONG=TT[0].total*SPB;
const SWN={'-5':'Pa','-2':'Ni',0:'Sa',1:'Ri',5:'Ma',7:'Pa',10:'Ni',12:'Sa',13:'Ri'};
const PITCH_TOL=50,NOTE_HIT=.5,PASS_MARK=80;
const PHRASES=[];[1,2,3,4].forEach(l=>{const ks=SN.map((n,k)=>k).filter(k=>SN[k].line===l);PHRASES.push({line:l,part:1,ks:ks.slice(0,12)},{line:l,part:2,ks:ks.slice(12)});});
const G={st:'idle',ac:null,stream:null,an:null,buf:null,mr:null,chunks:[],t0:0,recStart:0,frames:[],res:[],raf:0,guideSrc:[],guide:'sitar',drone:true,anyKey:false,keyOff:0,keyLocked:true,lat:.08,streak:0,best:0,only:null,parts:[],pops:[],count:0};
const circ=d=>((d+600)%1200+1200)%1200-600;
function yinF(x,sr){const W=x.length>>1,tmin=Math.floor(sr/1000),tmax=Math.min(W-1,Math.floor(sr/70));let rms=0;for(let i=0;i<W;i++)rms+=x[i]*x[i];if(Math.sqrt(rms/W)<.008)return NaN;
 const d=new Float32Array(tmax+1);for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0,tau=-1;const c=new Float32Array(tmax+1);for(let t=1;t<=tmax;t++){run+=d[t];c[t]=d[t]*t/(run||1);}
 for(let t=tmin;t<=tmax;t++){if(c[t]<.15){while(t+1<=tmax&&c[t+1]<c[t])t++;tau=t;break;}}if(tau<0)return NaN;
 const a=c[tau-1],b=c[tau],e=c[tau+1]||b,den=a-2*b+e,f=sr/(tau+(den?.5*(a-e)/den:0));return 1200*Math.log2(f/196);}
function judge(k,frames,keyOff){const n=SN[k],s=n.beat*SPB,d=n.dur*SPB;let best={on:0,med:null};
 for(let sh=-.05;sh<=.451;sh+=.025){const a=s+.18*d+sh,b=s+.85*d+sh;const dv=[];for(const f of frames){if(f.t<a)continue;if(f.t>b)break;if(!isNaN(f.c))dv.push(circ(f.c-keyOff-n.semi*100));}
  if(!dv.length)continue;const on=dv.filter(x=>Math.abs(x)<=PITCH_TOL).length/dv.length;if(on>best.on||best.med===null){dv.sort((x,y)=>x-y);best={on,med:dv[dv.length>>1]};}}
 return{on:best.on,med:best.med,hit:best.on>=NOTE_HIT};}
function keyFrom(frames,ks){const dv=[];ks.forEach(k=>{const no=SN[k],a=no.beat*SPB,b=a+no.dur*SPB+.45;frames.forEach(f=>{if(f.t>=a&&f.t<=b&&!isNaN(f.c))dv.push({c:f.c,s:no.semi*100});});});
 if(dv.length<8)return 0;let best=0,bo=0;for(let off=0;off<1200;off+=5){let n=0;for(const d of dv)if(Math.abs(circ(d.c-d.s-off))<=40)n++;if(n>best){best=n;bo=off;}}
 const near=dv.map(d=>circ(d.c-d.s-bo)).filter(x=>Math.abs(x)<=40).sort((x,y)=>x-y);return (bo+(near.length?near[near.length>>1]:0)+1200)%1200;}
function totals(res){const w=SN.map(n=>n.dur);let sw=0,on=0,hit=0,nh=0;res.forEach((r,k)=>{if(!r)return;sw+=w[k];on+=w[k]*r.on;hit+=w[k]*(r.hit?1:0);nh+=r.hit?1:0;});return{score:sw?Math.round(100*(.5*on+.5*hit)/sw):0,hits:nh,judged:res.filter(Boolean).length};}

const SG=$('#v-sing');
function openSing(){stopCur();S.source=S.source;showView('sing');singReset();}
function singReset(){singStop(true);G.st='idle';G.res=new Array(SN.length).fill(null);G.frames=[];G.streak=0;G.best=0;G.pops=[];G.only=null;G.keyOff=0;G.keyLocked=!G.anyKey;G.nowK=-1;G.lyLine=0;
 $('#sg-result').hidden=true;$('#sg-go').hidden=false;$('#sg-go').className='sg-go';$('#sg-go').innerHTML='<span>Start</span>';$('#sg-count').hidden=true;
 $('#sg-guide').innerHTML=ico('music')+'<span>'+INSTR[G.guide]+'</span>';$('#sg-key').innerHTML='<span>'+(G.anyKey?'Any key':'Key of G · any octave')+'</span>';
 paintHUD();singDraw(-1.2);}
function paintHUD(){const t=totals(G.res);$('#sg-score').textContent=t.score;$('#sg-streak').textContent=G.streak;$('#sg-hits').textContent=t.hits+'/'+SN.length;}
function curNote(t){for(let k=0;k<SN.length;k++){const s=SN[k].beat*SPB,e=s+SN[k].dur*SPB;if(t<e)return t>=s-.3?k:Math.max(0,k);}return SN.length-1;}
function paintNow(t){const k=Math.max(0,curNote(t)),n=SN[k];if(G.nowK===k)return;G.nowK=k;$('#sg-dev').textContent=n.dev;$('#sg-ia').textContent=n.iast+' · '+SWN[n.semi];
 const L=$('#sg-lyric');if(G.lyLine!==n.line){G.lyLine=n.line;L.innerHTML=SN.map((x,i)=>x.line===n.line?'<span data-k="'+i+'">'+esc(x.dev)+'</span>':'').join('');}
 L.querySelectorAll('span').forEach(s=>{const i=+s.dataset.k;s.className=i===k?'now':(G.res[i]?(G.res[i].hit?'hit':'miss'):'');});}

let LG=null;
function laneCtx(){const c=$('#c-sing'),w=c.clientWidth,h=c.clientHeight;if(!LG||LG.w!==w||LG.h!==h){const d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);LG={g,w,h};}return LG;}
const LO=-4,HI=15;
function singDraw(t){const{g,w,h}=laneCtx();const pps=w/4.6,nowX=w*.28,top=10,bot=h-10,yC=c=>top+(HI-c/100)/(HI-LO)*(bot-top),rowH=(bot-top)/(HI-LO);
 g.clearRect(0,0,w,h);
 Object.keys(SWN).forEach(k=>{const s=+k,y=yC(s*100);g.fillStyle=s%12===0?'rgba(233,180,76,.12)':'rgba(246,235,210,.045)';g.fillRect(0,y-rowH*.45,w,rowH*.9);g.fillStyle=s%12===0?'#E9B44C':'rgba(246,235,210,.45)';g.font='600 11px Mukta,system-ui';g.textBaseline='middle';g.fillText(SWN[k]+(s>=12?'′':s<0?'·':''),6,y);});
 for(let b=Math.ceil((t-nowX/pps)/SPB);b*SPB<t+(w-nowX)/pps;b++){const x=nowX+(b*SPB-t)*pps;if(x<30)continue;g.fillStyle=b%4?'rgba(246,235,210,.04)':'rgba(246,235,210,.09)';g.fillRect(x,0,1,h);}
 SN.forEach((n,k)=>{if(G.only&&!G.only.includes(k))return;const s=n.beat*SPB,e=s+n.dur*SPB,x0=nowX+(s-t)*pps,x1=nowX+(e-t)*pps-3;if(x1<30||x0>w)return;const y=yC(n.semi*100),r=G.res[k],act=t>=s&&t<e;
  g.fillStyle=r?(r.hit?'#7FD1A6':'rgba(255,142,132,.75)'):(act?'#FFF4D6':(e<t?'rgba(246,213,142,.35)':'#F6D58E'));
  const xa=Math.max(30,x0),hh=rowH*.86;g.beginPath();if(g.roundRect)g.roundRect(xa,y-hh/2,Math.max(4,x1-xa),hh,hh/2);else g.rect(xa,y-hh/2,Math.max(4,x1-xa),hh);g.fill();
  if(x1-xa>22){g.fillStyle='#1A1206';g.font='15px "Tiro Devanagari Sanskrit",serif';g.textBaseline='middle';g.fillText(n.dev,xa+7,y+1);}});
 // singer's pitch trail, folded to the octave of the nearest note
 let last=null;g.lineWidth=3;g.lineCap='round';
 for(let i=Math.max(0,G.frames.length-400);i<G.frames.length;i++){const f=G.frames[i],x=nowX+(f.t-t)*pps;if(x<30||isNaN(f.c)){last=null;continue;}
  const k=Math.max(0,curNote(f.t)),tgt=SN[k].semi*100+G.keyOff,c=tgt+circ(f.c-tgt)-G.keyOff,y=yC(c),on=Math.abs(circ(f.c-G.keyOff-SN[k].semi*100))<=PITCH_TOL;
  if(last){g.strokeStyle=on?'#FFE6A8':'rgba(255,142,132,.9)';g.beginPath();g.moveTo(last.x,last.y);g.lineTo(x,y);g.stroke();}last={x,y,on};}
 g.fillStyle='rgba(246,235,210,.9)';g.fillRect(nowX-1,0,2,h);
 if(last&&G.st==='run'){g.fillStyle=last.on?'#FFE6A8':'#FF8E84';g.beginPath();g.arc(last.x,last.y,7,0,7);g.fill();g.fillStyle=last.on?'rgba(255,230,168,.25)':'rgba(255,142,132,.2)';g.beginPath();g.arc(last.x,last.y,16,0,7);g.fill();}
 G.pops=G.pops.filter(p=>t-p.t<.9);G.pops.forEach(p=>{const a=1-(t-p.t)/.9,y=yC(p.c)-24-(t-p.t)*40;g.globalAlpha=a;g.fillStyle=p.col;g.font='700 14px Mukta,system-ui';g.textAlign='center';g.fillText(p.txt,nowX+30,y);g.textAlign='left';
  if(p.hit)for(let q=0;q<8;q++){const an=q/8*Math.PI*2,rr=(t-p.t)*70;g.fillRect(nowX+Math.cos(an)*rr-1.5,yC(p.c)+Math.sin(an)*rr-1.5,3,3);}g.globalAlpha=1;});
 paintNow(Math.max(0,t));
 const pr=G.only?0:Math.max(0,Math.min(1,t/SONG));$('#sg-prog').style.width=(pr*100).toFixed(1)+'%';}

async function singStart(){if(G.st==='run'||G.st==='count'){singFinish();return;}
 singReset();
 if(!AUD.ready){toast('The guide audio is still loading. Try again in a second.');return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){singNoMic();return;}
 try{G.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});}catch(e){singNoMic();return;}
 const ac=G.ac=new AC();if(ac.resume)ac.resume();const src=ac.createMediaStreamSource(G.stream);G.an=ac.createAnalyser();G.an.fftSize=2048;src.connect(G.an);G.buf=new Float32Array(2048);
 G.lat=(ac.baseLatency||0)+(ac.outputLatency||0)+.06;
 try{G.chunks=[];G.mr=new MediaRecorder(G.stream);G.mr.ondataavailable=e=>{if(e.data.size)G.chunks.push(e.data);};G.mr.start();G.recStart=ac.currentTime;}catch(e){G.mr=null;}
 const lead=G.only?0:3;const from=G.only?Math.max(0,SN[G.only[0]].beat*SPB-1.6):0,to=G.only?SN[G.only[G.only.length-1]].beat*SPB+SN[G.only[G.only.length-1]].dur*SPB+.8:SONG+1.4;
 G.t0=ac.currentTime+lead+.15-from;G.end=to;
 const m=ac.createGain();m.gain.value=.9;m.connect(ac.destination);
 const lay=(id,gain)=>{const b=AUD.buf[id];if(!b)return;const s=ac.createBufferSource(),gg=ac.createGain();gg.gain.value=gain;s.buffer=b;s.connect(gg);gg.connect(m);s.start(G.t0+from,from,to-from+.3);G.guideSrc.push(s);};
 lay(G.guide,.8);if(G.drone)lay('drone_tanpura',.35);
 G.st=lead?'count':'run';$('#sg-go').className='sg-go live';$('#sg-go').innerHTML='<span>Stop</span>';$('#sg-tip').hidden=true;
 const W=1024,ds=new Float32Array(W),sr=ac.sampleRate/2;
 const loop=()=>{const t=ac.currentTime-G.t0;
  if(G.st==='count'){const n=Math.ceil(G.t0+from-ac.currentTime),cnt=$('#sg-count');if(n<=0){cnt.hidden=true;G.st='run';}else if(n<=3){cnt.hidden=false;if(cnt.textContent!==String(n)){cnt.textContent=n;cnt.style.animation='none';void cnt.offsetWidth;cnt.style.animation='';}}}
  if(G.st==='run'||G.st==='count'){G.an.getFloatTimeDomainData(G.buf);for(let i=0;i<W;i++)ds[i]=(G.buf[2*i]+G.buf[2*i+1])*.5;const c=yinF(ds,sr);G.frames.push({t:t-G.lat-.021,c});
   if(G.anyKey&&!G.keyLocked){const ks=(G.only||SN.map((n,k)=>k)).slice(0,4),lastK=ks[ks.length-1],e=SN[lastK].beat*SPB+SN[lastK].dur*SPB;if(t>e+.4){G.keyOff=keyFrom(G.frames,ks);G.keyLocked=true;toast('Your Sa is set. Keep going');}}
   if(G.keyLocked)SN.forEach((n,k)=>{if(G.res[k]||(G.only&&!G.only.includes(k)))return;const e=n.beat*SPB+n.dur*SPB;if(t>e+.4){const r=judge(k,G.frames,G.keyOff);G.res[k]=r;
    if(r.hit){G.streak++;G.best=Math.max(G.best,G.streak);}else G.streak=0;
    G.pops.push({t,c:n.semi*100,txt:r.on>=.8?'Perfect':r.hit?'Good':'Miss',col:r.on>=.8?'#FFE6A8':r.hit?'#7FD1A6':'#FF8E84',hit:r.hit});paintHUD();}});
   if(t>G.end){singFinish();return;}}
  singDraw(t);G.raf=requestAnimationFrame(loop);};
 loop();}
function singStop(silent){cancelAnimationFrame(G.raf);G.guideSrc.forEach(s=>{try{s.stop();}catch(e){}});G.guideSrc=[];
 if(G.mr&&G.mr.state==='recording'){G.mr.onstop=null;try{G.mr.stop();}catch(e){}}G.mr=silent?null:G.mr;
 if(G.stream){G.stream.getTracks().forEach(t=>t.stop());G.stream=null;}if(G.ac&&silent){closeAC(G.ac);G.ac=null;}if(silent)G.st='idle';}
function singFinish(){if(G.st!=='run'&&G.st!=='count')return;const ac=G.ac,recLead=G.t0-G.recStart;G.st='done';
 const mr=G.mr;G.mr=null;cancelAnimationFrame(G.raf);G.guideSrc.forEach(s=>{try{s.stop();}catch(e){}});G.guideSrc=[];if(G.stream){G.stream.getTracks().forEach(t=>t.stop());G.stream=null;}
 G.takeBuf=null;G.takeOffset=Math.max(0,recLead);
 G.takeBlob=null;if(mr&&mr.state==='recording'){mr.onstop=async()=>{try{const b=new Blob(G.chunks,{type:mr.mimeType});G.takeBlob=b;G.takeBuf=await ac.decodeAudioData(await b.arrayBuffer());}catch(e){}closeAC(ac);};mr.stop();}else{closeAC(ac);}
 $('#sg-count').hidden=true;singResults(totals(G.res),G.res,false);}
function singNoMic(){openSheet('mic','<div class="shead"><div><h2 class="sh-title">We can’t hear your microphone</h2><p class="note">Allow microphone access for this site in your browser settings, then try again. You can also check a recording you made.</p></div><button class="icon-btn glass" id="sh-x" aria-label="Close">'+ico('x')+'</button></div>'+
 '<label class="btn gold" for="sg-file">'+ico('upload')+'Check a recording</label>');$('#sh-x').onclick=closeSheet;}

/* ---------- offline check: same rules as tune_check.py ---------- */
async function to16k(buf){const n=Math.ceil(buf.duration*16000),oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,n,16000),s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();const r=await oc.startRendering();return r.getChannelData(0);}
function trackOff(x,sr,hop){const W=400,out=[];for(let i=0;i+W*2<x.length;i+=Math.round(hop*sr))out.push({t:out.length*hop,c:yinF(x.subarray(i,i+W*2),sr)});return out;}
function dtwOff(u,r,off){const n=u.length,m=r.length,INF=1e18;let prev=new Float64Array(m+1).fill(INF);prev[0]=0;const back=new Uint8Array((n+1)*(m+1));
 for(let i=1;i<=n;i++){const curR=new Float64Array(m+1).fill(INF);const lo=Math.max(1,Math.floor(i*m/n-.5*m)),hi=Math.min(m,Math.ceil(i*m/n+.5*m));
  for(let j=lo;j<=hi;j++){const c=Math.min(3,Math.abs(circ(u[i-1]-off-r[j-1]))/100);const a=prev[j-1],b=prev[j]+.3,d=curR[j-1]+.3;let mn=a,bk=0;if(b<mn){mn=b;bk=1;}if(d<mn){mn=d;bk=2;}curR[j]=c+mn;back[i*(m+1)+j]=bk;}prev=curR;}
 const cost=prev[m]/(n+m),path=[];let i=n,j=m;while(i>0&&j>0){path.push([i-1,j-1]);const bk=back[i*(m+1)+j];if(bk===0){i--;j--;}else if(bk===1)i--;else j--;}return{cost,path:path.reverse()};}
function checkOffline(fr){const hop=.025;let first=fr.findIndex(f=>!isNaN(f.c)),last=fr.length-1;while(last>0&&isNaN(fr[last].c))last--;
 if(first<0||fr.filter(f=>!isNaN(f.c)).length*hop<3)return null;
 const seg=fr.slice(first,last+1),u=seg.map(f=>f.c);let lv=u.find(v=>!isNaN(v));const uf=u.map(v=>isNaN(v)?lv:(lv=v));
 const ref=[];for(let t=0;t<SONG;t+=hop){const k=Math.max(0,SN.findIndex((n,i)=>i+1===SN.length||SN[i+1].beat*SPB>t));ref.push(SN[k].semi*100);}
 const us=uf.filter((v,i)=>i%2===0),rs=ref.filter((v,i)=>i%2===0);let best=null;for(let k=0;k<12;k++){const d=dtwOff(us,rs,k*100);if(!best||d.cost<best.cost)best={cost:d.cost,off:k*100,path:d.path};}
 const P=best.path.map(([i,j])=>[i*2*hop,j*2*hop]);let keep=P.map(()=>true),a=0,b=1;
 for(let it=0;it<3;it++){let n=0,sx=0,sy=0,sxx=0,sxy=0;P.forEach((p,q)=>{if(!keep[q])return;n++;sx+=p[1];sy+=p[0];sxx+=p[1]*p[1];sxy+=p[1]*p[0];});b=(n*sxy-sx*sy)/(n*sxx-sx*sx);a=(sy-b*sx)/n;
  const err=P.map(p=>Math.abs(p[0]-(a+b*p[1])));const srt=err.slice().sort((x,y)=>x-y),thr=Math.max(.15,srt[Math.floor(srt.length*.7)]);keep=err.map(e=>e<thr);}
 b=Math.min(1.6,Math.max(.6,b));const resid=best.path.map(([i,j])=>circ(us[i]-best.off-rs[j])).sort((x,y)=>x-y),off=best.off+resid[resid.length>>1];
 const frames=seg.map((f,i)=>({t:(i*hop-a)/b,c:f.c}));
 const res=new Array(SN.length).fill(null);
 PHRASES.forEach(p=>{let bs=null;for(let sh=-.2;sh<=.201;sh+=.02){let sc=0;const rr=p.ks.map(k=>{const r=judgeAt(k,frames,off,sh);sc+=SN[k].dur*r.on;return r;});if(!bs||sc>bs.sc)bs={sc,rr};}p.ks.forEach((k,q)=>res[k]=bs.rr[q]);});
 return{res,tot:totals(res),start:a+first*hop,tempo:b,off:((off%1200)+1200)%1200};}
function judgeAt(k,frames,keyOff,sh){const n=SN[k],s=n.beat*SPB,d=n.dur*SPB,a=s+.18*d+sh,b=s+.85*d+sh,dv=[];frames.forEach(f=>{if(f.t>=a&&f.t<=b&&!isNaN(f.c))dv.push(circ(f.c-keyOff-n.semi*100));});
 const on=dv.length?dv.filter(x=>Math.abs(x)<=PITCH_TOL).length/dv.length:0;return{on,hit:on>=NOTE_HIT};}
async function singUpload(file){if(S.view!=='sing'){showView('sing');singReset();}toast('Checking your recording…');
 try{const ac=new AC(),buf=await ac.decodeAudioData(await file.arrayBuffer());closeAC(ac);await new Promise(r=>setTimeout(r,30));const x=await to16k(buf),fr=trackOff(x,16000,.025),r=checkOffline(fr);
  if(!r){toast('We didn’t hear enough singing in that file.');return;}G.res=r.res;G.takeBuf=buf;G.takeBlob=file;G.takeOffset=Math.max(0,r.start);singDraw(-1.2);singResults(r.tot,r.res,true);}catch(e){toast('Couldn’t read that audio. Try another file.');}}
function singResults(tot,res,offline,label){const box=$('#sg-result'),pass=tot.score>=PASS_MARK&&tot.judged>=SN.length*(G.only?0:1);
 const lines=[1,2,3,4].map(l=>{const ks=SN.map((n,k)=>k).filter(k=>SN[k].line===l&&res[k]);const h=ks.filter(k=>res[k].hit).length;return{l,h,n:ks.length};});
 const weak=PHRASES.filter(p=>p.ks.some(k=>res[k]&&!res[k].hit));
 const lamps=[60,80,95].map(th=>'<span class="lamp'+(tot.score>=th?' on':'')+'">'+ico('lotus')+'</span>').join('');
 box.innerHTML='<div class="sg-card"><p class="eyebrow">'+(label?esc(label):G.only?'Line practice':'Your take')+'</p><div class="lamps">'+lamps+'</div><div class="sg-big">'+tot.score+'</div>'+
  '<p class="count"><b>'+tot.hits+'</b> of '+tot.judged+' notes on pitch'+(G.best?' · best streak <b>'+G.best+'</b>':'')+'</p>'+
  '<div class="sg-lines">'+lines.filter(x=>x.n).map(x=>'<div class="sg-ln"><span>Line '+x.l+'</span><i><b style="width:'+Math.round(100*x.h/x.n)+'%"></b></i><span>'+x.h+'/'+x.n+'</span></div>').join('')+'</div>'+
  (weak.length?'<p class="lab" style="text-align:left">Practise these</p><div class="chips">'+weak.slice(0,6).map(p=>'<button class="chip" data-ph="'+(p.line*10+p.part)+'">Line '+p.line+(p.part===1?', first half':', second half')+'</button>').join('')+'</div>':'')+
  (G.only?'':pass?'<p class="note" style="color:var(--ok)">That’s a match. You can share it.</p>':'<p class="note">'+PASS_MARK+' is needed to share. You’re '+Math.max(0,PASS_MARK-tot.score)+' away.</p>')+
  '<div class="row2"><button class="btn line" id="sg-again">'+ico('replay')+(G.only?'Full verse':'Try again')+'</button>'+(pass&&!G.only?'<button class="btn gold" id="sg-share">Share your take</button>':'')+'</div></div>';
 box.hidden=false;$('#sg-go').hidden=true;
 $('#sg-again').onclick=()=>{G.only=null;singReset();};
 box.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{const v=+b.dataset.ph,p=PHRASES.find(x=>x.line*10+x.part===v);singReset();G.only=p.ks;singDraw(SN[p.ks[0]].beat*SPB-1.6);$('#sg-tip').hidden=false;$('#sg-tip').textContent='Practising line '+p.line+(p.part===1?', first half':', second half')+'. Press Start.';});
 const sh=$('#sg-share');if(sh)sh.onclick=()=>{S.source='sung';S.score=tot.score;S.takeBuf=G.takeBuf;S.takeBlob=G.takeBlob||null;S.takeOffset=G.takeOffset||0;if(G.takeBuf)S.style.Recitation='My recording';openReview();};}

$('#sg-close').innerHTML=ico('x');$('#sg-close').onclick=()=>{singStop(true);showView('create');renderTools();renderFx(true);startPreview();};
$('#sg-go').onclick=()=>singStart();
$('#sg-file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f){closeSheet();singUpload(f);}};
$('#sg-up').innerHTML=ico('upload')+'<span>Check a file</span>';
$('#sg-key').onclick=()=>{if(G.st==='run'||G.st==='count')return;G.anyKey=!G.anyKey;singReset();toast(G.anyKey?'Sing in any key: the first 4 notes set your Sa':'Key of G: sing along with the guide, any octave');};
$('#sg-guide').onclick=()=>{if(G.st==='run'||G.st==='count')return;openSheet('guide','<div class="shead"><div><h2 class="sh-title">Guide</h2><p class="note">The pre-recorded instrument you sing along with.</p></div><button class="icon-btn glass" id="sh-x" aria-label="Done">'+ico('check')+'</button></div><div class="chips" id="gd-ch"></div><label class="chk"><input type="checkbox" id="gd-dr"> Tanpura drone</label>');
 const paint=()=>{$('#gd-ch').innerHTML=Object.keys(INSTR).map(k=>'<button class="chip'+(G.guide===k?' on':'')+'" data-k="'+k+'">'+INSTR[k]+'</button>').join('');};paint();$('#gd-dr').checked=G.drone;
 $('#gd-ch').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;G.guide=b.dataset.k;paint();$('#sg-guide').innerHTML=ico('music')+'<span>'+INSTR[G.guide]+'</span>';};$('#gd-dr').onchange=e=>G.drone=e.target.checked;$('#sh-x').onclick=closeSheet;};
addEventListener('resize',()=>{if(S.view==='sing'&&G.st!=='run')singDraw(-1.2);});

/* ---------- boot ---------- */
setSoundIcons();renderFeed(true);loadReels();
setInterval(()=>{if(!document.hidden&&S.view!=='create'&&S.view!=='sing')loadReels();},25000);
})();

</script>
