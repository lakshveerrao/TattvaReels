<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hey Tattva</title>
<meta name="description" content="Short reels that teach the eight tattvas of the Dakṣiṇāmūrti Aṣṭakam. Watch, sing the verse, and share what you learnt.">
<meta name="theme-color" content="#15123A">
<meta property="og:title" content="Hey Tattva"><meta property="og:description" content="The world, like a city in a mirror. Watch, sing and share the eight tattvas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307050F'/%3E%3Cg fill='none' stroke='%23E9B44C' stroke-width='3' stroke-linejoin='round'%3E%3Cpath d='M32 52c-6-5-9-11-9-19 0-7 3-14 9-19 6 5 9 12 9 19 0 8-3 14-9 19Z'/%3E%3Cpath d='M32 52c-11 0-20-6-23-16 6-1 12 1 16 5'/%3E%3Cpath d='M32 52c11 0 20-6 23-16-6-1-12 1-16 5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;600;700&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Mukta:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Serif+Telugu:wght@500;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Serif+Kannada:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column, full-height; Reels feed is a vertical snap scroller, sheets rise from the bottom. Single deliberate dark world: temple night, lamp gold, kumkum. */
:root{
  /* modern Vedic: sanctum night, kumkum, haldi (turmeric) gold, chandan (sandalwood) */
  --night:#15123A;--deep:#100D2E;--panel:#1F1A4E;--panel2:#2A2462;
  --ink:#F7EBD3;--muted:#B4ABCF;--faint:rgba(242,227,198,.16);
  --gold:#F4B73A;--gold2:#FFD98A;--saffron:#E8892A;--kumkum:#C4262E;--chandan:#F2E3C6;--ok:#8FD49A;--bad:#FF8E84;
  --f-disp:'Eczar','Noto Serif Telugu','Noto Serif Kannada',Georgia,serif;--f-dev:'Tiro Devanagari Sanskrit','Noto Serif Telugu','Noto Serif Kannada',Georgia,serif;--f-ui:'Mukta','Noto Sans Telugu','Noto Sans Kannada','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  background:var(--night) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g fill='none' stroke='%23E9B44C' stroke-opacity='.07'><circle cx='120' cy='120' r='100'/><circle cx='120' cy='120' r='70'/><path d='M120 30 198 165H42Z'/><path d='M120 210 42 75h156Z'/><circle cx='120' cy='120' r='4'/></g></svg>") center/240px repeat}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--deep)}
@media (min-width:720px){#app{height:calc(100% - 32px);margin-top:16px;border-radius:26px;box-shadow:0 0 0 1px var(--faint),0 40px 90px rgba(0,0,0,.7)}}
.view{position:absolute;left:0;right:0;top:0;bottom:58px}
.view.full{bottom:0;z-index:8;background:var(--deep)}
.nav{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:6;display:flex;justify-content:space-around;align-items:center;background:var(--deep);border-top:1px solid var(--faint)}
.nav button{width:72px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11px;font-weight:600}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .create{width:54px;height:36px;border-radius:11px;border:1.5px solid var(--gold);color:var(--gold);flex-direction:row}
.topbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{font-family:var(--f-disp);font-size:27px;line-height:1;display:flex;align-items:baseline;gap:8px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.logo small{font-family:var(--f-dev);font-size:18px;color:var(--gold)}
.glass{background:rgba(7,5,15,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--faint)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.hint{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;animation:bob 2.4s ease-in-out infinite}
.hint svg{width:18px;height:18px}
@keyframes bob{50%{transform:translateX(-50%) translateY(3px)}}
.reels{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--deep);-webkit-user-select:none;user-select:none}
.reel>canvas,.stagecv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(7,5,15,.6) 0,rgba(7,5,15,0) 16%,rgba(7,5,15,0) 48%,rgba(7,5,15,.88) 100%)}
.rail{position:absolute;right:6px;bottom:104px;z-index:2;display:flex;flex-direction:column;gap:18px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.rbtn svg{width:32px;height:32px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.rbtn.on{color:var(--gold)}
.rbtn.on svg{fill:rgba(233,180,76,.38)}
.rbtn.pop svg{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.cap{position:absolute;left:14px;right:70px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-disp);font-size:15px;color:#1A1206;text-shadow:none;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 2px var(--deep),0 0 0 3.5px var(--gold)}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:5px;border:1px solid rgba(246,235,210,.45)}
.rtitle{font-family:var(--f-disp);font-size:21px;line-height:1.15}
.rtitle span{color:var(--gold2)}
.rcap{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pada{min-height:3.5em;display:flex;flex-direction:column;gap:1px;transition:opacity .35s}
.pada.swap{opacity:0}
.pada .dev{font-family:var(--f-dev);font-size:19px;line-height:1.35;color:var(--gold2)}
.pada .ia{font-family:var(--f-dev);font-style:italic;font-size:13px;color:var(--muted)}
.music{display:flex;align-items:center;gap:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.music svg{width:15px;height:15px}
.music .mq{overflow:hidden;flex:1;min-width:0;-webkit-mask-image:linear-gradient(to right,#000 80%,transparent);mask-image:linear-gradient(to right,#000 80%,transparent)}
.music .mq span{display:inline-block;padding-right:40px;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(246,235,210,.16);z-index:2}
.prog i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.flash{position:absolute;left:50%;top:46%;width:78px;height:78px;margin:-39px;border-radius:50%;background:rgba(7,5,15,.55);display:grid;place-items:center;z-index:3;pointer-events:none;animation:flash .75s ease forwards}
.flash svg{width:34px;height:34px}
@keyframes flash{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.burst{position:absolute;width:120px;height:120px;margin:-60px;pointer-events:none;z-index:5;color:var(--gold)}
.burst svg{width:100%;height:100%;fill:rgba(233,180,76,.6);stroke-width:1.2;filter:drop-shadow(0 0 14px rgba(233,180,76,.8));animation:burst .95s cubic-bezier(.2,1.4,.4,1) forwards}
.burst i{position:absolute;left:50%;top:50%;width:8px;height:15px;margin:-7px -4px;border-radius:50%;background:var(--gold2);transform:rotate(var(--a));animation:petal .9s ease-out forwards}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.12);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.25) translateY(-36px);opacity:0}}
@keyframes petal{to{transform:rotate(var(--a)) translateY(-78px);opacity:0}}
.endcard{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;padding:16px 16px 22px;background:rgba(7,5,15,.5);animation:fade .35s}
.ecard{width:100%;background:rgba(23,16,38,.94);border:1px solid rgba(233,180,76,.35);border-radius:22px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:rise .5s cubic-bezier(.2,.9,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.teach{font-family:var(--f-disp);font-size:22px;line-height:1.25;text-wrap:balance}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{height:48px;border-radius:13px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 14px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--saffron));color:#1A1206}
.btn.line{border:1px solid var(--faint)}
.btn.done{background:rgba(233,180,76,.14);color:var(--gold);border:1px solid rgba(233,180,76,.5)}
.row2{display:flex;gap:10px}
.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid rgba(233,180,76,.32);transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s}
.sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1)}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(246,235,210,.25);margin:10px auto 2px;flex:none}
.sbody{overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-title{font-family:var(--f-disp);font-size:25px;line-height:1.15;margin:0;text-wrap:balance}
.lab{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--faint);font-size:14px;background:var(--panel2)}
.chip.on{background:var(--gold);color:#1A1206;border-color:var(--gold);font-weight:600}
.learnbox{background:linear-gradient(180deg,rgba(233,180,76,.13),rgba(233,180,76,.03));border:1px solid rgba(233,180,76,.32);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.bignum{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.bignum.bump{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.shloka{display:flex;flex-direction:column}
.ln{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--faint)}
.ln:last-child{border-bottom:0}
.ln .dev{font-family:var(--f-dev);font-size:19px;line-height:1.4;color:var(--gold2)}
.ln .ia{font-family:var(--f-dev);font-style:italic;font-size:13px;color:var(--muted)}
.ln .en{font-size:14px}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.word{background:var(--panel2);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;min-width:0}
.word b{font-family:var(--f-dev);font-style:italic;font-weight:400;color:var(--gold2);font-size:15px}
.word span{font-size:13px;color:var(--muted)}
.keep{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.keep li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.keep svg{color:var(--gold);width:20px;height:20px;margin-top:2px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--faint);background:var(--deep);color:var(--ink);padding:0 12px;font:inherit;font-size:13px}
.linkbox .btn{width:auto}
.field{height:50px;border-radius:13px;border:1px solid var(--faint);background:var(--deep);color:var(--ink);padding:0 14px;font:inherit;width:100%}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.trow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);text-align:left;width:100%}
.trow .n{font-family:var(--f-disp);font-size:24px;width:28px;text-align:center;color:var(--gold)}
.trow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.trow .t b{font-weight:600}
.trow .t small{color:var(--muted);font-size:12px}
.trow[disabled]{opacity:.5;cursor:default}
.trow.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
.ctop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}
.tpill{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;min-width:0}
.tpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpill svg{width:18px;height:18px}
.tools{position:absolute;right:10px;top:72px;z-index:4;display:flex;flex-direction:column;gap:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tool .ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);color:#1A1206;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;text-shadow:none}
.cbottom{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:40px 0 18px;background:linear-gradient(to top,rgba(7,5,15,.92),rgba(7,5,15,0));display:flex;flex-direction:column;gap:10px;align-items:center}
.fxname{font-family:var(--f-disp);font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.9);min-height:1.3em}
.fxname.rec{color:var(--kumkum);font-family:var(--f-ui);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.fx{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:6px calc(50% - 31px);scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fxb{flex:none;width:62px;height:62px;border-radius:50%;overflow:hidden;scroll-snap-align:center;border:2px solid rgba(246,235,210,.3);position:relative;background:var(--panel);transition:transform .2s,border-color .2s}
.fxb canvas{width:100%;height:100%;object-fit:cover;display:block}
.fxb.on{border-color:var(--gold);transform:scale(1.08);box-shadow:0 0 0 3px rgba(233,180,76,.25),0 0 20px rgba(233,180,76,.45)}
.fxb .tx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;color:var(--gold2)}
.shrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 18px}
.side{width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.side .ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.shutter{width:80px;height:80px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;position:relative}
.shutter i{width:62px;height:62px;border-radius:50%;background:var(--kumkum);transition:all .25s cubic-bezier(.3,1.4,.5,1)}
.shutter.live{border-color:var(--kumkum)}
.shutter.live i{width:28px;height:28px;border-radius:8px}
.next{height:42px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--deep);font-weight:700;display:flex;align-items:center;gap:4px}
.next svg{width:18px;height:18px}
.guide{position:absolute;left:14px;right:72px;top:72px;z-index:4;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.guide canvas{width:100%;height:60px;border-radius:8px;display:block}
.rescard{position:absolute;left:14px;right:14px;bottom:214px;z-index:5;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .45s cubic-bezier(.2,.9,.2,1)}
.rescard.ok{background:rgba(16,44,34,.95);border:1px solid rgba(127,209,166,.5)}
.rescard.bad{background:rgba(58,16,22,.95);border:1px solid rgba(255,142,132,.5)}
.rescard canvas{width:100%;height:64px;border-radius:10px;display:block;background:rgba(7,5,15,.6)}
.resrow{display:flex;align-items:center;gap:12px}
.resrow b{font-family:var(--f-disp);font-size:21px;display:block;line-height:1.1}
.resrow small{font-size:13px;color:var(--ink)}
.rescard.ok .resrow b,.rescard.ok .pct{color:var(--ok)}
.rescard.bad .resrow b,.rescard.bad .pct{color:var(--bad)}
.pct{font-family:var(--f-disp);font-size:34px;margin-left:auto;font-variant-numeric:tabular-nums}
.rpanel{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:56px 16px 18px;background:linear-gradient(to top,var(--deep) 62%,rgba(7,5,15,0));display:flex;flex-direction:column;gap:12px}
.rpanel textarea{width:100%;height:58px;border-radius:13px;background:rgba(23,16,38,.9);border:1px solid var(--faint);color:var(--ink);padding:10px 12px;font:inherit;resize:none}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.sum span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(246,235,210,.08);border:1px solid var(--faint)}
.top{position:absolute;inset:0;overflow-y:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border-radius:16px;padding:14px;border:1px solid var(--faint)}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:32px;color:var(--gold2);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lb{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-radius:18px;background:var(--panel);border:1px solid var(--faint);width:100%;text-align:left}
.lrow .rk{font-family:var(--f-disp);font-size:26px;width:30px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.lrow:first-child{border-color:rgba(233,180,76,.45);background:linear-gradient(90deg,rgba(233,180,76,.1),var(--panel) 60%)}
.lthumb{width:50px;height:78px;border-radius:10px;overflow:hidden;flex:none;background:var(--deep)}
.lthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.lmid{flex:1;min-width:0}

  .view.full{left:calc(var(--side) + (100vw - var(--side) - var(--colw))/2);width:var(--colw);right:auto;top:20px;bottom:20px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--faint),0 30px 80px rgba(0,0,0,.6)}

.langrow svg{width:20px;height:20px;color:var(--gold)}.langrow span{flex:1;text-align:left}.langrow b{color:var(--gold);font-weight:600}

.mala svg{width:100%;height:40px}.bead{fill:none;stroke:rgba(242,227,198,.4);stroke-width:1.4}.bead.on{fill:#8B3A1E;stroke:var(--gold)}
.mala p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.tt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;line-height:1.2;color:#9d95c0}
.tt>svg,.tt>.om{width:58px;height:58px;padding:15px;border-radius:50%;box-shadow:inset 0 0 0 1.4px rgba(167,159,201,.45);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tt>.om{font-size:28px;padding:0}
.tt.got{color:#F7EBD3}.tt.got>svg,.tt.got>.om{background:var(--gold);color:var(--night);box-shadow:0 0 18px rgba(244,183,58,.35)}
/* language */
.lops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lopt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;background:rgba(242,227,198,.06);box-shadow:inset 0 0 0 1.4px rgba(242,227,198,.25);text-align:left}
.lopt b{font-size:21px;font-weight:600}.lopt span{font-size:14px;color:var(--muted)}
.lopt i{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;opacity:0}.lopt i svg{width:15px;height:15px}
.lopt.on{background:var(--gold);color:var(--night);box-shadow:none}.lopt.on span{color:#4a3a10}.lopt.on i{opacity:1;background:var(--night);color:var(--gold)}
.lops .lopt.sm b{font-size:19px}
.langscreen{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 60% at 50% 0%,#2A2268,var(--night) 60%);display:flex;flex-direction:column;padding:0 18px 22px;overflow:auto;transition:opacity .35s}
.langscreen.out{opacity:0}
.lsy{position:absolute;left:50%;top:-40px;width:360px;height:360px;transform:translateX(-50%);color:var(--gold);opacity:.5;pointer-events:none}.lsy svg{width:100%;height:100%;animation:spin 120s linear infinite}
.lsom{margin:92px auto 0;font-family:'Tiro Devanagari Sanskrit',serif;font-size:62px;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(244,183,58,.7);position:relative}
.lst{text-align:center;margin-top:46px;position:relative}.lst h1{font-family:var(--f-disp);font-weight:600;font-size:40px;line-height:1;margin:0;color:#FFF4DC}
.lst .dv{font-family:'Tiro Devanagari Sanskrit',serif;font-size:22px;color:var(--gold);margin:2px 0 0}.lst .sub{font-size:14.5px;color:var(--muted);margin:8px auto 0;max-width:300px}
.lsh{font-family:var(--f-disp);font-weight:600;font-size:21px;margin:28px 0 10px;color:#FFF4DC}
.langscreen .btn{margin-top:auto;flex:none}.langscreen .lops{margin-bottom:22px}.lsn{text-align:center;font-size:13.5px;color:#a79fc9;margin:10px 0 0}
.gbtns .tpill.gold{background:var(--gold);color:var(--night)}
#games.reels{padding-top:128px}
.rside .rs-name{font-family:var(--f-disp);font-weight:600;font-size:26px;line-height:1.1;margin:0}
.rside .rs-teach{font-family:var(--f-disp);font-weight:500;font-size:19px;line-height:1.35;margin:0;color:#FFF4DC}
.rs-sh .ln .en{font-size:13.5px;color:var(--muted)}
.lsy{opacity:.28}
@media (min-width:900px){
  .nav .create{width:100%;height:48px;border-radius:12px;margin-top:auto;box-shadow:none;background:var(--kumkum);color:#FFE9C4;flex-direction:row;justify-content:center}
  .nav .create::after{content:none}
  .nav .create span{display:inline}
  #games.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start;grid-auto-rows:auto;padding:120px 32px 32px;gap:22px}
  #games .gcard{height:auto}
  #v-games .gtop{padding:22px 32px 18px}
  .gcover{height:170px}
}
.nav .create .cl{display:none}@media (min-width:900px){.nav .create .cl{display:inline;font-weight:700}}

.ww .wk{text-transform:none;letter-spacing:0;font-size:12.5px}

 iast:['viśvaṁ darpaṇa-dṛśyamāna-nagarī-tulyaṁ nijāntargataṁ','paśyann ātmani māyayā bahir ivodbhūtaṁ yathā nidrayā','yaḥ sākṣāt kurute prabodha-samaye svātmānam evādvayaṁ'],
 en:['The universe is like a city seen in a mirror. It exists within oneself.','Through māyā it seems to appear outside, as a dream does in sleep.','The one who, at the moment of awakening, sees directly his own Self, one without a second,'],
 teach:'The world you see is like a city reflected in a mirror. It seems to be outside, yet it shines within you.',
 keep:['A reflection depends on the mirror. The world you see depends on the awareness that sees it.','A dream city feels real until you wake. Then you see it was in you all along.','The guru’s gift is that awakening: you are the one awareness, without a second.'],
 words:[['viśvam','the universe'],['darpaṇa','mirror'],['dṛśyamāna','being seen'],['nagarī','city'],['tulyam','just like'],['nija-antargatam','within oneself'],['māyayā','through māyā'],['bahiḥ iva','as if outside'],['nidrayā','in sleep'],['prabodha-samaye','at awakening'],['sva-ātmānam','one’s own Self'],['advayam','without a second']]},
{n:2,name:'The seed',
 dev:['बीजस्यान्तरिवाङ्कुरो जगदिदं प्राङ्निर्विकल्पं पुनः','मायाकल्पितदेशकालकलनावैचित्र्यचित्रीकृतम् ।','मायावीव विजृम्भयत्यपि महायोगीव यः स्वेच्छया'],
 iast:['bījasyāntar ivāṅkuro jagad idaṁ prāṅ nirvikalpaṁ punaḥ','māyā-kalpita-deśa-kāla-kalanā-vaicitrya-citrīkṛtam','māyāvīva vijṛmbhayaty api mahā-yogīva yaḥ svecchayā'],
 en:['Like the sprout inside a seed, this world at first lies undivided.','Then, through māyā, it is painted with the endless variety of space and time.','The one who unfolds it by his own will, like a magician, like a great yogi,'],
 teach:'The whole world rests in the Self like a tree inside a seed. Space and time unfold it, the way a magician conjures a show.',
 keep:['A seed holds the whole tree before it sprouts. The Self holds the world before it appears.','Space and time are the painter’s brush: they give the one canvas its many colours.','Like a magician who is never fooled by his own show, the Self stays untouched by the world it unfolds.'],
 words:[['bījasya antaḥ','inside the seed'],['aṅkuraḥ','sprout'],['jagat idam','this world'],['prāk','at first'],['nirvikalpam','undivided'],['māyā-kalpita','imagined by māyā'],['deśa','space'],['kāla','time'],['vaicitrya','variety'],['citrīkṛtam','painted'],['māyāvī','magician'],['vijṛmbhayati','unfolds'],['mahā-yogī','great yogi'],['sva-icchayā','by his own will']]},
{n:3,name:'That you are',
 dev:['यस्यैव स्फुरणं सदात्मकमसत्कल्पार्थकं भासते','साक्षात्तत्त्वमसीति वेदवचसा यो बोधयत्याश्रितान् ।','यत्साक्षात्करणाद्भवेन्न पुनरावृत्तिर्भवाम्भोनिधौ'],
 iast:['yasyaiva sphuraṇaṁ sadātmakam asat-kalpārthakaṁ bhāsate','sākṣāt tat tvam asīti veda-vacasā yo bodhayaty āśritān','yat-sākṣāt-karaṇād bhaven na punar āvṛttir bhavāmbhonidhau'],
 en:['His shining alone, which is existence itself, appears in things that are unreal.','Through the Vedic words “You are That”, he awakens those who come to him.','Seeing That directly, one never returns to the ocean of birth and death,'],
 teach:'Everything you see shines only because existence shines through it. The guru points and says: you are That.',
 keep:['A pot “is”, a tree “is”. That “is” is the one existence shining in every thing.','“Tat tvam asi”: what shines in everything is what you are.','Know it directly, and the cycle of becoming has nowhere to pull you back.'],
 words:[['sphuraṇam','shining'],['sat-ātmakam','existence itself'],['asat','unreal'],['bhāsate','appears'],['sākṣāt','directly'],['tat','That'],['tvam','you'],['asi','are'],['veda-vacasā','by the words of the Veda'],['bodhayati','awakens'],['āśritān','those who come'],['āvṛttiḥ','return'],['bhava-ambhonidhau','in the ocean of becoming']]},
{n:4,name:'The lamp in the pot',
 dev:['नानाच्छिद्रघटोदरस्थितमहादीपप्रभाभास्वरं','ज्ञानं यस्य तु चक्षुरादिकरणद्वारा बहिः स्पन्दते ।','जानामीति तमेव भान्तमनुभात्येतत्समस्तं जगत्'],
 iast:['nānācchidra-ghaṭodara-sthita-mahā-dīpa-prabhā-bhāsvaraṁ','jñānaṁ yasya tu cakṣur-ādi-karaṇa-dvārā bahiḥ spandate','jānāmīti tam eva bhāntam anubhāty etat samastaṁ jagat'],
 en:['Like the bright light of a great lamp inside a pot with many holes,','his knowing streams outward through the eyes and the other senses.','“I know”: he shines, and only after him does this whole world shine,'],
 teach:'Your awareness is a lamp inside a pot full of holes. It shines out through the eyes and ears, and the world lights up.',
 keep:['The holes are many, the light is one. The senses are many, awareness is one.','Nothing in the world shines by itself. It is seen because awareness shines first.','“I know” is the lamp. Everything known is lit by it.'],
 words:[['nānā chidra','many holes'],['ghaṭa-udara','inside a pot'],['mahā-dīpa','great lamp'],['prabhā','light'],['jñānam','knowing'],['cakṣuḥ-ādi','the eyes and the rest'],['karaṇa','senses'],['dvārā','through'],['bahiḥ','outward'],['spandate','streams'],['jānāmi','I know'],['bhāntam','shining'],['anubhāti','shines after']]},
{n:5,name:'Not the body',
 dev:['देहं प्राणमपीन्द्रियाण्यपि चलां बुद्धिं च शून्यं विदुः','स्त्रीबालान्धजडोपमास्त्वहमिति भ्रान्ता भृशं वादिनः ।','मायाशक्तिविलासकल्पितमहाव्यामोहसंहारिणे'],
 iast:['dehaṁ prāṇam apīndriyāṇy api calāṁ buddhiṁ ca śūnyaṁ viduḥ','strī-bālāndha-jaḍopamās tv aham iti bhrāntā bhṛśaṁ vādinaḥ','māyā-śakti-vilāsa-kalpita-mahā-vyāmoha-saṁhāriṇe'],
 en:['Some take the “I” to be the body, the breath, the senses, the restless mind, or emptiness.','Naive as children or the blind, they are deeply mistaken, though they argue loudly.','To him who ends this great delusion, conjured by the play of māyā’s power,'],
 teach:'You are not the body, the breath, the senses or the mind. Those are things you know. The knower is what you are.',
 keep:['Whatever you can watch is not the watcher. You watch the body, the breath, the thoughts.','Thoughts come and go. The one who sees them come and go stays.','The guru doesn’t add anything. He removes the mistake, and what is left is you.'],
 words:[['deham','body'],['prāṇam','breath'],['indriyāṇi','senses'],['calām buddhim','restless mind'],['śūnyam','emptiness'],['viduḥ','they take to be'],['aham iti','as “I”'],['bhrāntāḥ','mistaken'],['vādinaḥ','debaters'],['māyā-śakti','power of māyā'],['vilāsa','play'],['vyāmoha','delusion'],['saṁhāriṇe','to the one who ends']]},
{n:6,name:'The eclipse',
 dev:['राहुग्रस्तदिवाकरेन्दुसदृशो मायासमाच्छादनात्','सन्मात्रः करणोपसंहरणतो योऽभूत्सुषुप्तः पुमान् ।','प्रागस्वाप्समिति प्रबोधसमये यः प्रत्यभिज्ञायते'],
 iast:['rāhu-grasta-divākarendu-sadṛśo māyā-samācchādanāt','san-mātraḥ karaṇopasaṁharaṇato yo ’bhūt suṣuptaḥ pumān','prāg asvāpsam iti prabodha-samaye yaḥ pratyabhijñāyate'],
 en:['Like the sun or the moon swallowed by Rāhu, covered over by māyā,','the one who in deep sleep, with the senses withdrawn, remains as pure existence,','on waking recognises himself: “I was asleep”,'],
 teach:'In deep sleep you seem to vanish, like an eclipsed sun. On waking you say “I slept well”, so you were there all along.',
 keep:['An eclipse hides the sun from us. The sun itself is never touched.','In deep sleep the senses and the mind fold away, but you remain as pure being.','“I slept well” is a memory. Someone was there to have it.'],
 words:[['rāhu-grasta','seized by Rāhu'],['divākara','sun'],['indu','moon'],['sadṛśaḥ','like'],['samācchādanāt','by covering'],['sat-mātraḥ','pure existence'],['karaṇa','senses'],['upasaṁharaṇataḥ','by withdrawing'],['suṣuptaḥ','deeply asleep'],['pumān','person'],['prāk asvāpsam','“I slept until now”'],['prabodha-samaye','on waking'],['pratyabhijñāyate','recognises himself']]},
{n:7,name:'The unchanging I',
 dev:['बाल्यादिष्वपि जाग्रदादिषु तथा सर्वास्ववस्थास्वपि','व्यावृत्तास्वनुवर्तमानमहमित्यन्तः स्फुरन्तं सदा ।','स्वात्मानं प्रकटीकरोति भजतां यो मुद्रया भद्रया'],
 iast:['bālyādiṣv api jāgrad-ādiṣu tathā sarvāsv avasthāsv api','vyāvṛttāsv anuvartamānam aham ity antaḥ sphurantaṁ sadā','svātmānaṁ prakaṭīkaroti bhajatāṁ yo mudrayā bhadrayā'],
 en:['In childhood, youth and age, in waking, dream and deep sleep, in every state,','while the states come and go, the “I am” continues, always shining within.','He reveals this, one’s own Self, to those who seek him, with the auspicious gesture of knowledge,'],
 teach:'Childhood ends, youth ends, dreams end. The “I am” that was present in all of them never ends.',
 keep:['The states change like beads. The thread of “I am” runs through all of them.','You were a child and you are older now. The “I” that says both is the same.','The chin-mudrā: the finger of the self touches the thumb of the infinite, and the circle closes.'],
 words:[['bālya-ādiṣu','in childhood and the rest'],['jāgrat-ādiṣu','in waking and the rest'],['avasthāsu','in the states'],['vyāvṛttāsu','as they pass'],['anuvartamānam','continuing'],['aham iti','as “I”'],['antaḥ','within'],['sphurantam','shining'],['sadā','always'],['sva-ātmānam','one’s own Self'],['prakaṭīkaroti','reveals'],['bhajatām','to those who seek'],['mudrayā bhadrayā','with the auspicious gesture']]},
{n:8,name:'The dream of roles',
 dev:['विश्वं पश्यति कार्यकारणतया स्वस्वामिसंबन्धतः','शिष्याचार्यतया तथैव पितृपुत्राद्यात्मना भेदतः ।','स्वप्ने जाग्रति वा य एष पुरुषो मायापरिभ्रामितः'],
 iast:['viśvaṁ paśyati kārya-kāraṇatayā sva-svāmi-saṁbandhataḥ','śiṣyācāryatayā tathaiva pitṛ-putrādy-ātmanā bhedataḥ','svapne jāgrati vā ya eṣa puruṣo māyā-paribhrāmitaḥ'],
 en:['One sees the world as cause and effect, as the owned and the owner,','as student and teacher, as father and son, all as division.','In dream or in waking, this person is spun around by māyā,'],
 teach:'Cause and effect, owner and owned, teacher and student, parent and child. One Self plays every role, like a dreamer who is every person in the dream.',
 keep:['In a dream you are the city, the crowd and the one walking through it.','Roles are real as roles. The one playing them is not divided.','The guru wakes you, the way morning ends a dream.'],
 words:[['viśvam','the world'],['paśyati','sees'],['kārya','effect'],['kāraṇa','cause'],['sva','the owned'],['svāmi','owner'],['saṁbandhataḥ','through relation'],['śiṣya','student'],['ācārya','teacher'],['pitṛ','father'],['putra','son'],['bhedataḥ','as division'],['svapne','in dream'],['jāgrati','in waking'],['māyā-paribhrāmitaḥ','spun by māyā']]}
];
TATTVAS.forEach(t=>{t.dev.push(L4.dev);t.iast.push(L4.iast);t.en.push(L4.en);t.words.push(['namaḥ','salutations']);});

/* Languages: English, Telugu, Kannada, Hindi. LX() translates app text; TL(n) gives a tattva in the chosen language:
   the verse in that language's script (Roman for English), the meaning, teaching and keep-points translated.
   Singing and the letter games still use the Sanskrit sounds. Tattva translations: drafted 2026-10-08, to be reviewed. */
const LANGS=[['en','English','Hello'],['te','తెలుగు','నమస్కారం'],['kn','ಕನ್ನಡ','ನಮಸ್ಕಾರ'],['hi','हिन्दी','नमस्ते']];
const TI18N={"te":{"L4":"ఆ గురుమూర్తి అయిన శ్రీ దక్షిణామూర్తికి ఈ నమస్కారం.","t":[{"name":"అద్దంలో నగరం","teach":"నువ్వు చూసే ప్రపంచం అద్దంలో కనిపించే నగరం లాంటిది. అది బయట ఉన్నట్టు అనిపిస్తుంది, కానీ నీలోనే ప్రకాశిస్తుంది.","keep":["ప్రతిబింబం అద్దం మీద ఆధారపడుతుంది. నువ్వు చూసే ప్రపంచం దాన్ని చూసే చైతన్యం మీద ఆధారపడుతుంది.","మేలుకునే వరకు కలలోని నగరం నిజమనిపిస్తుంది. మేలుకున్నాక, అది ఎప్పుడూ నీలోనే ఉందని తెలుస్తుంది.","గురువు ఇచ్చే వరం ఆ మేలుకొలుపే: నువ్వు రెండవది లేని ఒకే చైతన్యం."],"en":["విశ్వం అద్దంలో కనిపించే నగరం లాంటిది. అది తనలోనే ఉంది.","మాయ వల్ల అది బయట కనిపిస్తున్నట్టు అనిపిస్తుంది, నిద్రలో కల లాగా.","మేలుకొనే క్షణంలో, రెండవది లేని తన ఆత్మనే ప్రత్యక్షంగా చూసేవాడు,"],"words":["విశ్వం","అద్దం","కనిపిస్తున్న","నగరం","అచ్చం అలాగే","తనలోనే","మాయ వల్ల","బయట ఉన్నట్టు","నిద్రలో","మేలుకొనేటప్పుడు","తన ఆత్మ","రెండవది లేని"]},{"name":"విత్తనం","teach":"విత్తనంలో చెట్టు ఉన్నట్టు, ప్రపంచమంతా ఆత్మలో ఉంది. ఇంద్రజాలికుడు ప్రదర్శనను సృష్టించినట్టు, స్థలమూ కాలమూ దాన్ని విప్పుతాయి.","keep":["మొలకెత్తక ముందే విత్తనంలో చెట్టంతా ఉంటుంది. కనిపించక ముందే ప్రపంచం ఆత్మలో ఉంటుంది.","స్థలమూ కాలమూ చిత్రకారుడి కుంచెలు: ఒకే పటానికి అవి ఎన్నో రంగులు ఇస్తాయి.","తన ఇంద్రజాలానికి తానే మోసపోని ఇంద్రజాలికుడిలా, ఆత్మ తాను విప్పే ప్రపంచం వల్ల ఏమాత్రం తాకబడదు."],"en":["విత్తనంలోని మొలకలా, ఈ ప్రపంచం మొదట విభజన లేకుండా ఉంటుంది.","తర్వాత మాయ వల్ల, స్థలకాలాల అంతులేని వైవిధ్యంతో అది చిత్రించబడుతుంది.","ఇంద్రజాలికుడిలా, మహాయోగిలా, తన ఇచ్ఛతోనే దాన్ని విప్పేవాడు,"],"words":["విత్తనం లోపల","మొలక","ఈ ప్రపంచం","మొదట","విభజన లేని","మాయ కల్పించిన","స్థలం","కాలం","వైవిధ్యం","చిత్రించబడిన","ఇంద్రజాలికుడు","విప్పుతాడు","మహాయోగి","తన ఇచ్ఛతో"]},{"name":"అది నువ్వే","teach":"నువ్వు చూసే ప్రతిదీ, దాని ద్వారా అస్తిత్వం ప్రకాశించడం వల్లనే ప్రకాశిస్తుంది. గురువు చూపించి చెబుతాడు: అది నువ్వే.","keep":["కుండ “ఉంది”, చెట్టు “ఉంది”. ఆ “ఉంది” అనేది ప్రతి వస్తువులో ప్రకాశించే ఒకే అస్తిత్వం.","“తత్త్వమసి”: అన్నిటిలో ప్రకాశించేదే నువ్వు.","దాన్ని ప్రత్యక్షంగా తెలుసుకో, అప్పుడు సంసార చక్రం నిన్ను వెనక్కి లాగలేదు."],"en":["అస్తిత్వమే అయిన ఆయన ప్రకాశమే, అసత్యమైన వస్తువులలో కనిపిస్తుంది.","“అది నువ్వే” అనే వేద వాక్యంతో, తనను ఆశ్రయించిన వారిని ఆయన మేల్కొలుపుతాడు.","దాన్ని ప్రత్యక్షంగా చూసినవాడు, జనన మరణాల సముద్రంలోకి మళ్ళీ తిరిగి రాడు,"],"words":["ప్రకాశం","అస్తిత్వమే","అసత్యం","కనిపిస్తుంది","ప్రత్యక్షంగా","అది","నువ్వు","అయి ఉన్నావు","వేద వాక్యంతో","మేల్కొలుపుతాడు","ఆశ్రయించిన వారిని","తిరిగి రావడం","సంసార సముద్రంలో"]},{"name":"కుండలో దీపం","teach":"నీ చైతన్యం రంధ్రాలున్న కుండలోని దీపం. అది కళ్ళు, చెవుల ద్వారా బయటకు ప్రకాశిస్తుంది, ప్రపంచం వెలుగుతుంది.","keep":["రంధ్రాలు ఎన్నో, వెలుగు ఒక్కటే. ఇంద్రియాలు ఎన్నో, చైతన్యం ఒక్కటే.","ప్రపంచంలో ఏదీ తనంతట తాను ప్రకాశించదు. ముందు చైతన్యం ప్రకాశిస్తుంది కాబట్టే అది కనిపిస్తుంది.","“నాకు తెలుసు” అనేదే దీపం. తెలిసే ప్రతిదీ దాని వెలుగుతోనే వెలుగుతుంది."],"en":["అనేక రంధ్రాలున్న కుండలోని మహాదీపపు ప్రకాశవంతమైన వెలుగులా,","ఆయన జ్ఞానం కళ్ళు మొదలైన ఇంద్రియాల ద్వారా బయటకు ప్రవహిస్తుంది.","“నాకు తెలుసు”: ఆయన ప్రకాశిస్తాడు, ఆయన తర్వాతే ఈ ప్రపంచమంతా ప్రకాశిస్తుంది,"],"words":["అనేక రంధ్రాలు","కుండ లోపల","మహాదీపం","వెలుగు","జ్ఞానం","కళ్ళు మొదలైనవి","ఇంద్రియాలు","ద్వారా","బయటకు","ప్రవహిస్తుంది","నాకు తెలుసు","ప్రకాశిస్తున్న","తర్వాత ప్రకాశిస్తుంది"]},{"name":"శరీరం కాదు","teach":"నువ్వు శరీరం కాదు, శ్వాస కాదు, ఇంద్రియాలు కాదు, మనసు కాదు. అవి నీకు తెలిసేవి. తెలుసుకునేవాడివే నువ్వు.","keep":["నువ్వు గమనించగలిగేది ఏదీ గమనించేవాడు కాదు. నువ్వు శరీరాన్ని, శ్వాసను, ఆలోచనలను గమనిస్తావు.","ఆలోచనలు వస్తాయి, పోతాయి. అవి వచ్చిపోవడం చూసేవాడు అలాగే ఉంటాడు.","గురువు ఏమీ కొత్తగా చేర్చడు. పొరపాటును తొలగిస్తాడు, మిగిలేది నువ్వే."],"en":["కొందరు “నేను” అంటే శరీరం, శ్వాస, ఇంద్రియాలు, చంచలమైన మనసు, లేదా శూన్యం అనుకుంటారు.","పిల్లల్లా, అంధుల్లా అమాయకులై, గట్టిగా వాదించినా, వారు చాలా పొరపడుతున్నారు.","మాయాశక్తి లీల కల్పించిన ఈ మహా మోహాన్ని అంతం చేసే ఆయనకు,"],"words":["శరీరం","శ్వాస","ఇంద్రియాలు","చంచలమైన మనసు","శూన్యం","అనుకుంటారు","“నేను” అని","పొరపడినవారు","వాదించేవారు","మాయాశక్తి","లీల","మోహం","అంతం చేసేవాడికి"]},{"name":"గ్రహణం","teach":"గాఢ నిద్రలో నువ్వు గ్రహణం పట్టిన సూర్యుడిలా మాయమైనట్టు అనిపిస్తుంది. మేలుకున్నాక “బాగా నిద్రపోయాను” అంటావు, కాబట్టి నువ్వు ఎప్పుడూ అక్కడే ఉన్నావు.","keep":["గ్రహణం సూర్యుణ్ణి మనకు కనబడకుండా దాస్తుంది. సూర్యుణ్ణి మాత్రం అది ఎప్పుడూ తాకదు.","గాఢ నిద్రలో ఇంద్రియాలు, మనసు ముడుచుకుపోతాయి, కానీ నువ్వు శుద్ధ అస్తిత్వంగా మిగిలి ఉంటావు.","“బాగా నిద్రపోయాను” అనేది ఒక జ్ఞాపకం. దాన్ని అనుభవించడానికి ఎవరో అక్కడ ఉన్నారు."],"en":["రాహువు మింగిన సూర్యుడిలా లేదా చంద్రుడిలా, మాయ కప్పివేయగా,","గాఢ నిద్రలో, ఇంద్రియాలు ఉపసంహరించబడగా, శుద్ధ అస్తిత్వంగా మిగిలేవాడు,","మేలుకున్నప్పుడు “నేను నిద్రపోయాను” అని తనను తాను గుర్తిస్తాడు,"],"words":["రాహువు పట్టిన","సూర్యుడు","చంద్రుడు","పోలిన","కప్పడం వల్ల","శుద్ధ అస్తిత్వం","ఇంద్రియాలు","ఉపసంహరించడం వల్ల","గాఢ నిద్రలో ఉన్న","మనిషి","“ఇప్పటివరకు నిద్రపోయాను”","మేలుకున్నప్పుడు","తనను తాను గుర్తిస్తాడు"]},{"name":"మారని నేను","teach":"బాల్యం ముగుస్తుంది, యవ్వనం ముగుస్తుంది, కలలు ముగుస్తాయి. వాటన్నిటిలో ఉన్న “నేను ఉన్నాను” ఎప్పుడూ ముగియదు.","keep":["అవస్థలు పూసల్లా మారుతాయి. “నేను ఉన్నాను” అనే దారం వాటన్నిటి గుండా సాగుతుంది.","నువ్వు ఒకప్పుడు పిల్లవాడివి, ఇప్పుడు పెద్దవాడివి. రెండూ చెప్పే “నేను” ఒక్కటే.","చిన్ముద్ర: జీవుడనే చూపుడువేలు అనంతమనే బొటనవేలును తాకుతుంది, వృత్తం పూర్తవుతుంది."],"en":["బాల్యం, యవ్వనం, వృద్ధాప్యంలో, మెలకువ, కల, గాఢ నిద్రలో, ప్రతి అవస్థలోనూ,","అవస్థలు వచ్చిపోతుండగా, “నేను ఉన్నాను” కొనసాగుతూ, ఎప్పుడూ లోపల ప్రకాశిస్తుంది.","తనను వెతికేవారికి, జ్ఞానమనే శుభ ముద్రతో, ఈ తన ఆత్మను ఆయన వెల్లడిస్తాడు,"],"words":["బాల్యం మొదలైనవాటిలో","మెలకువ మొదలైనవాటిలో","అవస్థలలో","అవి గడిచిపోతుండగా","కొనసాగుతున్న","“నేను” అని","లోపల","ప్రకాశిస్తున్న","ఎల్లప్పుడూ","తన ఆత్మ","వెల్లడిస్తాడు","వెతికేవారికి","శుభ ముద్రతో"]},{"name":"పాత్రల కల","teach":"కారణం-కార్యం, యజమాని-సొత్తు, గురువు-శిష్యుడు, తల్లిదండ్రులు-పిల్లలు. కలలోని ప్రతి వ్యక్తీ తానే అయిన కలగనేవాడిలా, ఒకే ఆత్మ ప్రతి పాత్రనూ పోషిస్తుంది.","keep":["కలలో నువ్వే నగరం, నువ్వే జనసమూహం, దాని గుండా నడిచేవాడివీ నువ్వే.","పాత్రలు పాత్రలుగా నిజమే. వాటిని పోషించేవాడు విభజించబడడు.","ఉదయం కలను ముగించినట్టు, గురువు నిన్ను మేల్కొలుపుతాడు."],"en":["మనిషి ప్రపంచాన్ని కారణం-కార్యంగా, సొత్తు-యజమానిగా చూస్తాడు,","శిష్యుడు-గురువుగా, తండ్రి-కొడుకుగా, అంతా విభజనగా.","కలలో గానీ మెలకువలో గానీ, ఈ మనిషి మాయ వల్ల గిరగిరా తిప్పబడుతున్నాడు,"],"words":["ప్రపంచం","చూస్తాడు","కార్యం","కారణం","సొత్తు","యజమాని","సంబంధం ద్వారా","శిష్యుడు","ఆచార్యుడు","తండ్రి","కొడుకు","విభజనగా","కలలో","మెలకువలో","మాయ తిప్పిన"]}]},"kn":{"L4":"ಆ ಗುರುಮೂರ್ತಿಯಾದ ಶ್ರೀ ದಕ್ಷಿಣಾಮೂರ್ತಿಗೆ ಈ ನಮಸ್ಕಾರ.","t":[{"name":"ಕನ್ನಡಿಯ ನಗರ","teach":"ನೀನು ನೋಡುವ ಜಗತ್ತು ಕನ್ನಡಿಯಲ್ಲಿ ಕಾಣುವ ನಗರದಂತೆ. ಅದು ಹೊರಗೆ ಇರುವಂತೆ ಕಾಣುತ್ತದೆ, ಆದರೆ ನಿನ್ನೊಳಗೇ ಬೆಳಗುತ್ತದೆ.","keep":["ಪ್ರತಿಬಿಂಬವು ಕನ್ನಡಿಯನ್ನು ಅವಲಂಬಿಸಿದೆ. ನೀನು ನೋಡುವ ಜಗತ್ತು ಅದನ್ನು ನೋಡುವ ಅರಿವನ್ನು ಅವಲಂಬಿಸಿದೆ.","ಎಚ್ಚರವಾಗುವವರೆಗೆ ಕನಸಿನ ನಗರ ನಿಜವೆನಿಸುತ್ತದೆ. ಎಚ್ಚರವಾದಾಗ, ಅದು ಸದಾ ನಿನ್ನೊಳಗೇ ಇತ್ತೆಂದು ತಿಳಿಯುತ್ತದೆ.","ಗುರುವಿನ ಕೊಡುಗೆ ಆ ಎಚ್ಚರವೇ: ನೀನು ಎರಡನೆಯದಿಲ್ಲದ ಒಂದೇ ಅರಿವು."],"en":["ವಿಶ್ವವು ಕನ್ನಡಿಯಲ್ಲಿ ಕಾಣುವ ನಗರದಂತೆ. ಅದು ತನ್ನೊಳಗೇ ಇದೆ.","ಮಾಯೆಯಿಂದ ಅದು ಹೊರಗೆ ಕಾಣುವಂತೆ ತೋರುತ್ತದೆ, ನಿದ್ರೆಯಲ್ಲಿ ಕನಸಿನಂತೆ.","ಎಚ್ಚರದ ಕ್ಷಣದಲ್ಲಿ, ಎರಡನೆಯದಿಲ್ಲದ ತನ್ನ ಆತ್ಮವನ್ನೇ ನೇರವಾಗಿ ಕಾಣುವವನು,"],"words":["ವಿಶ್ವ","ಕನ್ನಡಿ","ಕಾಣುತ್ತಿರುವ","ನಗರ","ಅದರಂತೆಯೇ","ತನ್ನೊಳಗೇ","ಮಾಯೆಯಿಂದ","ಹೊರಗಿರುವಂತೆ","ನಿದ್ರೆಯಲ್ಲಿ","ಎಚ್ಚರದಲ್ಲಿ","ತನ್ನ ಆತ್ಮ","ಎರಡನೆಯದಿಲ್ಲದ"]},{"name":"ಬೀಜ","teach":"ಬೀಜದೊಳಗೆ ಮರ ಇರುವಂತೆ, ಇಡೀ ಜಗತ್ತು ಆತ್ಮದಲ್ಲಿ ನೆಲೆಸಿದೆ. ಜಾದೂಗಾರನು ಪ್ರದರ್ಶನವನ್ನು ಸೃಷ್ಟಿಸುವಂತೆ, ಸ್ಥಳ ಮತ್ತು ಕಾಲ ಅದನ್ನು ಬಿಚ್ಚಿಡುತ್ತವೆ.","keep":["ಮೊಳಕೆಯೊಡೆಯುವ ಮೊದಲೇ ಬೀಜದಲ್ಲಿ ಇಡೀ ಮರ ಇರುತ್ತದೆ. ಕಾಣುವ ಮೊದಲೇ ಜಗತ್ತು ಆತ್ಮದಲ್ಲಿ ಇರುತ್ತದೆ.","ಸ್ಥಳ ಮತ್ತು ಕಾಲ ಚಿತ್ರಕಾರನ ಕುಂಚ: ಒಂದೇ ಪಟಕ್ಕೆ ಅವು ಹಲವು ಬಣ್ಣಗಳನ್ನು ಕೊಡುತ್ತವೆ.","ತನ್ನದೇ ಜಾದೂವಿಗೆ ಎಂದೂ ಮೋಸಹೋಗದ ಜಾದೂಗಾರನಂತೆ, ಆತ್ಮವು ತಾನು ಬಿಚ್ಚಿಡುವ ಜಗತ್ತಿನಿಂದ ಮುಟ್ಟಲ್ಪಡದೆ ಇರುತ್ತದೆ."],"en":["ಬೀಜದೊಳಗಿನ ಮೊಳಕೆಯಂತೆ, ಈ ಜಗತ್ತು ಮೊದಲು ವಿಭಾಗವಿಲ್ಲದೆ ಇರುತ್ತದೆ.","ನಂತರ ಮಾಯೆಯಿಂದ, ಸ್ಥಳ-ಕಾಲಗಳ ಅಂತ್ಯವಿಲ್ಲದ ವೈವಿಧ್ಯದಿಂದ ಅದು ಚಿತ್ರಿತವಾಗುತ್ತದೆ.","ಜಾದೂಗಾರನಂತೆ, ಮಹಾಯೋಗಿಯಂತೆ, ತನ್ನ ಇಚ್ಛೆಯಿಂದಲೇ ಅದನ್ನು ಬಿಚ್ಚಿಡುವವನು,"],"words":["ಬೀಜದೊಳಗೆ","ಮೊಳಕೆ","ಈ ಜಗತ್ತು","ಮೊದಲು","ವಿಭಾಗವಿಲ್ಲದ","ಮಾಯೆ ಕಲ್ಪಿಸಿದ","ಸ್ಥಳ","ಕಾಲ","ವೈವಿಧ್ಯ","ಚಿತ್ರಿಸಿದ","ಜಾದೂಗಾರ","ಬಿಚ್ಚಿಡುತ್ತಾನೆ","ಮಹಾಯೋಗಿ","ತನ್ನ ಇಚ್ಛೆಯಿಂದ"]},{"name":"ಅದು ನೀನೇ","teach":"ನೀನು ನೋಡುವ ಎಲ್ಲವೂ, ಅದರ ಮೂಲಕ ಅಸ್ತಿತ್ವ ಬೆಳಗುವುದರಿಂದಲೇ ಬೆಳಗುತ್ತದೆ. ಗುರು ತೋರಿಸಿ ಹೇಳುತ್ತಾನೆ: ಅದು ನೀನೇ.","keep":["ಮಡಕೆ “ಇದೆ”, ಮರ “ಇದೆ”. ಆ “ಇದೆ” ಎಂಬುದು ಪ್ರತಿಯೊಂದು ವಸ್ತುವಿನಲ್ಲಿ ಬೆಳಗುವ ಒಂದೇ ಅಸ್ತಿತ್ವ.","“ತತ್ತ್ವಮಸಿ”: ಎಲ್ಲದರಲ್ಲೂ ಬೆಳಗುವುದೇ ನೀನು.","ಅದನ್ನು ನೇರವಾಗಿ ತಿಳಿ, ಆಗ ಹುಟ್ಟು-ಸಾವಿನ ಚಕ್ರ ನಿನ್ನನ್ನು ಮತ್ತೆ ಎಳೆಯಲಾರದು."],"en":["ಅಸ್ತಿತ್ವವೇ ಆದ ಆತನ ಬೆಳಕೇ, ಅಸತ್ಯವಾದ ವಸ್ತುಗಳಲ್ಲಿ ಕಾಣುತ್ತದೆ.","“ಅದು ನೀನೇ” ಎಂಬ ವೇದ ವಾಕ್ಯದಿಂದ, ತನ್ನನ್ನು ಆಶ್ರಯಿಸಿದವರನ್ನು ಆತ ಎಚ್ಚರಿಸುತ್ತಾನೆ.","ಅದನ್ನು ನೇರವಾಗಿ ಕಂಡವನು, ಹುಟ್ಟು-ಸಾವಿನ ಸಾಗರಕ್ಕೆ ಮತ್ತೆ ಹಿಂದಿರುಗುವುದಿಲ್ಲ,"],"words":["ಬೆಳಕು","ಅಸ್ತಿತ್ವವೇ","ಅಸತ್ಯ","ಕಾಣುತ್ತದೆ","ನೇರವಾಗಿ","ಅದು","ನೀನು","ಆಗಿರುವೆ","ವೇದದ ವಾಕ್ಯದಿಂದ","ಎಚ್ಚರಿಸುತ್ತಾನೆ","ಆಶ್ರಯಿಸಿದವರನ್ನು","ಹಿಂದಿರುಗುವಿಕೆ","ಸಂಸಾರ ಸಾಗರದಲ್ಲಿ"]},{"name":"ಮಡಕೆಯೊಳಗಿನ ದೀಪ","teach":"ನಿನ್ನ ಅರಿವು ತೂತುಗಳಿರುವ ಮಡಕೆಯೊಳಗಿನ ದೀಪ. ಅದು ಕಣ್ಣು, ಕಿವಿಗಳ ಮೂಲಕ ಹೊರಗೆ ಬೆಳಗುತ್ತದೆ, ಜಗತ್ತು ಬೆಳಗುತ್ತದೆ.","keep":["ತೂತುಗಳು ಹಲವು, ಬೆಳಕು ಒಂದೇ. ಇಂದ್ರಿಯಗಳು ಹಲವು, ಅರಿವು ಒಂದೇ.","ಜಗತ್ತಿನಲ್ಲಿ ಯಾವುದೂ ತಾನಾಗಿ ಬೆಳಗುವುದಿಲ್ಲ. ಮೊದಲು ಅರಿವು ಬೆಳಗುವುದರಿಂದಲೇ ಅದು ಕಾಣುತ್ತದೆ.","“ನನಗೆ ತಿಳಿದಿದೆ” ಎಂಬುದೇ ದೀಪ. ತಿಳಿಯುವ ಎಲ್ಲವೂ ಅದರಿಂದಲೇ ಬೆಳಗುತ್ತದೆ."],"en":["ಹಲವು ತೂತುಗಳಿರುವ ಮಡಕೆಯೊಳಗಿನ ಮಹಾದೀಪದ ಉಜ್ವಲ ಬೆಳಕಿನಂತೆ,","ಆತನ ಜ್ಞಾನವು ಕಣ್ಣು ಮೊದಲಾದ ಇಂದ್ರಿಯಗಳ ಮೂಲಕ ಹೊರಗೆ ಹರಿಯುತ್ತದೆ.","“ನನಗೆ ತಿಳಿದಿದೆ”: ಆತ ಬೆಳಗುತ್ತಾನೆ, ಆತನ ನಂತರವೇ ಈ ಇಡೀ ಜಗತ್ತು ಬೆಳಗುತ್ತದೆ,"],"words":["ಹಲವು ತೂತುಗಳು","ಮಡಕೆಯೊಳಗೆ","ಮಹಾದೀಪ","ಬೆಳಕು","ಜ್ಞಾನ","ಕಣ್ಣು ಮೊದಲಾದವು","ಇಂದ್ರಿಯಗಳು","ಮೂಲಕ","ಹೊರಗೆ","ಹರಿಯುತ್ತದೆ","ನನಗೆ ತಿಳಿದಿದೆ","ಬೆಳಗುತ್ತಿರುವ","ನಂತರ ಬೆಳಗುತ್ತದೆ"]},{"name":"ದೇಹವಲ್ಲ","teach":"ನೀನು ದೇಹವಲ್ಲ, ಉಸಿರಲ್ಲ, ಇಂದ್ರಿಯಗಳಲ್ಲ, ಮನಸ್ಸಲ್ಲ. ಅವು ನಿನಗೆ ತಿಳಿಯುವ ವಸ್ತುಗಳು. ತಿಳಿಯುವವನೇ ನೀನು.","keep":["ನೀನು ಗಮನಿಸಬಹುದಾದ ಯಾವುದೂ ಗಮನಿಸುವವನಲ್ಲ. ನೀನು ದೇಹವನ್ನು, ಉಸಿರನ್ನು, ಆಲೋಚನೆಗಳನ್ನು ಗಮನಿಸುತ್ತೀಯ.","ಆಲೋಚನೆಗಳು ಬರುತ್ತವೆ, ಹೋಗುತ್ತವೆ. ಅವು ಬಂದು ಹೋಗುವುದನ್ನು ನೋಡುವವನು ಹಾಗೆಯೇ ಇರುತ್ತಾನೆ.","ಗುರು ಏನನ್ನೂ ಹೊಸದಾಗಿ ಸೇರಿಸುವುದಿಲ್ಲ. ತಪ್ಪನ್ನು ತೆಗೆದುಹಾಕುತ್ತಾನೆ, ಉಳಿಯುವುದೇ ನೀನು."],"en":["ಕೆಲವರು “ನಾನು” ಎಂದರೆ ದೇಹ, ಉಸಿರು, ಇಂದ್ರಿಯಗಳು, ಚಂಚಲ ಮನಸ್ಸು, ಅಥವಾ ಶೂನ್ಯ ಎಂದು ತಿಳಿಯುತ್ತಾರೆ.","ಮಕ್ಕಳಂತೆ, ಕುರುಡರಂತೆ ಮುಗ್ಧರಾಗಿ, ಜೋರಾಗಿ ವಾದಿಸಿದರೂ, ಅವರು ಬಹಳ ತಪ್ಪಾಗಿದ್ದಾರೆ.","ಮಾಯಾಶಕ್ತಿಯ ಲೀಲೆ ಕಲ್ಪಿಸಿದ ಈ ಮಹಾ ಮೋಹವನ್ನು ಕೊನೆಗೊಳಿಸುವ ಆತನಿಗೆ,"],"words":["ದೇಹ","ಉಸಿರು","ಇಂದ್ರಿಯಗಳು","ಚಂಚಲ ಮನಸ್ಸು","ಶೂನ್ಯ","ಎಂದು ತಿಳಿಯುತ್ತಾರೆ","“ನಾನು” ಎಂದು","ತಪ್ಪಿದವರು","ವಾದಿಗಳು","ಮಾಯೆಯ ಶಕ್ತಿ","ಲೀಲೆ","ಮೋಹ","ಕೊನೆಗೊಳಿಸುವವನಿಗೆ"]},{"name":"ಗ್ರಹಣ","teach":"ಗಾಢ ನಿದ್ರೆಯಲ್ಲಿ ನೀನು ಗ್ರಹಣ ಹಿಡಿದ ಸೂರ್ಯನಂತೆ ಮಾಯವಾದಂತೆ ತೋರುತ್ತದೆ. ಎಚ್ಚರವಾದಾಗ “ಚೆನ್ನಾಗಿ ನಿದ್ರಿಸಿದೆ” ಎನ್ನುತ್ತೀಯ, ಆದ್ದರಿಂದ ನೀನು ಸದಾ ಅಲ್ಲಿದ್ದೆ.","keep":["ಗ್ರಹಣವು ಸೂರ್ಯನನ್ನು ನಮ್ಮಿಂದ ಮರೆಮಾಡುತ್ತದೆ. ಸೂರ್ಯನನ್ನು ಮಾತ್ರ ಅದು ಎಂದೂ ಮುಟ್ಟುವುದಿಲ್ಲ.","ಗಾಢ ನಿದ್ರೆಯಲ್ಲಿ ಇಂದ್ರಿಯಗಳು ಮತ್ತು ಮನಸ್ಸು ಮಡಚಿಕೊಳ್ಳುತ್ತವೆ, ಆದರೆ ನೀನು ಶುದ್ಧ ಅಸ್ತಿತ್ವವಾಗಿ ಉಳಿಯುತ್ತೀಯ.","“ಚೆನ್ನಾಗಿ ನಿದ್ರಿಸಿದೆ” ಎಂಬುದು ಒಂದು ನೆನಪು. ಅದನ್ನು ಅನುಭವಿಸಲು ಯಾರೋ ಅಲ್ಲಿದ್ದರು."],"en":["ರಾಹು ನುಂಗಿದ ಸೂರ್ಯನಂತೆ ಅಥವಾ ಚಂದ್ರನಂತೆ, ಮಾಯೆಯಿಂದ ಮುಚ್ಚಲ್ಪಟ್ಟು,","ಗಾಢ ನಿದ್ರೆಯಲ್ಲಿ, ಇಂದ್ರಿಯಗಳು ಹಿಂದೆ ಸರಿದಾಗ, ಶುದ್ಧ ಅಸ್ತಿತ್ವವಾಗಿ ಉಳಿಯುವವನು,","ಎಚ್ಚರವಾದಾಗ “ನಾನು ನಿದ್ರಿಸಿದ್ದೆ” ಎಂದು ತನ್ನನ್ನು ತಾನು ಗುರುತಿಸುತ್ತಾನೆ,"],"words":["ರಾಹು ಹಿಡಿದ","ಸೂರ್ಯ","ಚಂದ್ರ","ಹೋಲುವ","ಮುಚ್ಚುವುದರಿಂದ","ಶುದ್ಧ ಅಸ್ತಿತ್ವ","ಇಂದ್ರಿಯಗಳು","ಹಿಂದೆ ಸೆಳೆಯುವುದರಿಂದ","ಗಾಢ ನಿದ್ರೆಯಲ್ಲಿರುವ","ವ್ಯಕ್ತಿ","“ಇಲ್ಲಿಯವರೆಗೆ ನಿದ್ರಿಸಿದ್ದೆ”","ಎಚ್ಚರವಾದಾಗ","ತನ್ನನ್ನು ಗುರುತಿಸುತ್ತಾನೆ"]},{"name":"ಬದಲಾಗದ ನಾನು","teach":"ಬಾಲ್ಯ ಮುಗಿಯುತ್ತದೆ, ಯೌವನ ಮುಗಿಯುತ್ತದೆ, ಕನಸುಗಳು ಮುಗಿಯುತ್ತವೆ. ಅವೆಲ್ಲದರಲ್ಲೂ ಇದ್ದ “ನಾನು ಇದ್ದೇನೆ” ಎಂದೂ ಮುಗಿಯುವುದಿಲ್ಲ.","keep":["ಅವಸ್ಥೆಗಳು ಮಣಿಗಳಂತೆ ಬದಲಾಗುತ್ತವೆ. “ನಾನು ಇದ್ದೇನೆ” ಎಂಬ ದಾರ ಅವೆಲ್ಲದರ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ.","ನೀನು ಒಮ್ಮೆ ಮಗುವಾಗಿದ್ದೆ, ಈಗ ದೊಡ್ಡವನಾಗಿದ್ದೀಯ. ಎರಡನ್ನೂ ಹೇಳುವ “ನಾನು” ಒಂದೇ.","ಚಿನ್ಮುದ್ರೆ: ಜೀವವೆಂಬ ತೋರುಬೆರಳು ಅನಂತವೆಂಬ ಹೆಬ್ಬೆರಳನ್ನು ಮುಟ್ಟುತ್ತದೆ, ವೃತ್ತ ಪೂರ್ಣವಾಗುತ್ತದೆ."],"en":["ಬಾಲ್ಯ, ಯೌವನ, ಮುಪ್ಪಿನಲ್ಲಿ, ಎಚ್ಚರ, ಕನಸು, ಗಾಢ ನಿದ್ರೆಯಲ್ಲಿ, ಪ್ರತಿಯೊಂದು ಅವಸ್ಥೆಯಲ್ಲೂ,","ಅವಸ್ಥೆಗಳು ಬಂದು ಹೋಗುತ್ತಿರುವಾಗ, “ನಾನು ಇದ್ದೇನೆ” ಮುಂದುವರಿಯುತ್ತಾ, ಸದಾ ಒಳಗೆ ಬೆಳಗುತ್ತದೆ.","ತನ್ನನ್ನು ಅರಸುವವರಿಗೆ, ಜ್ಞಾನದ ಶುಭ ಮುದ್ರೆಯಿಂದ, ಈ ತನ್ನ ಆತ್ಮವನ್ನು ಆತ ತೋರಿಸುತ್ತಾನೆ,"],"words":["ಬಾಲ್ಯ ಮೊದಲಾದವುಗಳಲ್ಲಿ","ಎಚ್ಚರ ಮೊದಲಾದವುಗಳಲ್ಲಿ","ಅವಸ್ಥೆಗಳಲ್ಲಿ","ಅವು ಕಳೆದು ಹೋಗುವಾಗ","ಮುಂದುವರಿಯುವ","“ನಾನು” ಎಂದು","ಒಳಗೆ","ಬೆಳಗುತ್ತಿರುವ","ಸದಾ","ತನ್ನ ಆತ್ಮ","ತೋರಿಸುತ್ತಾನೆ","ಅರಸುವವರಿಗೆ","ಶುಭ ಮುದ್ರೆಯಿಂದ"]},{"name":"ಪಾತ್ರಗಳ ಕನಸು","teach":"ಕಾರಣ-ಕಾರ್ಯ, ಒಡೆಯ-ಒಡೆತನದ ವಸ್ತು, ಗುರು-ಶಿಷ್ಯ, ತಂದೆತಾಯಿ-ಮಕ್ಕಳು. ಕನಸಿನ ಪ್ರತಿಯೊಬ್ಬರೂ ತಾನೇ ಆಗಿರುವ ಕನಸುಗಾರನಂತೆ, ಒಂದೇ ಆತ್ಮ ಪ್ರತಿಯೊಂದು ಪಾತ್ರವನ್ನೂ ವಹಿಸುತ್ತದೆ.","keep":["ಕನಸಿನಲ್ಲಿ ನೀನೇ ನಗರ, ನೀನೇ ಜನಸಂದಣಿ, ಅದರ ಮೂಲಕ ನಡೆಯುವವನೂ ನೀನೇ.","ಪಾತ್ರಗಳು ಪಾತ್ರಗಳಾಗಿ ನಿಜವೇ. ಅವನ್ನು ವಹಿಸುವವನು ವಿಭಜಿತನಲ್ಲ.","ಬೆಳಗು ಕನಸನ್ನು ಕೊನೆಗೊಳಿಸುವಂತೆ, ಗುರು ನಿನ್ನನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ."],"en":["ಜಗತ್ತನ್ನು ಕಾರಣ-ಕಾರ್ಯವಾಗಿ, ಒಡೆತನದ ವಸ್ತು ಮತ್ತು ಒಡೆಯನಾಗಿ ನೋಡುತ್ತಾನೆ,","ಶಿಷ್ಯ-ಗುರುವಾಗಿ, ತಂದೆ-ಮಗನಾಗಿ, ಎಲ್ಲವನ್ನೂ ವಿಭಜನೆಯಾಗಿ.","ಕನಸಿನಲ್ಲಾಗಲಿ ಎಚ್ಚರದಲ್ಲಾಗಲಿ, ಈ ವ್ಯಕ್ತಿ ಮಾಯೆಯಿಂದ ಸುತ್ತಿಸಲ್ಪಡುತ್ತಾನೆ,"],"words":["ಜಗತ್ತು","ನೋಡುತ್ತಾನೆ","ಕಾರ್ಯ","ಕಾರಣ","ಒಡೆತನದ ವಸ್ತು","ಒಡೆಯ","ಸಂಬಂಧದ ಮೂಲಕ","ಶಿಷ್ಯ","ಆಚಾರ್ಯ","ತಂದೆ","ಮಗ","ವಿಭಜನೆಯಾಗಿ","ಕನಸಿನಲ್ಲಿ","ಎಚ್ಚರದಲ್ಲಿ","ಮಾಯೆಯಿಂದ ಸುತ್ತಿಸಲ್ಪಟ್ಟ"]}]},"hi":{"L4":"उन गुरुमूर्ति श्री दक्षिणामूर्ति को मेरा यह नमस्कार।","t":[{"name":"दर्पण का नगर","teach":"तुम जो संसार देखते हो, वह दर्पण में दिखते नगर जैसा है। वह बाहर लगता है, पर तुम्हारे भीतर ही चमकता है।","keep":["प्रतिबिंब दर्पण पर टिका है। तुम जो संसार देखते हो, वह उसे देखने वाली चेतना पर टिका है।","जागने तक सपने का नगर सच लगता है। जागने पर पता चलता है कि वह हमेशा तुम्हारे भीतर ही था।","गुरु का उपहार यही जागरण है: तुम वही एक चेतना हो, जिसके सिवा दूसरा कुछ नहीं।"],"en":["यह विश्व दर्पण में दिखते नगर जैसा है। वह अपने ही भीतर है।","माया से वह बाहर प्रकट होता-सा लगता है, जैसे नींद में सपना।","जो जागने के क्षण में अपनी ही अद्वितीय आत्मा को प्रत्यक्ष देखता है,"],"words":["विश्व","दर्पण","दिखता हुआ","नगर","ठीक वैसा ही","अपने भीतर","माया से","मानो बाहर","नींद में","जागने पर","अपनी आत्मा","जिसके सिवा दूसरा नहीं"]},{"name":"बीज","teach":"जैसे बीज में पेड़, वैसे ही सारा संसार आत्मा में टिका है। जैसे जादूगर खेल रचता है, वैसे ही स्थान और समय उसे खोलते हैं।","keep":["अंकुर फूटने से पहले बीज में पूरा पेड़ होता है। प्रकट होने से पहले संसार आत्मा में होता है।","स्थान और समय चित्रकार की तूलिका हैं: वे एक ही चित्रपट को अनेक रंग देते हैं।","जैसे जादूगर अपने ही खेल से कभी नहीं ठगा जाता, वैसे ही आत्मा अपने खोले हुए संसार से अछूती रहती है।"],"en":["बीज के भीतर अंकुर की तरह, यह संसार पहले अविभक्त रहता है।","फिर माया से, वह स्थान और समय की अनंत विविधता से रंग दिया जाता है।","जो जादूगर की तरह, महायोगी की तरह, अपनी इच्छा से ही उसे खोलता है,"],"words":["बीज के भीतर","अंकुर","यह संसार","पहले","अविभक्त","माया से कल्पित","स्थान","समय","विविधता","रंगा हुआ","जादूगर","खोलता है","महायोगी","अपनी इच्छा से"]},{"name":"वह तुम हो","teach":"तुम जो कुछ देखते हो, वह इसीलिए चमकता है कि उसमें से अस्तित्व चमकता है। गुरु इंगित करके कहते हैं: वह तुम हो।","keep":["घड़ा “है”, पेड़ “है”। वह “है” हर वस्तु में चमकता एक ही अस्तित्व है।","“तत्त्वमसि”: जो सब में चमकता है, वही तुम हो।","इसे सीधे जान लो, फिर संसार का चक्र तुम्हें वापस नहीं खींच सकता।"],"en":["उन्हीं का प्रकाश, जो स्वयं अस्तित्व है, असत्य वस्तुओं में दिखाई देता है।","“वह तुम हो” इस वेद-वचन से, वे शरण में आए लोगों को जगाते हैं।","उसे प्रत्यक्ष देखकर, मनुष्य जन्म-मृत्यु के सागर में फिर कभी नहीं लौटता,"],"words":["प्रकाश","स्वयं अस्तित्व","असत्य","दिखता है","प्रत्यक्ष","वह","तुम","हो","वेद के वचनों से","जगाते हैं","शरण में आए लोगों को","लौटना","संसार-सागर में"]},{"name":"घड़े में दीपक","teach":"तुम्हारी चेतना छेदों से भरे घड़े में रखा दीपक है। वह आँखों और कानों से बाहर चमकती है, और संसार जगमगा उठता है।","keep":["छेद अनेक हैं, प्रकाश एक है। इंद्रियाँ अनेक हैं, चेतना एक है।","संसार में कुछ भी अपने आप नहीं चमकता। वह इसलिए दिखता है क्योंकि पहले चेतना चमकती है।","“मैं जानता हूँ” ही वह दीपक है। जो कुछ जाना जाता है, उसी से प्रकाशित है।"],"en":["अनेक छेदों वाले घड़े के भीतर रखे महादीप के उज्ज्वल प्रकाश की तरह,","उनका ज्ञान आँखों और अन्य इंद्रियों से बाहर बहता है।","“मैं जानता हूँ”: वे चमकते हैं, और उनके पीछे ही यह सारा संसार चमकता है,"],"words":["अनेक छेद","घड़े के भीतर","महादीप","प्रकाश","ज्ञान","आँखें आदि","इंद्रियाँ","द्वारा","बाहर","बहता है","मैं जानता हूँ","चमकता हुआ","पीछे चमकता है"]},{"name":"देह नहीं","teach":"तुम देह नहीं हो, न साँस, न इंद्रियाँ, न मन। ये वे चीज़ें हैं जिन्हें तुम जानते हो। जानने वाला ही तुम हो।","keep":["जिसे तुम देख सकते हो, वह देखने वाला नहीं है। तुम देह को, साँस को, विचारों को देखते हो।","विचार आते हैं और जाते हैं। जो उन्हें आते-जाते देखता है, वह बना रहता है।","गुरु कुछ नया नहीं जोड़ते। वे भूल को हटा देते हैं, और जो बचता है वह तुम हो।"],"en":["कुछ लोग “मैं” को देह, साँस, इंद्रियाँ, चंचल मन या शून्य मान लेते हैं।","बच्चों या अंधों की तरह भोले, वे ज़ोर से बहस करते हैं, फिर भी गहरी भूल में हैं।","माया-शक्ति की लीला से रचे इस महा-मोह को मिटाने वाले उन्हें,"],"words":["देह","साँस","इंद्रियाँ","चंचल मन","शून्य","मान लेते हैं","“मैं” के रूप में","भ्रमित","वाद करने वाले","माया की शक्ति","लीला","मोह","मिटाने वाले को"]},{"name":"ग्रहण","teach":"गहरी नींद में तुम ग्रहण लगे सूरज की तरह गायब-से लगते हो। जागकर कहते हो “मैं अच्छा सोया”, तो तुम पूरे समय वहीं थे।","keep":["ग्रहण सूरज को हमसे छिपा देता है। सूरज को वह कभी छूता नहीं।","गहरी नींद में इंद्रियाँ और मन सिमट जाते हैं, पर तुम शुद्ध अस्तित्व के रूप में रहते हो।","“मैं अच्छा सोया” एक स्मृति है। उसे अनुभव करने वाला कोई वहाँ था।"],"en":["राहु द्वारा ग्रसे सूर्य या चंद्रमा की तरह, माया से ढका हुआ,","जो गहरी नींद में, इंद्रियों के सिमट जाने पर, शुद्ध अस्तित्व बनकर रहता है,","और जागने पर स्वयं को पहचानता है: “मैं सोया था”,"],"words":["राहु से ग्रसा","सूर्य","चंद्रमा","समान","ढकने से","शुद्ध अस्तित्व","इंद्रियाँ","समेट लेने से","गहरी नींद में","व्यक्ति","“अब तक मैं सोया था”","जागने पर","स्वयं को पहचानता है"]},{"name":"न बदलने वाला मैं","teach":"बचपन बीतता है, जवानी बीतती है, सपने बीतते हैं। उन सब में मौजूद “मैं हूँ” कभी नहीं बीतता।","keep":["अवस्थाएँ मनकों की तरह बदलती हैं। “मैं हूँ” का धागा उन सब में पिरोया है।","तुम कभी बच्चे थे, अब बड़े हो। दोनों बातें कहने वाला “मैं” एक ही है।","चिन्मुद्रा: जीव की तर्जनी अनंत के अंगूठे को छूती है, और वृत्त पूरा हो जाता है।"],"en":["बचपन, जवानी और बुढ़ापे में, जागने, सपने और गहरी नींद में, हर अवस्था में,","अवस्थाएँ आती-जाती रहती हैं, पर “मैं हूँ” बना रहता है, सदा भीतर चमकता हुआ।","जो उन्हें खोजते हैं, उन्हें वे ज्ञान की शुभ मुद्रा से यह अपनी ही आत्मा दिखा देते हैं,"],"words":["बचपन आदि में","जागने आदि में","अवस्थाओं में","उनके बीतते हुए","बना रहता हुआ","“मैं” के रूप में","भीतर","चमकता हुआ","सदा","अपनी आत्मा","प्रकट करते हैं","खोजने वालों को","शुभ मुद्रा से"]},{"name":"भूमिकाओं का सपना","teach":"कारण और कार्य, स्वामी और संपत्ति, गुरु और शिष्य, माता-पिता और संतान। जैसे सपना देखने वाला सपने का हर व्यक्ति स्वयं होता है, वैसे ही एक आत्मा हर भूमिका निभाती है।","keep":["सपने में तुम ही नगर हो, तुम ही भीड़, और उसमें से चलने वाले भी तुम ही।","भूमिकाएँ भूमिकाओं के रूप में सच हैं। उन्हें निभाने वाला बँटा हुआ नहीं है।","जैसे सुबह सपने को समाप्त कर देती है, वैसे ही गुरु तुम्हें जगाते हैं।"],"en":["मनुष्य संसार को कारण और कार्य के रूप में, संपत्ति और स्वामी के रूप में देखता है,","शिष्य और गुरु, पिता और पुत्र के रूप में, सब कुछ भेद के रूप में।","सपने में हो या जागते हुए, यह व्यक्ति माया से घुमाया जाता है,"],"words":["संसार","देखता है","कार्य","कारण","संपत्ति","स्वामी","संबंध से","शिष्य","आचार्य","पिता","पुत्र","भेद के रूप में","सपने में","जागते हुए","माया से घुमाया हुआ"]}]}};

let LANG=(function(){try{const v=JSON.parse(localStorage.getItem('tr-lang')||'null');return LANGS.some(l=>l[0]===v)?v:null;}catch(e){return null;}})();
function lang(){return LANG||'en';}
function LX(s){const L=LANG&&LANG!=='en'?UI18N[LANG]:null;return (L&&L[s])||s;}
// Devanagari → Telugu / Kannada: the Brahmic blocks line up, so a fixed offset maps each letter
function devTo(dev,l){const off=l==='te'?0x300:l==='kn'?0x380:0;if(!off)return dev;let o='';for(const ch of dev){const c=ch.codePointAt(0);o+=(c>=0x0901&&c<=0x094D)||(c>=0x0958&&c<=0x0963)||(c>=0x0966&&c<=0x096F)?String.fromCodePoint(c+off):ch;}return o;}
// a tattva in the current language
function TL(n){const T=TATTVAS[n-1],l=lang(),X=l!=='en'&&TI18N[l]?TI18N[l]:null,x=X?X.t[n-1]:null;
 const four=T.dev.length>=4,dev=four?T.dev.slice(0,4):T.dev.concat([L4.dev]),iast=four?T.iast.slice(0,4):T.iast.concat([L4.iast]);
 return{n:T.n,name:x?x.name:T.name,teach:x?x.teach:T.teach,keep:x?x.keep:T.keep,en:(x?x.en:T.en).slice(0,3).concat([X?X.L4:L4.en]),
  verse:l==='en'?iast:dev.map(d=>devTo(d,l)),dev:dev,iast:iast,roman:l==='en',
  words:T.words.map((w,i)=>[w[0],x&&x.words[i]?x.words[i]:w[1]])};}
// changing language reloads the page, so every screen comes back fully in the new language
function setLang(l,noReload){if(!LANGS.some(x=>x[0]===l))return;const was=lang();LANG=l;try{localStorage.setItem('tr-lang',JSON.stringify(l));}catch(e){}
 document.documentElement.lang=l;if(!noReload&&l!==was){location.reload();return;}applyI18n();window.dispatchEvent(new Event('langchange'));}
/* Screen translator: text in the app is written in English; when another language is on, any text node (and placeholder,
   aria-label, title) whose whole text matches the table is swapped as it appears. English tattva names, teachings and
   meanings are added to the table from TI18N, and a few patterns handle text with numbers in it. User content opts out
   with data-notr. */
(function(){
 ['te','kn','hi'].forEach(l=>{const D=UI18N[l]||(UI18N[l]={}),X=TI18N[l];if(!X)return;
  TATTVAS.forEach((T,i)=>{const x=X.t[i];if(!x)return;D[T.name]=x.name;D[T.teach]=x.teach;T.keep.forEach((k,j)=>D[k]=x.keep[j]);T.en.forEach((e,j)=>D[e]=x.en[j]);T.words.forEach((w,j)=>{if(x.words[j])D[w[1]]=x.words[j];});});D[L4.en]=X.L4;});})();
const UIPAT={};
['te','kn','hi'].forEach(l=>{const D=UI18N[l],tv=D['Tattva']||'Tattva';
 UIPAT[l]=[[/^Tattva (\d)$/,tv+' $1'],[/^Tattva (\d) · (.+)$/,(m,n,name)=>tv+' '+n+' · '+(D[name]||name)],[/^Tattva (\d): (.+)$/,(m,n,name)=>tv+' '+n+': '+(D[name]||name)],
  [/^(\d+)s$/,'$1s'],[/^Start · (\d+) seconds$/,(m,n)=>(D['Start']||'Start')+' · '+n+'s']];});
function trText(v){if(!LANG||LANG==='en')return null;const k=v.trim();if(!k||k.length>400)return null;const D=UI18N[LANG];
 if(D[k])return v.replace(k,D[k]);for(const p of UIPAT[LANG]||[])if(p[0].test(k))return v.replace(k,k.replace(p[0],p[1]));return null;}
function trEl(el){if(!LANG||LANG==='en'||!el)return;if(el.nodeType===3){const p=el.parentNode;if(p&&p.closest&&p.closest('[data-notr],script,style,svg'))return;const r=trText(el.nodeValue);if(r!=null&&r!==el.nodeValue)el.nodeValue=r;return;}
 if(el.nodeType!==1||el.closest('[data-notr],script,style'))return;
 const at=n=>{['placeholder','aria-label','title'].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v){const r=trText(v);if(r!=null&&r!==v)n.setAttribute(a,r);}});};
 at(el);el.querySelectorAll('[placeholder],[aria-label],[title]').forEach(at);
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;const list=[];while((n=w.nextNode()))list.push(n);list.forEach(trEl);}
function startTranslator(){if(!LANG||LANG==='en')return;document.documentElement.lang=LANG;trEl(document.body);
 new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trEl(m.target);else{m.addedNodes.forEach(trEl);if(m.type==='attributes')trEl(m.target);}}})
  .observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});}
// static text in the markup carries data-t="English text"
function applyI18n(root){(root||document).querySelectorAll('[data-t]').forEach(el=>{el.textContent=LX(el.dataset.t);});
 (root||document).querySelectorAll('[data-tp]').forEach(el=>{el.setAttribute('placeholder',LX(el.dataset.tp));});

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var GLR=(function(){
 var W=360,H=560,S=Math.min(2,window.devicePixelRatio||1),MAXN=13000,data=new Float32Array(MAXN*7);
 var c=null,gl=null,ok=null,P1=null,P2=null,ibuf=null,vao=null,fvao=null,resLoc=null;
 function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
 function prog(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.bindAttribLocation(p,0,'q');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

   if(!gl){ok=false;return false;}
   P1=prog('#version 300 es\nin vec2 q;in vec2 ip;in vec2 isz;in float irot;in float ih;in float ia;uniform vec2 res;out vec2 vq;out float vh;out float va;void main(){float cs=cos(irot),sn=sin(irot);vec2 p=vec2(q.x*isz.x,q.y*isz.y);p=vec2(p.x*cs-p.y*sn,p.x*sn+p.y*cs)+ip;gl_Position=vec4(p.x/res.x*2.-1.,1.-p.y/res.y*2.,0.,1.);vq=q;vh=ih;va=ia;}',
    '#version 300 es\nprecision mediump float;in vec2 vq;in float vh;in float va;out vec4 o;void main(){float d=dot(vq,vq);if(d>1.)discard;float g=exp(-d*4.);vec3 c0=vec3(.42,.14,.03),c1=vec3(1.,.70,.20),c2=vec3(1.,.93,.70);vec3 col=vh<.6?mix(c0,c1,vh/.6):mix(c1,c2,min(1.,(vh-.6)/.4));o=vec4(col*g*va,1.);}');
   P2=prog('#version 300 es\nin vec2 q;uniform float dummy;void main(){gl_Position=vec4(q,0.,1.);}',
    '#version 300 es\nprecision mediump float;uniform float fade;out vec4 o;void main(){o=vec4(.043,.055,.133,fade);}');
   var qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
   ibuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ibuf);gl.bufferData(gl.ARRAY_BUFFER,data.byteLength,gl.DYNAMIC_DRAW);
   [['ip',2,0],['isz',2,8],['irot',1,16],['ih',1,20],['ia',1,24]].forEach(function(a){var l=gl.getAttribLocation(P1,a[0]);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,a[1],gl.FLOAT,false,28,a[2]);gl.vertexAttribDivisor(l,1);});
   resLoc=gl.getUniformLocation(P1,'res');
   fvao=gl.createVertexArray();gl.bindVertexArray(fvao);gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

 function clear(){gl.viewport(0,0,c.width,c.height);gl.clearColor(.043,.055,.133,1);gl.clear(gl.COLOR_BUFFER_BIT);}

})();

function rnd(seed){return mulberry32(seed);}
function clamp01(v){return v<0?0:v>1?1:v;}
var ENG={};

ENG['Splat bloom']=function(sc){
 var N=Math.round(9000*sc),r=rnd(11),x=new Float32Array(N),y=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),SH=[[],[],[]],i,k;
 for(k=0;k<3;k++){SH[k]=[new Float32Array(N),new Float32Array(N)];}
 var radii=[35,70,105,140];
 for(i=0;i<N;i++){
  var th=r()*6.2832,rad=(40+110*Math.pow(r(),.55))*(.35+.65*Math.abs(Math.cos(4*th)));
  SH[0][0][i]=180+Math.cos(th)*rad;SH[0][1][i]=300+Math.sin(th)*rad*.9;
  if(r()<.2){var yy=480-r()*150;SH[1][0][i]=180+(r()-.5)*(12+(480-yy)*.05);SH[1][1][i]=yy;}
  else{var a2=r()*6.2832,r2=Math.sqrt(r())*130;SH[1][0][i]=180+Math.cos(a2)*r2*1.05;SH[1][1][i]=250+Math.sin(a2)*r2*.7;}
  var th3,rd3;if(r()<.3){th3=Math.floor(r()*12)*Math.PI/6+(r()-.5)*.03;rd3=r()*140;}else{th3=r()*6.2832;rd3=radii[Math.floor(r()*4)]+(r()-.5)*6;}
  SH[2][0][i]=180+Math.cos(th3)*rd3;SH[2][1][i]=300+Math.sin(th3)*rd3;
  x[i]=r()*360;y[i]=60+r()*460;
 }
 return{n:N,trail:0,step:function(dt,A){
  var s=Math.floor(Math.max(0,A.idx)/4)%3,T=SH[s],br=1+A.env*.1+A.semi/12*.06,damp=Math.max(0,1-3.2*dt);
  for(i=0;i<N;i++){
   var tx=180+(T[0][i]-180)*br,ty=300+(T[1][i]-300)*br;
   vx[i]+=((tx-x[i])*5+(Math.random()-.5)*60*(.3+A.env))*dt-(y[i]-300)*.12*A.env*dt;
   vy[i]+=((ty-y[i])*5+(Math.random()-.5)*60*(.3+A.env))*dt+(x[i]-180)*.12*A.env*dt;
   vx[i]*=damp;vy[i]*=damp;x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;
   var sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]),d=Math.sqrt((x[i]-180)*(x[i]-180)+(y[i]-300)*(y[i]-300));
   GLR.put(i,x[i],y[i],5.5*(1+sp*.012),5.5/(1+sp*.006),Math.atan2(vy[i],vx[i]),clamp01(.3+.4*A.env+.3*(1-d/150)),.1+.06*A.env);
  }}};
};

ENG['Sound sand']=function(sc){
 var N=Math.round(11000*sc),X=new Float32Array(N),Y=new Float32Array(N),i,M=[[1,2],[2,3],[1,3],[3,4],[2,5],[3,5],[4,5],[1,4]],PI=Math.PI;
 for(i=0;i<N;i++){X[i]=Math.random();Y[i]=Math.random();}
 return{n:N,trail:0,step:function(dt,A){
  var m=M[Math.min(7,Math.floor(A.semi/12*7.99))],n1=m[0],m1=m[1],kick=A.env*.9*dt;
  for(i=0;i<N;i++){
   var x=X[i],y=Y[i],a=Math.cos(n1*PI*x),b=Math.cos(m1*PI*y),c=Math.cos(m1*PI*x),d=Math.cos(n1*PI*y),f=a*b-c*d;
   var fx=-n1*PI*Math.sin(n1*PI*x)*b+m1*PI*Math.sin(m1*PI*x)*d,fy=-m1*PI*a*Math.sin(m1*PI*y)+n1*PI*c*Math.sin(n1*PI*y);
   var g2=fx*fx+fy*fy+.05,rt=Math.min(1,6*dt);x+=-f*fx/g2*rt+(Math.random()-.5)*kick;y+=-f*fy/g2*rt+(Math.random()-.5)*kick;
   if(x<0)x=-x;if(x>1)x=2-x;if(y<0)y=-y;if(y>1)y=2-y;
   X[i]=x;Y[i]=y;
   GLR.put(i,30+x*300,130+y*300,3.4,3.4,0,clamp01(.9-Math.min(1,Math.abs(f)*3)*.65),.3);
  }}};
};

ENG['Flow rivers']=function(sc){
 var N=Math.round(12000*sc),x=new Float32Array(N),y=new Float32Array(N),life=new Float32Array(N),i;
 for(i=0;i<N;i++){x[i]=Math.random()*360;y[i]=Math.random()*560;life[i]=Math.random()*5;}
 var a=.013,b=.017,cc=.031,dd=.022;
 return{n:N,trail:.16,step:function(dt,A){
  var t=A.t,ang=(A.semi/12)*Math.PI*.6-Math.PI*.3,bs=40+A.env*90,bx=Math.cos(ang)*bs,by=Math.sin(ang)*bs;
  for(i=0;i<N;i++){
   var px=x[i],py=y[i],s1=Math.sin(a*px+t*.3),c1=Math.cos(a*px+t*.3),s2=Math.sin(b*py-t*.21),c2=Math.cos(b*py-t*.21),c3=Math.cos(cc*px-dd*py+t*.4);
   var dpx=a*c1*c2+.5*cc*c3,dpy=-b*s1*s2-.5*dd*c3,u=dpy*5000+bx,v=-dpx*5000+by;
   x[i]=px+u*dt;y[i]=py+v*dt;life[i]-=dt;
   if(life[i]<0||x[i]<-10||x[i]>370||y[i]<-10||y[i]>570){x[i]=Math.random()*360;y[i]=Math.random()*560;life[i]=3+Math.random()*4;}
   var sp=Math.sqrt(u*u+v*v);
   GLR.put(i,x[i],y[i],2.5+sp*.04,2,Math.atan2(v,u),clamp01(.25+sp/420+.2*A.env),.12);
  }}};
};

ENG['Embers']=function(sc){
 var N=Math.round(9000*sc),x=new Float32Array(N),y=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),life=new Float32Array(N),ml=new Float32Array(N),ptr=0,carry=0,i;
 function spawn(n,spread,up){for(var k=0;k<n;k++){var j=ptr;ptr=(ptr+1)%N;x[j]=180+(Math.random()+Math.random()-1)*spread;y[j]=470+Math.random()*10;vx[j]=(Math.random()-.5)*40;vy[j]=-(30+Math.random()*60)*up;ml[j]=life[j]=1.2+Math.random()*2.2;}}
 for(i=0;i<N;i++){life[i]=0;ml[i]=1;y[i]=-50;}
 return{n:N,trail:.22,step:function(dt,A){
  var spread=25+A.semi/12*45,rate=N/2.6*(.3+A.env*1.5)+N*.04;carry+=rate*dt;var c=Math.floor(carry);carry-=c;spawn(c,spread,1);
  if(A.ons)spawn(Math.round(N*.05),spread*1.6,2.2);
  for(i=0;i<N;i++){
   if(life[i]<=0){GLR.put(i,-50,-50,.1,.1,0,0,0);continue;}
   var h=life[i]/ml[i];
   vy[i]-=(50+90*h)*dt;vx[i]+=Math.sin(y[i]*.03+A.t*3+i)*70*dt;vx[i]*=Math.max(0,1-1.2*dt);vy[i]*=Math.max(0,1-.5*dt);
   x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;life[i]-=dt;
   var sz=1.8+6*Math.sqrt(h);
   GLR.put(i,x[i],y[i],sz,sz*1.2,0,h*.9,.03+.15*h);
  }}};
};

ENG['Gravity orbits']=function(sc){
 var N=Math.round(7000*sc),x=new Float32Array(N),y=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),i,GM=4e5,AT=[],ai=0;
 for(i=0;i<6;i++)AT.push({x:0,y:0,m:0,l:0});
 for(i=0;i<N;i++){var r=40+Math.sqrt(Math.random())*150,a=Math.random()*6.2832,v=Math.sqrt(GM/r)*(.9+Math.random()*.2);x[i]=180+Math.cos(a)*r;y[i]=300+Math.sin(a)*r;vx[i]=-Math.sin(a)*v;vy[i]=Math.cos(a)*v;}
 return{n:N+7,trail:.14,step:function(dt,A){
  if(A.ons){var at=AT[ai++%6];at.x=40+((Math.max(0,A.idx)%8)/7)*280;at.y=480-A.semi/12*360;at.m=3e5;at.l=3;}
  AT.forEach(function(at){at.l=Math.max(0,at.l-dt);});

   var dx=180-x[i],dy=300-y[i],d2=dx*dx+dy*dy+400,inv=GM/(d2*Math.sqrt(d2)),ax=dx*inv,ay=dy*inv;
   for(var k=0;k<6;k++){var a=AT[k];if(a.l>0){var ex=a.x-x[i],ey=a.y-y[i],e2=ex*ex+ey*ey+900,iv=a.m*(a.l/3)/(e2*Math.sqrt(e2));ax+=ex*iv;ay+=ey*iv;}}
   vx[i]+=ax*dt;vy[i]+=ay*dt;x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;
   if(x[i]<0||x[i]>360||y[i]<0||y[i]>560){var r2=60+Math.random()*120,a2=Math.random()*6.2832,v2=Math.sqrt(GM/r2);x[i]=180+Math.cos(a2)*r2;y[i]=300+Math.sin(a2)*r2;vx[i]=-Math.sin(a2)*v2;vy[i]=Math.cos(a2)*v2;}
   var sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]);
   GLR.put(i,x[i],y[i],2+sp*.03,2,Math.atan2(vy[i],vx[i]),clamp01(sp/170),.24);
  }
  GLR.put(N,180,300,26+A.env*14,26+A.env*14,0,.7,.2);
  for(var j=0;j<6;j++){var q=AT[j];GLR.put(N+1+j,q.x,q.y,q.l>0?10+q.l*6:.1,q.l>0?10+q.l*6:.1,0,.9,q.l>0?.35*(q.l/3):0);}
 }};
};

  return{send:m=>{if(ws.readyState===1)ws.send(JSON.stringify({m}));},track:x=>{if(ws.readyState===1)ws.send(JSON.stringify({track:x}));},close:()=>{open=false;try{ws.close();}catch(e){}}};}
 await loadSB();const cl=sbc();
 const ch=cl.channel('tr-room-'+code,{config:{broadcast:{self:false},presence:{key:me.pid}}});let joined=false;
 ch.on('broadcast',{event:'m'},({payload})=>h.msg(payload));
 ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState();h.presence(Object.keys(st).map(k=>st[k][0]).filter(Boolean));});
 ch.subscribe(async s=>{if(s==='SUBSCRIBED'){joined=true;try{await ch.track(me);}catch(e){}h.ready();}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){if(joined)h.lost();else h.fail();}});
 return{send:m=>{ch.send({type:'broadcast',event:'m',payload:m});},track:x=>{if(joined)ch.track(x).catch(()=>{});},close:()=>{try{cl.removeChannel(ch);}catch(e){}}};}



/* ---------- narration: the AI voice recites the shloka, then says what it means ---------- */
const NARR={buf:{},src:null,ctx:null,run:0};
function narrBuf(key,url){if(NARR.buf[key])return Promise.resolve(NARR.buf[key]);return fetch(url).then(r=>{if(!r.ok)throw r.status;return r.arrayBuffer();}).then(ab=>ARC.audio().decodeAudioData(ab)).then(b=>NARR.buf[key]=b);}
function narrStop(){NARR.run++;if(NARR.src){try{NARR.src.stop();}catch(e){}NARR.src=null;}try{speechSynthesis.cancel();}catch(e){}}
function narrPlay(buf){return new Promise(ok=>{const a=ARC.audio();if(!a||!buf){ok();return;}let done=false;const fin=()=>{if(!done){done=true;ok();}};const s=a.createBufferSource();s.buffer=buf;s.connect(a.destination);s.onended=fin;s.start();NARR.src=s;setTimeout(fin,(buf.duration+.6)*1000);});}
function narrSpeak(text,lang){return new Promise(ok=>{try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==='en-IN'?.95:.7;u.onend=ok;u.onerror=ok;speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(ok,lang==='en-IN'?9000:30000);}catch(e){ok();}});}
// Plays recitation then meaning; onStep(stage, lineIndex) drives the captions. Resolves when done (or skipped).
async function narrate(n,onStep){narrStop();const my=++NARR.run,V=TATTVAS[n-1],alive=()=>NARR.run===my;
 let rec=null,mean=null;onStep('load');
 try{[rec,mean]=await Promise.all([narrBuf('r'+n,'/api/tts?v='+n),narrBuf('m'+n,'/api/tts?v='+n+'&m=1')]);}catch(e){}
 if(!alive())return;
 if(rec){onStep('verse',0);const t0=Date.now(),line=rec.duration*1000/4,iv=setInterval(()=>{if(!alive()){clearInterval(iv);return;}onStep('verse',Math.min(3,Math.floor((Date.now()-t0)/line)));},200);await narrPlay(rec);clearInterval(iv);}
 else{const t0=Date.now(),iv=setInterval(()=>{if(!alive()){clearInterval(iv);return;}onStep('verse',Math.min(3,Math.floor((Date.now()-t0)/2500)));},250);onStep('verse',0);await Promise.all([narrSpeak(V.dev.join(' '),'hi-IN'),new Promise(r=>setTimeout(r,10000))]);clearInterval(iv);}
 if(!alive())return;onStep('meaning');
 if(mean)await narrPlay(mean);else await Promise.all([narrSpeak(V.teach,'en-IN'),new Promise(r=>setTimeout(r,4500))]);
 if(alive())onStep('done');}

/* during play: one line of the recitation at a time (the verse has four lines of equal metre), and the meaning at the end */
function narrPreload(n){narrBuf('r'+n,'/api/tts?v='+n).catch(()=>{});narrBuf('m'+n,'/api/tts?v='+n+'&m=1').catch(()=>{});}
function playSlice(buf,from,dur){const a=ARC.audio();if(!a||!buf)return;if(NARR.src){try{NARR.src.stop();}catch(e){}}const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.value=1.1;s.connect(g);g.connect(a.destination);s.start(0,from,dur);NARR.src=s;}
function gameVoice(n){return{line:i=>{const b=NARR.buf['r'+n];if(b)playSlice(b,b.duration*i/4,b.duration/4+.25);},meaning:()=>{const b=NARR.buf['m'+n];if(b)playSlice(b,0,b.duration);}};}

/* ---------- a play session: solo, or a live room where the host's phone keeps time and scores ---------- */
function newCode(){let c='';for(let i=0;i<6;i++)c+=CODE_AB[Math.floor(Math.random()*CODE_AB.length)];return c;}
function startRoom(opts){ARC.audio();closeRoom();narrStop();ARC.stop();
 const R=GS.live={code:opts.code||null,host:!!opts.host,solo:!!opts.solo,g:opts.g||null,phase:opts.solo?'intro':'lobby',players:{},online:{},net:null,lastState:0,stateSeq:0,startAt:0,seed:0,myScore:0,lastSent:0};
 R.players[GS.me]={pid:GS.me,name:opts.name,score:0,fin:false};
 showView('play');if(R.g){AUD.need(R.g.tattva);narrPreload(R.g.tattva);}paintPlay();
 if(R.solo){startIntro(R);return;}
 const me={pid:GS.me,name:opts.name};$('#pl-net').textContent='Connecting…';
 liveOpen(R.code,me,{ready:()=>{if(GS.live!==R)return;$('#pl-net').textContent='';if(!R.host)send({e:'hello',pid:GS.me,name:opts.name});else{broadcastState(true);announce(R);}},
  fail:()=>{if(GS.live!==R)return;$('#pl-net').textContent='';playMsg('Couldn’t connect to the live room. Check your connection and try again.');},
  lost:()=>{if(GS.live!==R)return;$('#pl-net').textContent='Reconnecting…';},
  presence:list=>{if(GS.live!==R)return;R.online={};list.forEach(p=>{if(p&&p.pid)R.online[p.pid]=p.name;});announce(R);if(R.host){list.forEach(p=>{if(p&&p.pid&&!R.players[p.pid])R.players[p.pid]={pid:p.pid,name:String(p.name||'player').slice(0,24),score:0,fin:false};});broadcastState(true);}if(R.phase==='lobby')paintPlay();},
  msg:m=>{if(GS.live===R)onMsg(R,m);}}).then(n=>{if(GS.live===R)R.net=n;else n.close();}).catch(()=>{if(GS.live===R)playMsg('Couldn’t load live play. Check your connection.');});
 R.t=setInterval(()=>tick(R),250);}
function closeRoom(){narrStop();ARC.stop();const R=GS.live;if(!R)return;clearInterval(R.t);if(R.net)R.net.close();if(R.ann)R.ann.close();GS.live=null;}
/* public lobby: every live room is listed here, so anyone on the site can join without a code */
function roomInfo(R){return{pid:'room-'+R.code,code:R.code,gid:R.g.id,title:R.g.title,type:R.g.type,tattva:R.g.tattva,n:Object.keys(R.online).length||1,phase:R.phase,host:(R.players[GS.me]||{}).name||''};}
function announce(R){if(!R.host||R.solo||!R.g||!R.code)return;const info=roomInfo(R),k=JSON.stringify(info);
 if(R.ann){if(k!==R.annKey){R.annKey=k;R.ann.track(info);}return;}if(R.annPending)return;R.annPending=true;
 liveOpen('LOBBY',info,{ready:()=>{if(GS.live===R&&R.ann){R.annKey=JSON.stringify(roomInfo(R));R.ann.track(roomInfo(R));}},fail:()=>{R.annPending=false;},lost:()=>{},presence:()=>{},msg:()=>{}})
  .then(n=>{if(GS.live===R){R.ann=n;R.annKey=JSON.stringify(roomInfo(R));n.track(roomInfo(R));}else n.close();}).catch(()=>{R.annPending=false;});}
const LOBBY={net:null,rooms:[],on:false};
function watchLobby(on){if(on===LOBBY.on)return;LOBBY.on=on;if(!on){if(LOBBY.net)LOBBY.net.close();LOBBY.net=null;return;}
 liveOpen('LOBBY',{pid:GS.me,watch:1},{ready:()=>{},fail:()=>{},lost:()=>{},msg:()=>{},presence:list=>{LOBBY.rooms=list.filter(x=>x&&x.code&&x.gid&&/^[A-Z0-9]{6}$/.test(x.code)&&x.phase!=='done');paintLive();if(GS.loaded&&LOBBY.rooms.some(r=>/^g/.test(r.gid)&&!GS.games.find(g=>g.id===r.gid))&&Date.now()-(LOBBY.reload||0)>8000){LOBBY.reload=Date.now();loadGames();}}})
  .then(n=>{if(LOBBY.on)LOBBY.net=n;else n.close();}).catch(()=>{});}
function paintLive(){gamesEl.querySelectorAll('.gcard').forEach(el=>{const id=el.id.slice(2),box=el.querySelector('.glive');if(!box)return;const rs=LOBBY.rooms.filter(r=>r.gid===id||(id.length===2&&String(r.gid).slice(0,2)===id));
  if(!rs.length){box.hidden=true;box.innerHTML='';return;}box.hidden=false;
  box.innerHTML=rs.slice(0,3).map(r=>'<button class="btn joinlive" data-code="'+esc(r.code)+'"><span class="dot"></span><span>Join '+esc(r.host||'a')+'’s game</span><small>Tattva '+(+r.tattva||1)+' · '+(r.phase==='lobby'?'waiting':'playing')+' · '+(+r.n||1)+' in</small></button>').join('');
  box.querySelectorAll('.joinlive').forEach(b=>b.onclick=()=>askName(name=>startRoom({code:b.dataset.code,name})));});
 const live=LOBBY.rooms.length,pill=$('#gx-live');if(pill){pill.hidden=!live;pill.textContent=live+' live';}}

function send(m){const R=GS.live;if(R&&R.net)R.net.send(m);}
function playMsg(t){const R=GS.live;if(R){R.err=t;paintPlay();}}
function onMsg(R,m){
 if(m.e==='state'&&!R.host){if(m.seq<R.stateSeq)return;R.stateSeq=m.seq;const was=R.phase;const og=R.g&&R.g.tattva;R.g=cleanGame(m.g);if(R.g&&R.g.tattva!==og){AUD.need(R.g.tattva);narrPreload(R.g.tattva);}
  m.players.forEach(p=>{if(p.pid!==GS.me||!R.players[p.pid])R.players[p.pid]=p;else{R.players[p.pid].fin=p.fin;}});
  if(m.phase==='count'&&was!=='count'&&was!=='play'){R.seed=m.seed;R.startAt=Date.now()+m.rem;R.phase='count';paintPlay();return;}
  if(m.phase==='done'&&was!=='done'){R.phase='done';ARC.stop();paintPlay();return;}
  if(m.phase==='lobby'&&was==='done'){R.phase='lobby';R.myScore=0;paintPlay();return;}
  if(R.phase==='lobby'||R.phase==='done')paintPlay();else paintLiveBoard(R);return;}
 if(!R.host)return;
 if(m.e==='hello'){if(!R.players[m.pid])R.players[m.pid]={pid:m.pid,name:String(m.name||'player').replace(/[<>]/g,'').slice(0,24),score:0,fin:false};broadcastState(true);if(R.phase==='lobby')paintPlay();}
 else if(m.e==='sc'&&R.players[m.pid]&&(R.phase==='play'||R.phase==='count')){const p=R.players[m.pid];p.score=Math.max(0,Math.min(99999,+m.s||0));if(m.fin)p.fin=true;broadcastState();paintLiveBoard(R);maybeDone(R);}}
function snapshot(R){return Object.values(R.players).map(p=>({pid:p.pid,name:p.name,score:p.score,fin:!!p.fin}));}
function broadcastState(force){const R=GS.live;if(!R||!R.host||R.solo)return;announce(R);const now=Date.now();if(!force&&now-R.lastState<500)return;R.lastState=now;
 send({e:'state',seq:++R.stateSeq,g:R.g,phase:R.phase,seed:R.seed,rem:Math.max(0,R.startAt-now),players:snapshot(R)});}
function tick(R){if(GS.live!==R)return;const now=Date.now();
 if(R.phase==='count'){const n=Math.ceil((R.startAt-now)/1000),el=$('#pl-count');if(el&&el.textContent!==String(Math.max(1,n))){el.textContent=Math.max(1,n);el.style.animation='none';void el.offsetWidth;el.style.animation='';}if(now>=R.startAt)beginGame(R);}
 if(R.host&&!R.solo){if(R.phase==='play'&&now>R.startAt+secsOf(R.g)*1000+6000)finishRoom(R);if(now-R.lastState>2000)broadcastState(true);}}
function hostStart(){const R=GS.live;if(!R||!R.host)return;narrStop();Object.values(R.players).forEach(p=>{p.score=0;p.fin=false;});R.myScore=0;R.seed=Math.floor(Math.random()*1e9);R.startAt=Date.now()+4000;R.phase='count';
 if(R.g&&!R.g.official)API('/api/games',{method:'POST',body:JSON.stringify({played:R.g.id})}).catch(()=>{});broadcastState(true);paintPlay();}
function maybeDone(R){const ids=Object.keys(R.players).filter(id=>R.online[id]||id===GS.me);if(R.phase==='play'&&ids.length&&ids.every(id=>R.players[id].fin))finishRoom(R);}
function finishRoom(R){if(R.phase==='done')return;R.phase='done';ARC.stop();broadcastState(true);paintPlay();}
function beginGame(R){if(R.phase!=='count')return;R.phase='play';paintPlay();
 const host=$('#ar-host');narrStop();const ok=ARC.start(styleOf(R.g),{host,seed:R.seed||Math.floor(Math.random()*1e9),level:R.g.settings.level,tattva:R.g.tattva,secs:secsOf(R.g),voice:gameVoice(R.g.tattva),
  onScore:sc=>{R.myScore=sc;if(!R.solo){const me=R.players[GS.me];if(me)me.score=sc;if(R.host){broadcastState();paintLiveBoard(R);}else if(Date.now()-R.lastSent>600){R.lastSent=Date.now();send({e:'sc',pid:GS.me,s:sc});}}},
  onEnd:sc=>{if(GS.live!==R)return;R.myScore=sc;saveScore(R.g.id,sc);const me=R.players[GS.me];if(me){me.score=sc;me.fin=true;}
   if(R.solo){R.phase='done';R.newBest=setBest(R.g.id,sc);if(!R.g.official)API('/api/games',{method:'POST',body:JSON.stringify({played:R.g.id})}).catch(()=>{});paintPlay();return;}
   R.newBest=setBest(R.g.id,sc);if(R.host){broadcastState(true);maybeDone(R);}else{send({e:'sc',pid:GS.me,s:sc,fin:true});}paintLiveBoard(R);}});
 if(!ok)playMsg('This game needs WebGL, which your browser has turned off.');
 if(!R.solo)paintLiveBoard(R);}
function startIntro(R){R.phase='intro';paintPlay();
 narrate(R.g.tattva,(st,li)=>{if(GS.live!==R||R.phase!=='intro')return;const box=$('#pl-body .intro');if(!box)return;box.dataset.st=st;
  box.querySelectorAll('.iv .dev').forEach((el,i)=>el.classList.toggle('on',st==='verse'&&i===li));box.querySelector('.imean').classList.toggle('on',st==='meaning'||st==='done');
  const lab=box.querySelector('.istate');lab.textContent=st==='load'?'Loading the recitation…':st==='verse'?'Listen: the shloka':st==='meaning'?'What it means':'Ready';
  if(st==='done')setTimeout(()=>{if(GS.live===R&&R.phase==='intro')goCount(R);},700);});}
function goCount(R){narrStop();R.startAt=Date.now()+3000;R.phase='count';paintPlay();if(R.solo&&!R.t)R.t=setInterval(()=>tick(R),250);}

function introHTML(g){const V=TL(g.tattva),A=styleOf(g);
 return '<div class="intro" data-st="load"><p class="eyebrow">'+esc(LX('Tattva'))+' '+g.tattva+' · '+esc(V.name)+'</p><p class="lab istate">'+esc(LX('Loading the recitation…'))+'</p>'+
