<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tattva Reels</title>
<meta name="description" content="Short reels that teach the eight tattvas of the Dakṣiṇāmūrti Aṣṭakam. Watch, sing the verse, and share what you learnt.">
<meta name="theme-color" content="#07050F">
<meta property="og:title" content="Tattva Reels"><meta property="og:description" content="The world, like a city in a mirror. Watch, sing and share the eight tattvas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307050F'/%3E%3Cg fill='none' stroke='%23E9B44C' stroke-width='3' stroke-linejoin='round'%3E%3Cpath d='M32 52c-6-5-9-11-9-19 0-7 3-14 9-19 6 5 9 12 9 19 0 8-3 14-9 19Z'/%3E%3Cpath d='M32 52c-11 0-20-6-23-16 6-1 12 1 16 5'/%3E%3Cpath d='M32 52c11 0 20-6 23-16-6-1-12 1-16 5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, full-height; Reels feed is a vertical snap scroller, sheets rise from the bottom. Single deliberate dark world: temple night, lamp gold, kumkum. */
:root{
  --night:#0D0918;--deep:#07050F;--panel:#171026;--panel2:#221836;
  --ink:#F6EBD2;--muted:#B9AC90;--faint:rgba(246,235,210,.14);
  --gold:#E9B44C;--gold2:#F6D58E;--saffron:#EE8A2A;--kumkum:#D23B3B;--ok:#7FD1A6;--bad:#FF8E84;
  --f-disp:'Rozha One',Georgia,serif;--f-dev:'Tiro Devanagari Sanskrit','Noto Serif Devanagari',Georgia,serif;--f-ui:'Mukta','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  background:var(--night) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g fill='none' stroke='%23E9B44C' stroke-opacity='.07'><circle cx='120' cy='120' r='100'/><circle cx='120' cy='120' r='70'/><path d='M120 30 198 165H42Z'/><path d='M120 210 42 75h156Z'/><circle cx='120' cy='120' r='4'/></g></svg>") center/240px repeat}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--deep)}
@media (min-width:720px){#app{height:calc(100% - 32px);margin-top:16px;border-radius:26px;box-shadow:0 0 0 1px var(--faint),0 40px 90px rgba(0,0,0,.7)}}
.view{position:absolute;left:0;right:0;top:0;bottom:58px}
.view.full{bottom:0;z-index:8;background:var(--deep)}
.nav{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:6;display:flex;justify-content:space-around;align-items:center;background:var(--deep);border-top:1px solid var(--faint)}
.nav button{width:72px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11px;font-weight:600}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .create{width:54px;height:36px;border-radius:11px;border:1.5px solid var(--gold);color:var(--gold);flex-direction:row}
.topbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{font-family:var(--f-disp);font-size:27px;line-height:1;display:flex;align-items:baseline;gap:8px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.logo small{font-family:var(--f-dev);font-size:18px;color:var(--gold)}
.glass{background:rgba(7,5,15,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--faint)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.hint{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;animation:bob 2.4s ease-in-out infinite}
.hint svg{width:18px;height:18px}
@keyframes bob{50%{transform:translateX(-50%) translateY(3px)}}
.reels{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--deep);-webkit-user-select:none;user-select:none}
.reel>canvas,.stagecv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(7,5,15,.6) 0,rgba(7,5,15,0) 16%,rgba(7,5,15,0) 48%,rgba(7,5,15,.88) 100%)}
.rail{position:absolute;right:6px;bottom:104px;z-index:2;display:flex;flex-direction:column;gap:18px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.rbtn svg{width:32px;height:32px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.rbtn.on{color:var(--gold)}
.rbtn.on svg{fill:rgba(233,180,76,.38)}
.rbtn.pop svg{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.cap{position:absolute;left:14px;right:70px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-disp);font-size:15px;color:#1A1206;text-shadow:none;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 2px var(--deep),0 0 0 3.5px var(--gold)}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:5px;border:1px solid rgba(246,235,210,.45)}
.rtitle{font-family:var(--f-disp);font-size:21px;line-height:1.15}
.rtitle span{color:var(--gold2)}
.rcap{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pada{min-height:3.5em;display:flex;flex-direction:column;gap:1px;transition:opacity .35s}
.pada.swap{opacity:0}
.pada .dev{font-family:var(--f-dev);font-size:19px;line-height:1.35;color:var(--gold2)}
.pada .ia{font-family:var(--f-dev);font-style:italic;font-size:13px;color:var(--muted)}
.music{display:flex;align-items:center;gap:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.music svg{width:15px;height:15px}
.music .mq{overflow:hidden;flex:1;min-width:0;-webkit-mask-image:linear-gradient(to right,#000 80%,transparent);mask-image:linear-gradient(to right,#000 80%,transparent)}
.music .mq span{display:inline-block;padding-right:40px;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(246,235,210,.16);z-index:2}
.prog i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.flash{position:absolute;left:50%;top:46%;width:78px;height:78px;margin:-39px;border-radius:50%;background:rgba(7,5,15,.55);display:grid;place-items:center;z-index:3;pointer-events:none;animation:flash .75s ease forwards}
.flash svg{width:34px;height:34px}
@keyframes flash{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.burst{position:absolute;width:120px;height:120px;margin:-60px;pointer-events:none;z-index:5;color:var(--gold)}
.burst svg{width:100%;height:100%;fill:rgba(233,180,76,.6);stroke-width:1.2;filter:drop-shadow(0 0 14px rgba(233,180,76,.8));animation:burst .95s cubic-bezier(.2,1.4,.4,1) forwards}
.burst i{position:absolute;left:50%;top:50%;width:8px;height:15px;margin:-7px -4px;border-radius:50%;background:var(--gold2);transform:rotate(var(--a));animation:petal .9s ease-out forwards}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.12);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.25) translateY(-36px);opacity:0}}
@keyframes petal{to{transform:rotate(var(--a)) translateY(-78px);opacity:0}}
.endcard{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;padding:16px 16px 22px;background:rgba(7,5,15,.5);animation:fade .35s}
.ecard{width:100%;background:rgba(23,16,38,.94);border:1px solid rgba(233,180,76,.35);border-radius:22px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:rise .5s cubic-bezier(.2,.9,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.teach{font-family:var(--f-disp);font-size:22px;line-height:1.25;text-wrap:balance}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{height:48px;border-radius:13px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 14px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--saffron));color:#1A1206}
.btn.line{border:1px solid var(--faint)}
.btn.done{background:rgba(233,180,76,.14);color:var(--gold);border:1px solid rgba(233,180,76,.5)}
.row2{display:flex;gap:10px}
.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid rgba(233,180,76,.32);transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s}
.sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1)}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(246,235,210,.25);margin:10px auto 2px;flex:none}
.sbody{overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-title{font-family:var(--f-disp);font-size:25px;line-height:1.15;margin:0;text-wrap:balance}
.lab{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--faint);font-size:14px;background:var(--panel2)}
.chip.on{background:var(--gold);color:#1A1206;border-color:var(--gold);font-weight:600}
.learnbox{background:linear-gradient(180deg,rgba(233,180,76,.13),rgba(233,180,76,.03));border:1px solid rgba(233,180,76,.32);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.bignum{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.bignum.bump{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.shloka{display:flex;flex-direction:column}
.ln{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--faint)}
.ln:last-child{border-bottom:0}
.ln .dev{font-family:var(--f-dev);font-size:19px;line-height:1.4;color:var(--gold2)}
.ln .ia{font-family:var(--f-dev);font-style:italic;font-size:13px;color:var(--muted)}
.ln .en{font-size:14px}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.word{background:var(--panel2);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;min-width:0}
.word b{font-family:var(--f-dev);font-style:italic;font-weight:400;color:var(--gold2);font-size:15px}
.word span{font-size:13px;color:var(--muted)}
.keep{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.keep li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.keep svg{color:var(--gold);width:20px;height:20px;margin-top:2px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--faint);background:var(--deep);color:var(--ink);padding:0 12px;font:inherit;font-size:13px}
.linkbox .btn{width:auto}
.field{height:50px;border-radius:13px;border:1px solid var(--faint);background:var(--deep);color:var(--ink);padding:0 14px;font:inherit;width:100%}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.trow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);text-align:left;width:100%}
.trow .n{font-family:var(--f-disp);font-size:24px;width:28px;text-align:center;color:var(--gold)}
.trow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.trow .t b{font-weight:600}
.trow .t small{color:var(--muted);font-size:12px}
.trow[disabled]{opacity:.5;cursor:default}
.trow.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
.ctop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}
.tpill{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;min-width:0}
.tpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpill svg{width:18px;height:18px}
.tools{position:absolute;right:10px;top:72px;z-index:4;display:flex;flex-direction:column;gap:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tool .ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);color:#1A1206;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;text-shadow:none}
.cbottom{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:40px 0 18px;background:linear-gradient(to top,rgba(7,5,15,.92),rgba(7,5,15,0));display:flex;flex-direction:column;gap:10px;align-items:center}
.fxname{font-family:var(--f-disp);font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.9);min-height:1.3em}
.fxname.rec{color:var(--kumkum);font-family:var(--f-ui);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.fx{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:6px calc(50% - 31px);scrollbar-width:none}
.fx::-webkit-scrollbar{display:none}
.fxb{flex:none;width:62px;height:62px;border-radius:50%;overflow:hidden;scroll-snap-align:center;border:2px solid rgba(246,235,210,.3);position:relative;background:var(--panel);transition:transform .2s,border-color .2s}
.fxb canvas{width:100%;height:100%;object-fit:cover;display:block}
.fxb.on{border-color:var(--gold);transform:scale(1.08);box-shadow:0 0 0 3px rgba(233,180,76,.25),0 0 20px rgba(233,180,76,.45)}
.fxb .tx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;color:var(--gold2)}
.shrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 18px}
.side{width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.side .ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.shutter{width:80px;height:80px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;position:relative}
.shutter i{width:62px;height:62px;border-radius:50%;background:var(--kumkum);transition:all .25s cubic-bezier(.3,1.4,.5,1)}
.shutter.live{border-color:var(--kumkum)}
.shutter.live i{width:28px;height:28px;border-radius:8px}
.next{height:42px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--deep);font-weight:700;display:flex;align-items:center;gap:4px}
.next svg{width:18px;height:18px}
.guide{position:absolute;left:14px;right:72px;top:72px;z-index:4;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.guide canvas{width:100%;height:60px;border-radius:8px;display:block}
.rescard{position:absolute;left:14px;right:14px;bottom:214px;z-index:5;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .45s cubic-bezier(.2,.9,.2,1)}
.rescard.ok{background:rgba(16,44,34,.95);border:1px solid rgba(127,209,166,.5)}
.rescard.bad{background:rgba(58,16,22,.95);border:1px solid rgba(255,142,132,.5)}
.rescard canvas{width:100%;height:64px;border-radius:10px;display:block;background:rgba(7,5,15,.6)}
.resrow{display:flex;align-items:center;gap:12px}
.resrow b{font-family:var(--f-disp);font-size:21px;display:block;line-height:1.1}
.resrow small{font-size:13px;color:var(--ink)}
.rescard.ok .resrow b,.rescard.ok .pct{color:var(--ok)}
.rescard.bad .resrow b,.rescard.bad .pct{color:var(--bad)}
.pct{font-family:var(--f-disp);font-size:34px;margin-left:auto;font-variant-numeric:tabular-nums}
.rpanel{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:56px 16px 18px;background:linear-gradient(to top,var(--deep) 62%,rgba(7,5,15,0));display:flex;flex-direction:column;gap:12px}
.rpanel textarea{width:100%;height:58px;border-radius:13px;background:rgba(23,16,38,.9);border:1px solid var(--faint);color:var(--ink);padding:10px 12px;font:inherit;resize:none}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.sum span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(246,235,210,.08);border:1px solid var(--faint)}
.top{position:absolute;inset:0;overflow-y:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border-radius:16px;padding:14px;border:1px solid var(--faint)}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:32px;color:var(--gold2);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.lb{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-radius:18px;background:var(--panel);border:1px solid var(--faint);width:100%;text-align:left}
.lrow .rk{font-family:var(--f-disp);font-size:26px;width:30px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.lrow:first-child{border-color:rgba(233,180,76,.45);background:linear-gradient(90deg,rgba(233,180,76,.1),var(--panel) 60%)}
.lthumb{width:50px;height:78px;border-radius:10px;overflow:hidden;flex:none;background:var(--deep)}
.lthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.lmid{flex:1;min-width:0}
.lmid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmid small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcount{display:flex;flex-direction:column;align-items:center;color:var(--gold2);font-family:var(--f-disp);font-size:20px;line-height:1;gap:2px;font-variant-numeric:tabular-nums}

{n:1,name:'The mirror city',
 dev:['विश्वं दर्पणदृश्यमाननगरीतुल्यं निजान्तर्गतं','पश्यन्नात्मनि मायया बहिरिवोद्भूतं यथा निद्रया ।','यः साक्षात्कुरुते प्रबोधसमये स्वात्मानमेवाद्वयं'],
 iast:['viśvaṁ darpaṇa-dṛśyamāna-nagarī-tulyaṁ nijāntargataṁ','paśyann ātmani māyayā bahir ivodbhūtaṁ yathā nidrayā','yaḥ sākṣāt kurute prabodha-samaye svātmānam evādvayaṁ'],
 en:['The universe is like a city seen in a mirror. It exists within oneself.','Through māyā it seems to appear outside, as a dream does in sleep.','The one who, at the moment of awakening, sees directly his own Self, one without a second,'],
 teach:'The world you see is like a city reflected in a mirror. It seems to be outside, yet it shines within you.',
 keep:['A reflection depends on the mirror. The world you see depends on the awareness that sees it.','A dream city feels real until you wake. Then you see it was in you all along.','The guru’s gift is that awakening: you are the one awareness, without a second.'],
 words:[['viśvam','the universe'],['darpaṇa','mirror'],['dṛśyamāna','being seen'],['nagarī','city'],['tulyam','just like'],['nija-antargatam','within oneself'],['māyayā','through māyā'],['bahiḥ iva','as if outside'],['nidrayā','in sleep'],['prabodha-samaye','at awakening'],['sva-ātmānam','one’s own Self'],['advayam','without a second']]},
{n:2,name:'The seed',
 dev:['बीजस्यान्तरिवाङ्कुरो जगदिदं प्राङ्निर्विकल्पं पुनः','मायाकल्पितदेशकालकलनावैचित्र्यचित्रीकृतम् ।','मायावीव विजृम्भयत्यपि महायोगीव यः स्वेच्छया'],
 iast:['bījasyāntar ivāṅkuro jagad idaṁ prāṅ nirvikalpaṁ punaḥ','māyā-kalpita-deśa-kāla-kalanā-vaicitrya-citrīkṛtam','māyāvīva vijṛmbhayaty api mahā-yogīva yaḥ svecchayā'],
 en:['Like the sprout inside a seed, this world at first lies undivided.','Then, through māyā, it is painted with the endless variety of space and time.','The one who unfolds it by his own will, like a magician, like a great yogi,'],
 teach:'The whole world rests in the Self like a tree inside a seed. Space and time unfold it, the way a magician conjures a show.',
 keep:['A seed holds the whole tree before it sprouts. The Self holds the world before it appears.','Space and time are the painter’s brush: they give the one canvas its many colours.','Like a magician who is never fooled by his own show, the Self stays untouched by the world it unfolds.'],
 words:[['bījasya antaḥ','inside the seed'],['aṅkuraḥ','sprout'],['jagat idam','this world'],['prāk','at first'],['nirvikalpam','undivided'],['māyā-kalpita','imagined by māyā'],['deśa','space'],['kāla','time'],['vaicitrya','variety'],['citrīkṛtam','painted'],['māyāvī','magician'],['vijṛmbhayati','unfolds'],['mahā-yogī','great yogi'],['sva-icchayā','by his own will']]},
{n:3,name:'That you are',
 dev:['यस्यैव स्फुरणं सदात्मकमसत्कल्पार्थकं भासते','साक्षात्तत्त्वमसीति वेदवचसा यो बोधयत्याश्रितान् ।','यत्साक्षात्करणाद्भवेन्न पुनरावृत्तिर्भवाम्भोनिधौ'],
 iast:['yasyaiva sphuraṇaṁ sadātmakam asat-kalpārthakaṁ bhāsate','sākṣāt tat tvam asīti veda-vacasā yo bodhayaty āśritān','yat-sākṣāt-karaṇād bhaven na punar āvṛttir bhavāmbhonidhau'],
 en:['His shining alone, which is existence itself, appears in things that are unreal.','Through the Vedic words “You are That”, he awakens those who come to him.','Seeing That directly, one never returns to the ocean of birth and death,'],
 teach:'Everything you see shines only because existence shines through it. The guru points and says: you are That.',
 keep:['A pot “is”, a tree “is”. That “is” is the one existence shining in every thing.','“Tat tvam asi”: what shines in everything is what you are.','Know it directly, and the cycle of becoming has nowhere to pull you back.'],
 words:[['sphuraṇam','shining'],['sat-ātmakam','existence itself'],['asat','unreal'],['bhāsate','appears'],['sākṣāt','directly'],['tat','That'],['tvam','you'],['asi','are'],['veda-vacasā','by the words of the Veda'],['bodhayati','awakens'],['āśritān','those who come'],['āvṛttiḥ','return'],['bhava-ambhonidhau','in the ocean of becoming']]},
{n:4,name:'The lamp in the pot',
 dev:['नानाच्छिद्रघटोदरस्थितमहादीपप्रभाभास्वरं','ज्ञानं यस्य तु चक्षुरादिकरणद्वारा बहिः स्पन्दते ।','जानामीति तमेव भान्तमनुभात्येतत्समस्तं जगत्'],
 iast:['nānācchidra-ghaṭodara-sthita-mahā-dīpa-prabhā-bhāsvaraṁ','jñānaṁ yasya tu cakṣur-ādi-karaṇa-dvārā bahiḥ spandate','jānāmīti tam eva bhāntam anubhāty etat samastaṁ jagat'],
 en:['Like the bright light of a great lamp inside a pot with many holes,','his knowing streams outward through the eyes and the other senses.','“I know”: he shines, and only after him does this whole world shine,'],
 teach:'Your awareness is a lamp inside a pot full of holes. It shines out through the eyes and ears, and the world lights up.',
 keep:['The holes are many, the light is one. The senses are many, awareness is one.','Nothing in the world shines by itself. It is seen because awareness shines first.','“I know” is the lamp. Everything known is lit by it.'],
 words:[['nānā chidra','many holes'],['ghaṭa-udara','inside a pot'],['mahā-dīpa','great lamp'],['prabhā','light'],['jñānam','knowing'],['cakṣuḥ-ādi','the eyes and the rest'],['karaṇa','senses'],['dvārā','through'],['bahiḥ','outward'],['spandate','streams'],['jānāmi','I know'],['bhāntam','shining'],['anubhāti','shines after']]},
{n:5,name:'Not the body',
 dev:['देहं प्राणमपीन्द्रियाण्यपि चलां बुद्धिं च शून्यं विदुः','स्त्रीबालान्धजडोपमास्त्वहमिति भ्रान्ता भृशं वादिनः ।','मायाशक्तिविलासकल्पितमहाव्यामोहसंहारिणे'],
 iast:['dehaṁ prāṇam apīndriyāṇy api calāṁ buddhiṁ ca śūnyaṁ viduḥ','strī-bālāndha-jaḍopamās tv aham iti bhrāntā bhṛśaṁ vādinaḥ','māyā-śakti-vilāsa-kalpita-mahā-vyāmoha-saṁhāriṇe'],
 en:['Some take the “I” to be the body, the breath, the senses, the restless mind, or emptiness.','Naive as children or the blind, they are deeply mistaken, though they argue loudly.','To him who ends this great delusion, conjured by the play of māyā’s power,'],
 teach:'You are not the body, the breath, the senses or the mind. Those are things you know. The knower is what you are.',
 keep:['Whatever you can watch is not the watcher. You watch the body, the breath, the thoughts.','Thoughts come and go. The one who sees them come and go stays.','The guru doesn’t add anything. He removes the mistake, and what is left is you.'],

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var GLR=(function(){
 var W=360,H=560,S=Math.min(2,window.devicePixelRatio||1),MAXN=13000,data=new Float32Array(MAXN*7);
 var c=null,gl=null,ok=null,P1=null,P2=null,ibuf=null,vao=null,fvao=null,resLoc=null;
 function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
 function prog(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.bindAttribLocation(p,0,'q');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
 function init(){
  if(ok!==null)return ok;
  try{
   c=document.createElement('canvas');c.width=Math.round(W*S);c.height=Math.round(H*S);
   gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
   if(!gl){ok=false;return false;}
   P1=prog('#version 300 es\nin vec2 q;in vec2 ip;in vec2 isz;in float irot;in float ih;in float ia;uniform vec2 res;out vec2 vq;out float vh;out float va;void main(){float cs=cos(irot),sn=sin(irot);vec2 p=vec2(q.x*isz.x,q.y*isz.y);p=vec2(p.x*cs-p.y*sn,p.x*sn+p.y*cs)+ip;gl_Position=vec4(p.x/res.x*2.-1.,1.-p.y/res.y*2.,0.,1.);vq=q;vh=ih;va=ia;}',
    '#version 300 es\nprecision mediump float;in vec2 vq;in float vh;in float va;out vec4 o;void main(){float d=dot(vq,vq);if(d>1.)discard;float g=exp(-d*4.);vec3 c0=vec3(.42,.14,.03),c1=vec3(1.,.70,.20),c2=vec3(1.,.93,.70);vec3 col=vh<.6?mix(c0,c1,vh/.6):mix(c1,c2,min(1.,(vh-.6)/.4));o=vec4(col*g*va,1.);}');
   P2=prog('#version 300 es\nin vec2 q;uniform float dummy;void main(){gl_Position=vec4(q,0.,1.);}',
    '#version 300 es\nprecision mediump float;uniform float fade;out vec4 o;void main(){o=vec4(.043,.055,.133,fade);}');
   var qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
   vao=gl.createVertexArray();gl.bindVertexArray(vao);
   gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
   ibuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ibuf);gl.bufferData(gl.ARRAY_BUFFER,data.byteLength,gl.DYNAMIC_DRAW);
   [['ip',2,0],['isz',2,8],['irot',1,16],['ih',1,20],['ia',1,24]].forEach(function(a){var l=gl.getAttribLocation(P1,a[0]);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,a[1],gl.FLOAT,false,28,a[2]);gl.vertexAttribDivisor(l,1);});
   resLoc=gl.getUniformLocation(P1,'res');
   fvao=gl.createVertexArray();gl.bindVertexArray(fvao);gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
   ok=true;
  }catch(e){ok=false;}
  return ok;
 }
 function clear(){gl.viewport(0,0,c.width,c.height);gl.clearColor(.043,.055,.133,1);gl.clear(gl.COLOR_BUFFER_BIT);}
 function draw(n,trail){
  gl.viewport(0,0,c.width,c.height);
  if(trail>0){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(P2);gl.uniform1f(gl.getUniformLocation(P2,'fade'),trail);gl.bindVertexArray(fvao);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
  else clear();
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(P1);gl.uniform2f(resLoc,W,H);gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,ibuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,data,0,n*7);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,n);
 }
 function put(i,x,y,sx,sy,rot,h,a){var o=i*7;data[o]=x;data[o+1]=y;data[o+2]=sx;data[o+3]=sy;data[o+4]=rot;data[o+5]=h;data[o+6]=a;}
 return{init:init,draw:draw,clear:clear,put:put,get canvas(){return c;}};
})();

function rnd(seed){return mulberry32(seed);}
function clamp01(v){return v<0?0:v>1?1:v;}
var ENG={};

ENG['Splat bloom']=function(sc){
 var N=Math.round(9000*sc),r=rnd(11),x=new Float32Array(N),y=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),SH=[[],[],[]],i,k;
 for(k=0;k<3;k++){SH[k]=[new Float32Array(N),new Float32Array(N)];}
 var radii=[35,70,105,140];
 for(i=0;i<N;i++){
  var th=r()*6.2832,rad=(40+110*Math.pow(r(),.55))*(.35+.65*Math.abs(Math.cos(4*th)));
  SH[0][0][i]=180+Math.cos(th)*rad;SH[0][1][i]=300+Math.sin(th)*rad*.9;
  if(r()<.2){var yy=480-r()*150;SH[1][0][i]=180+(r()-.5)*(12+(480-yy)*.05);SH[1][1][i]=yy;}
  else{var a2=r()*6.2832,r2=Math.sqrt(r())*130;SH[1][0][i]=180+Math.cos(a2)*r2*1.05;SH[1][1][i]=250+Math.sin(a2)*r2*.7;}
  var th3,rd3;if(r()<.3){th3=Math.floor(r()*12)*Math.PI/6+(r()-.5)*.03;rd3=r()*140;}else{th3=r()*6.2832;rd3=radii[Math.floor(r()*4)]+(r()-.5)*6;}
  SH[2][0][i]=180+Math.cos(th3)*rd3;SH[2][1][i]=300+Math.sin(th3)*rd3;
  x[i]=r()*360;y[i]=60+r()*460;
 }
 return{n:N,trail:0,step:function(dt,A){
  var s=Math.floor(Math.max(0,A.idx)/4)%3,T=SH[s],br=1+A.env*.1+A.semi/12*.06,damp=Math.max(0,1-3.2*dt);
  for(i=0;i<N;i++){
   var tx=180+(T[0][i]-180)*br,ty=300+(T[1][i]-300)*br;
   vx[i]+=((tx-x[i])*5+(Math.random()-.5)*60*(.3+A.env))*dt-(y[i]-300)*.12*A.env*dt;
   vy[i]+=((ty-y[i])*5+(Math.random()-.5)*60*(.3+A.env))*dt+(x[i]-180)*.12*A.env*dt;
   vx[i]*=damp;vy[i]*=damp;x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;
   var sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]),d=Math.sqrt((x[i]-180)*(x[i]-180)+(y[i]-300)*(y[i]-300));
   GLR.put(i,x[i],y[i],5.5*(1+sp*.012),5.5/(1+sp*.006),Math.atan2(vy[i],vx[i]),clamp01(.3+.4*A.env+.3*(1-d/150)),.1+.06*A.env);
  }}};
};

ENG['Sound sand']=function(sc){
 var N=Math.round(11000*sc),X=new Float32Array(N),Y=new Float32Array(N),i,M=[[1,2],[2,3],[1,3],[3,4],[2,5],[3,5],[4,5],[1,4]],PI=Math.PI;
 for(i=0;i<N;i++){X[i]=Math.random();Y[i]=Math.random();}
 return{n:N,trail:0,step:function(dt,A){
  var m=M[Math.min(7,Math.floor(A.semi/12*7.99))],n1=m[0],m1=m[1],kick=A.env*.9*dt;
  for(i=0;i<N;i++){
   var x=X[i],y=Y[i],a=Math.cos(n1*PI*x),b=Math.cos(m1*PI*y),c=Math.cos(m1*PI*x),d=Math.cos(n1*PI*y),f=a*b-c*d;
   var fx=-n1*PI*Math.sin(n1*PI*x)*b+m1*PI*Math.sin(m1*PI*x)*d,fy=-m1*PI*a*Math.sin(m1*PI*y)+n1*PI*c*Math.sin(n1*PI*y);
   var g2=fx*fx+fy*fy+.05,rt=Math.min(1,6*dt);x+=-f*fx/g2*rt+(Math.random()-.5)*kick;y+=-f*fy/g2*rt+(Math.random()-.5)*kick;
   if(x<0)x=-x;if(x>1)x=2-x;if(y<0)y=-y;if(y>1)y=2-y;
   X[i]=x;Y[i]=y;
   GLR.put(i,30+x*300,130+y*300,3.4,3.4,0,clamp01(.9-Math.min(1,Math.abs(f)*3)*.65),.3);
  }}};
};

ENG['Flow rivers']=function(sc){
 var N=Math.round(12000*sc),x=new Float32Array(N),y=new Float32Array(N),life=new Float32Array(N),i;
 for(i=0;i<N;i++){x[i]=Math.random()*360;y[i]=Math.random()*560;life[i]=Math.random()*5;}
 var a=.013,b=.017,cc=.031,dd=.022;
 return{n:N,trail:.16,step:function(dt,A){
  var t=A.t,ang=(A.semi/12)*Math.PI*.6-Math.PI*.3,bs=40+A.env*90,bx=Math.cos(ang)*bs,by=Math.sin(ang)*bs;
  for(i=0;i<N;i++){
   var px=x[i],py=y[i],s1=Math.sin(a*px+t*.3),c1=Math.cos(a*px+t*.3),s2=Math.sin(b*py-t*.21),c2=Math.cos(b*py-t*.21),c3=Math.cos(cc*px-dd*py+t*.4);
   var dpx=a*c1*c2+.5*cc*c3,dpy=-b*s1*s2-.5*dd*c3,u=dpy*5000+bx,v=-dpx*5000+by;
   x[i]=px+u*dt;y[i]=py+v*dt;life[i]-=dt;
   if(life[i]<0||x[i]<-10||x[i]>370||y[i]<-10||y[i]>570){x[i]=Math.random()*360;y[i]=Math.random()*560;life[i]=3+Math.random()*4;}
   var sp=Math.sqrt(u*u+v*v);
   GLR.put(i,x[i],y[i],2.5+sp*.04,2,Math.atan2(v,u),clamp01(.25+sp/420+.2*A.env),.12);
  }}};
};

ENG['Embers']=function(sc){
 var N=Math.round(9000*sc),x=new Float32Array(N),y=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),life=new Float32Array(N),ml=new Float32Array(N),ptr=0,carry=0,i;
 function spawn(n,spread,up){for(var k=0;k<n;k++){var j=ptr;ptr=(ptr+1)%N;x[j]=180+(Math.random()+Math.random()-1)*spread;y[j]=470+Math.random()*10;vx[j]=(Math.random()-.5)*40;vy[j]=-(30+Math.random()*60)*up;ml[j]=life[j]=1.2+Math.random()*2.2;}}
 for(i=0;i<N;i++){life[i]=0;ml[i]=1;y[i]=-50;}
 return{n:N,trail:.22,step:function(dt,A){
  var spread=25+A.semi/12*45,rate=N/2.6*(.3+A.env*1.5)+N*.04;carry+=rate*dt;var c=Math.floor(carry);carry-=c;spawn(c,spread,1);
  if(A.ons)spawn(Math.round(N*.05),spread*1.6,2.2);
  for(i=0;i<N;i++){
   if(life[i]<=0){GLR.put(i,-50,-50,.1,.1,0,0,0);continue;}
   var h=life[i]/ml[i];
   vy[i]-=(50+90*h)*dt;vx[i]+=Math.sin(y[i]*.03+A.t*3+i)*70*dt;vx[i]*=Math.max(0,1-1.2*dt);vy[i]*=Math.max(0,1-.5*dt);
   x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;life[i]-=dt;
   var sz=1.8+6*Math.sqrt(h);
   GLR.put(i,x[i],y[i],sz,sz*1.2,0,h*.9,.03+.15*h);
  }}};
};

ENG['Gravity orbits']=function(sc){
 var N=Math.round(7000*sc),x=new Float32Array(N),y=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),i,GM=4e5,AT=[],ai=0;
 for(i=0;i<6;i++)AT.push({x:0,y:0,m:0,l:0});
 for(i=0;i<N;i++){var r=40+Math.sqrt(Math.random())*150,a=Math.random()*6.2832,v=Math.sqrt(GM/r)*(.9+Math.random()*.2);x[i]=180+Math.cos(a)*r;y[i]=300+Math.sin(a)*r;vx[i]=-Math.sin(a)*v;vy[i]=Math.cos(a)*v;}
 return{n:N+7,trail:.14,step:function(dt,A){
  if(A.ons){var at=AT[ai++%6];at.x=40+((Math.max(0,A.idx)%8)/7)*280;at.y=480-A.semi/12*360;at.m=3e5;at.l=3;}
  AT.forEach(function(at){at.l=Math.max(0,at.l-dt);});
  for(i=0;i<N;i++){
   var dx=180-x[i],dy=300-y[i],d2=dx*dx+dy*dy+400,inv=GM/(d2*Math.sqrt(d2)),ax=dx*inv,ay=dy*inv;
   for(var k=0;k<6;k++){var a=AT[k];if(a.l>0){var ex=a.x-x[i],ey=a.y-y[i],e2=ex*ex+ey*ey+900,iv=a.m*(a.l/3)/(e2*Math.sqrt(e2));ax+=ex*iv;ay+=ey*iv;}}
   vx[i]+=ax*dt;vy[i]+=ay*dt;x[i]+=vx[i]*dt;y[i]+=vy[i]*dt;
   if(x[i]<0||x[i]>360||y[i]<0||y[i]>560){var r2=60+Math.random()*120,a2=Math.random()*6.2832,v2=Math.sqrt(GM/r2);x[i]=180+Math.cos(a2)*r2;y[i]=300+Math.sin(a2)*r2;vx[i]=-Math.sin(a2)*v2;vy[i]=Math.cos(a2)*v2;}
   var sp=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]);
   GLR.put(i,x[i],y[i],2+sp*.03,2,Math.atan2(vy[i],vx[i]),clamp01(sp/170),.24);
  }
  GLR.put(N,180,300,26+A.env*14,26+A.env*14,0,.7,.2);
  for(var j=0;j<6;j++){var q=AT[j];GLR.put(N+1+j,q.x,q.y,q.l>0?10+q.l*6:.1,q.l>0?10+q.l*6:.1,0,.9,q.l>0?.35*(q.l/3):0);}
 }};
};

function ss(a,b,v){var t=clamp01((v-a)/(b-a));return t*t*(3-2*t);}
ENG['Mirror city']=function(sc){
 var NC=Math.round(5600*sc),N=NC*2+2,HZ=318,r=rnd(7),i;
 var BL=[{k:'shik',cx:180,w:66,h:182},{k:'shik',cx:122,w:34,h:106},{k:'shik',cx:238,w:34,h:106},
  {k:'dome',x0:62,x1:98,h:60,r:18},{k:'dome',x0:262,x1:298,h:60,r:18},
  {k:'rect',x0:12,x1:46,h:74},{k:'rect',x0:40,x1:64,h:100},{k:'rect',x0:96,x1:110,h:52},{k:'rect',x0:146,x1:214,h:44},
  {k:'rect',x0:250,x1:264,h:52},{k:'rect',x0:296,x1:322,h:96},{k:'rect',x0:318,x1:348,h:66}];
 function inside(x,y){var best=0;for(var k=0;k<BL.length;k++){var b=BL[k],v=0;
  if(b.k==='rect'){if(x>=b.x0&&x<=b.x1&&y>=HZ-b.h&&y<=HZ){var lx=(x-b.x0)%9,ly=(HZ-y)%11;v=(lx>3&&lx<7&&ly>4&&ly<9&&x-b.x0>3&&b.x1-x>3&&HZ-y>8&&HZ-y<b.h-6)?2:1;}}
  else if(b.k==='dome'){var cx=(b.x0+b.x1)/2,cy=HZ-b.h;if(x>=b.x0&&x<=b.x1&&y>=cy&&y<=HZ)v=1;else if(y<cy&&(x-cx)*(x-cx)+(y-cy)*(y-cy)<=b.r*b.r)v=1;else if(Math.abs(x-cx)<1.6&&y<cy-b.r&&y>=cy-b.r-12)v=2;}
  else{var s2=(HZ-y)/b.h;if(s2>=0&&s2<=1){var half=b.w/2*(1-Math.pow(s2,1.7))*(1+.07*Math.sin(s2*44));if(Math.abs(x-b.cx)<=half)v=(Math.abs(x-b.cx)<1.5&&s2>.15)?2:1;}

const INSTS=Object.keys(INST);
function rhythm(ac,out,base,t0,B,tone,nb){if(tone!=='Rock'&&tone!=='Lo-fi')return;const beats=Math.floor(B.total/B.beat);
 for(let b=0;b<beats;b++){const t=t0+b*B.beat,bar=b%4;
  if(tone==='Rock'){if(bar===0||bar===2)kick(ac,out,t,.5);if(bar===1||bar===3)hiss(ac,out,t,.14,'highpass',1500,.25,nb);hiss(ac,out,t,.04,'highpass',7000,.08,nb);hiss(ac,out,t+B.beat/2,.04,'highpass',7000,.06,nb);}
  else if(tone==='Classical'){pluck(ac,out,base*Math.pow(2,[-5,0,0,-12][bar]/12),t,2,.1,'triangle');if(bar===0)hiss(ac,out,t,.05,'bandpass',900,.1,nb);}
  else if(tone==='Lo-fi'){if(bar===0||bar===2)kick(ac,out,t,.3);if(bar===1||bar===3)hiss(ac,out,t,.12,'lowpass',2200,.18,nb);hiss(ac,out,t+B.beat/2,.03,'highpass',8000,.05,nb);}
  else[0,7,12].forEach((s,k)=>pluck(ac,out,base*2*Math.pow(2,s/12),t+k*.02,.7,bar===0?.08:.05,'triangle'));}}

const INS_IDS=['sitar','veena','bansuri','violin','harmonium','piano','guitar','santoor','sarangi','nadaswaram','harp','cello'],STEMS=['drone_tanpura','rhythm_tabla','rhythm_mridangam'];
AUD.st={};AUD.dec=null;

AUD.need=function(n){n=n||1;if(AUD.st['v'+n])return;AUD.st['v'+n]=1;const keys=STEMS.map(id=>[id,'/audio/'+id+'.m4a']).concat(INS_IDS.map(id=>[n+'/'+id,n===1?'/audio/'+id+'.m4a':'/audio/v'+n+'/'+id+'.m4a']));
 let left=keys.length;keys.forEach(k=>AUD.load(k[0],k[1],()=>{if(--left===0){AUD.st['v'+n]=2;AUD.ready=true;onAudioReady(n);}}));};

 if(S.view==='feed'){const el=reelNode(S.idx);if(el&&!el.querySelector('.endcard'))startReel(el);}else if(S.view==='create')startPreview();else if(S.view==='review')startReview();}

/* ---------- sing: Yousician-style practice ---------- */

const PITCH_TOL=50,NOTE_HIT=.5,PASS_MARK=80;
const PHRASES=[];[1,2,3,4].forEach(l=>{const ks=SN.map((n,k)=>k).filter(k=>SN[k].line===l);PHRASES.push({line:l,part:1,ks:ks.slice(0,12)},{line:l,part:2,ks:ks.slice(12)});});
function setSingVerse(n){n=n||1;SV=n;const T=TT[n-1];SN=T.notes;SPB=60/T.bpm;SONG=T.total*SPB;AUD.need(n);const V=TATTVAS[n-1],h=$('#sg-title');if(h)h.textContent='Sing · Tattva '+n;}
const G={st:'idle',ac:null,stream:null,an:null,buf:null,mr:null,chunks:[],t0:0,recStart:0,frames:[],res:[],raf:0,guideSrc:[],guide:'sitar',drone:true,anyKey:false,keyOff:0,keyLocked:true,lat:.08,streak:0,best:0,only:null,parts:[],pops:[],count:0};

  if(!dv.length)continue;const on=dv.filter(x=>Math.abs(x)<=PITCH_TOL).length/dv.length;if(on>best.on||best.med===null){dv.sort((x,y)=>x-y);best={on,med:dv[dv.length>>1]};}}

function totals(res){const w=SN.map(n=>n.dur);let sw=0,on=0,hit=0,nh=0;res.forEach((r,k)=>{if(!r)return;sw+=w[k];on+=w[k]*r.on;hit+=w[k]*(r.hit?1:0);nh+=r.hit?1:0;});return{score:sw?Math.round(100*(.5*on+.5*hit)/sw):0,hits:nh,judged:res.filter(Boolean).length};}

function paintHUD(){const t=totals(G.res);$('#sg-score').textContent=t.score;$('#sg-streak').textContent=G.streak;$('#sg-hits').textContent=t.hits+'/'+SN.length;}

let LG=null;
function laneCtx(){const c=$('#c-sing'),w=c.clientWidth,h=c.clientHeight;if(!LG||LG.w!==w||LG.h!==h){const d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);LG={g,w,h};}return LG;}
const LO=-4,HI=15;

 for(let b=Math.ceil((t-nowX/pps)/SPB);b*SPB<t+(w-nowX)/pps;b++){const x=nowX+(b*SPB-t)*pps;if(x<30)continue;g.fillStyle=b%4?'rgba(246,235,210,.04)':'rgba(246,235,210,.09)';g.fillRect(x,0,1,h);}
 SN.forEach((n,k)=>{if(G.only&&!G.only.includes(k))return;const s=n.beat*SPB,e=s+n.dur*SPB,x0=nowX+(s-t)*pps,x1=nowX+(e-t)*pps-3;if(x1<30||x0>w)return;const y=yC(n.semi*100),r=G.res[k],act=t>=s&&t<e;
  g.fillStyle=r?(r.hit?'#7FD1A6':'rgba(255,142,132,.75)'):(act?'#FFF4D6':(e<t?'rgba(246,213,142,.35)':'#F6D58E'));
  const xa=Math.max(30,x0),hh=rowH*.86;g.beginPath();if(g.roundRect)g.roundRect(xa,y-hh/2,Math.max(4,x1-xa),hh,hh/2);else g.rect(xa,y-hh/2,Math.max(4,x1-xa),hh);g.fill();
  if(x1-xa>22){g.fillStyle='#1A1206';g.font='15px "Tiro Devanagari Sanskrit",serif';g.textBaseline='middle';g.fillText(n.dev,xa+7,y+1);}});
 // singer's pitch trail, folded to the octave of the nearest note
 let last=null;g.lineWidth=3;g.lineCap='round';
 for(let i=Math.max(0,G.frames.length-400);i<G.frames.length;i++){const f=G.frames[i],x=nowX+(f.t-t)*pps;if(x<30||isNaN(f.c)){last=null;continue;}
  const k=Math.max(0,curNote(f.t)),tgt=SN[k].semi*100+G.keyOff,c=tgt+circ(f.c-tgt)-G.keyOff,y=yC(c),on=Math.abs(circ(f.c-G.keyOff-SN[k].semi*100))<=PITCH_TOL;
  if(last){g.strokeStyle=on?'#FFE6A8':'rgba(255,142,132,.9)';g.beginPath();g.moveTo(last.x,last.y);g.lineTo(x,y);g.stroke();}last={x,y,on};}
 g.fillStyle='rgba(246,235,210,.9)';g.fillRect(nowX-1,0,2,h);
 if(last&&G.st==='run'){g.fillStyle=last.on?'#FFE6A8':'#FF8E84';g.beginPath();g.arc(last.x,last.y,7,0,7);g.fill();g.fillStyle=last.on?'rgba(255,230,168,.25)':'rgba(255,142,132,.2)';g.beginPath();g.arc(last.x,last.y,16,0,7);g.fill();}

async function singStart(){if(G.st==='run'||G.st==='count'){singFinish();return;}

 try{G.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});}catch(e){singNoMic();return;}

 const m=ac.createGain();m.gain.value=.9;m.connect(ac.destination);
 const lay=(id,gain)=>{const b=AUD.buf[id];if(!b)return;const s=ac.createBufferSource(),gg=ac.createGain();gg.gain.value=gain;s.buffer=b;s.connect(gg);gg.connect(m);s.start(G.t0+from,from,to-from+.3);G.guideSrc.push(s);};
 lay(SV+'/'+G.guide,.8);if(G.drone)lay('drone_tanpura',.35);
 G.st=lead?'count':'run';$('#sg-go').className='sg-go live';$('#sg-go').innerHTML='<span>Stop</span>';$('#sg-tip').hidden=true;
 const W=1024,ds=new Float32Array(W),sr=ac.sampleRate/2;
 const loop=()=>{const t=ac.currentTime-G.t0;
  if(G.st==='count'){const n=Math.ceil(G.t0+from-ac.currentTime),cnt=$('#sg-count');if(n<=0){cnt.hidden=true;G.st='run';}else if(n<=3){cnt.hidden=false;if(cnt.textContent!==String(n)){cnt.textContent=n;cnt.style.animation='none';void cnt.offsetWidth;cnt.style.animation='';}}}
  if(G.st==='run'||G.st==='count'){G.an.getFloatTimeDomainData(G.buf);for(let i=0;i<W;i++)ds[i]=(G.buf[2*i]+G.buf[2*i+1])*.5;const c=yinF(ds,sr);G.frames.push({t:t-G.lat-.021,c});
   if(G.anyKey&&!G.keyLocked){const ks=(G.only||SN.map((n,k)=>k)).slice(0,4),lastK=ks[ks.length-1],e=SN[lastK].beat*SPB+SN[lastK].dur*SPB;if(t>e+.4){G.keyOff=keyFrom(G.frames,ks);G.keyLocked=true;toast('Your Sa is set. Keep going');}}
   if(G.keyLocked)SN.forEach((n,k)=>{if(G.res[k]||(G.only&&!G.only.includes(k)))return;const e=n.beat*SPB+n.dur*SPB;if(t>e+.4){const r=judge(k,G.frames,G.keyOff);G.res[k]=r;
    if(r.hit){G.streak++;G.best=Math.max(G.best,G.streak);}else G.streak=0;
    G.pops.push({t,c:n.semi*100,txt:r.on>=.8?'Perfect':r.hit?'Good':'Miss',col:r.on>=.8?'#FFE6A8':r.hit?'#7FD1A6':'#FF8E84',hit:r.hit});paintHUD();}});
   if(t>G.end){singFinish();return;}}
  singDraw(t);G.raf=requestAnimationFrame(loop);};

function singStop(silent){cancelAnimationFrame(G.raf);G.guideSrc.forEach(s=>{try{s.stop();}catch(e){}});G.guideSrc=[];
 if(G.mr&&G.mr.state==='recording'){G.mr.onstop=null;try{G.mr.stop();}catch(e){}}G.mr=silent?null:G.mr;

/* ---------- offline check: same rules as tune_check.py ---------- */
async function to16k(buf){const n=Math.ceil(buf.duration*16000),oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,n,16000),s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();const r=await oc.startRendering();return r.getChannelData(0);}
function trackOff(x,sr,hop){const W=400,out=[];for(let i=0;i+W*2<x.length;i+=Math.round(hop*sr))out.push({t:out.length*hop,c:yinF(x.subarray(i,i+W*2),sr)});return out;}
function dtwOff(u,r,off){const n=u.length,m=r.length,INF=1e18;let prev=new Float64Array(m+1).fill(INF);prev[0]=0;const back=new Uint8Array((n+1)*(m+1));
 for(let i=1;i<=n;i++){const curR=new Float64Array(m+1).fill(INF);const lo=Math.max(1,Math.floor(i*m/n-.5*m)),hi=Math.min(m,Math.ceil(i*m/n+.5*m));

function snapshot(R){return Object.values(R.players).map(p=>({pid:p.pid,name:p.name,score:p.score,streak:p.streak,delta:p.delta,ok:p.ok}));}
function broadcastState(force){const R=GS.live;if(!R||!R.host||R.solo)return;announce(R);const now=Date.now();if(!force&&now-R.lastState<300)return;R.lastState=now;
 send({e:'state',seq:++R.stateSeq,g:R.g,phase:R.phase,qi:R.qi,rem:Math.max(0,R.deadline-now),players:snapshot(R),prog:R.prog,over:R.over||null});}
function tick(R){if(GS.live!==R)return;const now=Date.now();
 if(R.host){if(R.phase==='q'&&now>=R.deadline)reveal(R);else if(R.phase==='reveal'&&now>=R.nextAt)nextQ(R);else if(R.phase==='race'&&now>=R.deadline)endRace(R);
  if(now-R.lastState>2000)broadcastState(true);}
 paintTimer();}
function hostBegin(){const R=GS.live;if(!R||!R.host)return;Object.values(R.players).forEach(p=>{p.score=0;p.streak=0;p.delta=0;p.ok=null;});R.prog={};R.over=null;
 if(!R.solo&&R.g)API('/api/games',{method:'POST',body:JSON.stringify({played:R.g.id})}).catch(()=>{});
 if(R.g.type==='quiz'){R.qi=-1;nextQ(R);}else{R.phase='race';R.pz=null;R.deadline=Date.now()+(R.g.settings.lines===2?75:140)*1000;broadcastState(true);paintPlay(true);}
 if(R.solo&&!R.t)R.t=setInterval(()=>tick(R),200);}
function nextQ(R){R.qi++;if(R.qi>=R.qs.length){R.phase='done';broadcastState(true);paintPlay(true);return;}R.phase='q';R.answers={};R.my={c:null};R.deadline=Date.now()+R.g.settings.secs*1000;Object.values(R.players).forEach(p=>{p.delta=0;p.ok=null;});broadcastState(true);paintPlay(true);}
function maybeReveal(R){const ids=Object.keys(R.players).filter(id=>R.solo||R.online[id]||id===GS.me);if(ids.every(id=>R.answers[id]))reveal(R);}
function reveal(R){if(R.phase!=='q')return;const q=R.qs[R.qi],T=R.g.settings.secs*1000;
 Object.values(R.players).forEach(p=>{const a=R.answers[p.pid];if(a&&a.c===q.ans){p.streak++;p.delta=Math.round(500+500*Math.max(0,1-a.ms/T))+(p.streak>=3?100:0);p.score+=p.delta;p.ok=true;}else{p.streak=0;p.delta=0;p.ok=a?false:null;}});
 R.phase='reveal';R.nextAt=Date.now()+4200;broadcastState(true);paintPlay(true);}
function answer(c){const R=GS.live;if(!R||R.phase!=='q'||R.my.c!=null)return;const ms=R.g.settings.secs*1000-Math.max(0,R.deadline-Date.now());R.my={c,ms};
 if(R.host){R.answers[GS.me]={c,ms};maybeReveal(R);}else send({e:'ans',pid:GS.me,qi:R.qi,c,ms});paintPlay();}
function maybeEndRace(R){const ids=Object.keys(R.players).filter(id=>R.solo||R.online[id]||id===GS.me);if(ids.length&&ids.every(id=>R.prog[id]&&R.prog[id].done))endRace(R);}
function endRace(R){if(R.phase!=='race')return;const L=R.lines.length;
 const rank=Object.values(R.players).map(p=>({p,pr:R.prog[p.pid]||{line:0,ms:1e9}})).sort((a,b)=>b.pr.line-a.pr.line||a.pr.ms-b.pr.ms);
 rank.forEach((x,i)=>{x.p.delta=x.pr.line*150+(x.pr.line>=L?Math.max(0,1000-i*200):0);x.p.score=x.p.delta;});R.phase='done';broadcastState(true);paintPlay(true);}
function sendProg(){const R=GS.live,pz=R.pz;const pr={line:pz.line,done:pz.line>=R.lines.length,ms:Date.now()-pz.t0+pz.pen};
 if(R.host){R.prog[GS.me]=pr;broadcastState();maybeEndRace(R);}else send(Object.assign({e:'prog',pid:GS.me},pr));}

/* ---------- play screen ---------- */
function ranked(R){return Object.values(R.players).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));}
function paintTimer(){const R=GS.live,el=$('#pl-timer');if(!R||!el)return;const on=R.phase==='q'||R.phase==='race';el.hidden=!on;if(!on)return;
 const tot=R.phase==='q'?R.g.settings.secs*1000:(R.g.settings.lines===2?75:140)*1000,rem=Math.max(0,R.deadline-Date.now());el.querySelector('b').textContent=Math.ceil(rem/1000);el.style.setProperty('--p',(rem/tot).toFixed(3));}
function paintPlay(anim){const R=GS.live,box=$('#pl-body');if(!R||!box)return;const g=R.g,th=g?THEMES[g.settings.theme]:THEMES.Gold;
 $('#v-play').style.setProperty('--th',th[1]);$('#v-play').style.setProperty('--thb',th[0]);
 $('#pl-title').textContent=g?g.title:'Joining…';$('#pl-code').hidden=R.solo||!R.code;$('#pl-code').innerHTML='<span>Code</span><b>'+esc(R.code||'')+'</b>';
 if(R.err){box.innerHTML='<div class="pl-card"><p class="note">'+esc(R.err)+'</p><button class="btn gold" id="pl-x2">Back to games</button></div>';$('#pl-x2').onclick=()=>{closeRoom();showView('games');};return;}
 if(!g){box.innerHTML='<div class="pl-card pl-wait"><span class="spin"></span><p class="note">Waiting for the host…</p></div>';return;}
 const n=Object.keys(R.players).length;
 if(R.phase==='lobby'){const url=location.origin+'/#join-'+R.code;
  box.innerHTML='<div class="pl-card"><p class="eyebrow">'+esc(GTYPES[g.type].name)+' · Tattva '+g.tattva+'</p><h2 class="sh-title">'+esc(TATTVAS[g.tattva-1].name)+'</h2>'+
   (R.host?'<p class="note">Friends open Tattva Reels, tap <b>Games → Join</b> and type the code. Or send them the link.</p><div class="bigcode">'+esc(R.code)+'</div><button class="btn line" id="pl-share">'+ico('share')+'Share join link</button>':'<p class="note">You’re in. The host will start the game.</p>')+
   '<p class="lab">Players · '+n+'</p><div class="pl-players">'+Object.values(R.players).map(p=>'<span class="pchip'+(p.pid===GS.me?' me':'')+'">'+esc(p.name)+'</span>').join('')+'</div>'+
   (R.host?'<button class="btn gold" id="pl-start">'+(n<2?'Start (you can play alone)':'Start game')+'</button>':'<div class="pl-wait"><span class="spin"></span></div>')+'</div>';
  if(R.host){$('#pl-start').onclick=hostBegin;$('#pl-share').onclick=()=>{if(navigator.share)navigator.share({title:g.title,text:'Join my Tattva game. Code '+R.code,url}).catch(()=>{});else{try{navigator.clipboard.writeText(url);toast('Join link copied');}catch(e){toast(url);}}};}
  return;}
 if(g.type==='quiz'&&(R.phase==='q'||R.phase==='reveal')){const q=R.qs[R.qi],rv=R.phase==='reveal',me=R.players[GS.me]||{};
  const cols=['c0','c1','c2','c3'],sh=['◆','●','▲','■'];
  box.innerHTML='<div class="qhead"><span class="lab">Question '+(R.qi+1)+' of '+R.qs.length+'</span><span class="lab">'+(R.phase==='q'?Object.keys(R.answers||{}).length&&R.host?Object.keys(R.answers).length+' of '+n+' answered':'':'')+'</span></div>'+
   '<h2 class="qtext">'+esc(q.q)+'</h2>'+(q.line?'<p class="qline">'+esc(q.line)+'</p>':'')+
   '<div class="opts'+(q.sm?' small':'')+'">'+q.opts.map((o,i)=>{const cls=['opt',cols[i]];if(R.my.c===i)cls.push('picked');if(rv){cls.push(i===q.ans?'right':'dim');}return '<button class="'+cls.join(' ')+'" data-i="'+i+'"'+(R.my.c!=null||rv?' disabled':'')+'><span class="sh">'+sh[i]+'</span><span class="ot'+(q.it?' it':'')+(q.dv?' dv':'')+'">'+esc(o)+'</span></button>';}).join('')+'</div>'+
   (rv?'<div class="rv '+(me.ok?'ok':'no')+'">'+(me.ok?ico('check')+'<b>+'+me.delta+'</b>'+(me.streak>=3?'<span>streak '+me.streak+'</span>':''):me.ok===false?'<b>Not this time</b>':'<b>Time’s up</b>')+'</div>'+miniBoard(R):R.my.c!=null?'<p class="note pl-wait"><span class="spin"></span> Locked in. Waiting for the others…</p>':'');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));if(anim)box.classList.remove('pop'),void box.offsetWidth,box.classList.add('pop');return;}
 if(g.type==='puzzle'&&R.phase==='race'){if(!R.pz)R.pz={line:0,pos:0,t0:Date.now(),pen:0,used:{}};const key='pz'+R.pz.line+'.'+R.pz.pos;if(!anim&&box.dataset.k===key&&box.querySelector('.race')){box.querySelector('.race').innerHTML=raceRows(R);return;}box.dataset.k=key;paintPuzzle(R,box);return;}
 box.dataset.k='';
 if(R.phase==='done'){const rk=ranked(R),podium=rk.slice(0,3);
  box.innerHTML='<div class="pl-card"><p class="eyebrow">Final scores</p><div class="podium">'+[1,0,2].filter(i=>podium[i]).map(i=>'<div class="pod p'+(i+1)+'"><span class="pn">'+esc(podium[i].name)+'</span><span class="ps">'+fmt(podium[i].score)+'</span><i>'+(i+1)+'</i></div>').join('')+'</div>'+
   '<div class="board">'+rk.map((p,i)=>'<div class="brow'+(p.pid===GS.me?' me':'')+'"><span class="rk">'+(i+1)+'</span><span class="bn">'+esc(p.name)+'</span><b>'+fmt(p.score)+'</b></div>').join('')+'</div>'+
   '<p class="note">'+esc(TATTVAS[g.tattva-1].teach)+'</p>'+
   (R.host?'<div class="row2"><button class="btn line" id="pl-again">'+ico('replay')+'Play again</button><button class="btn gold" id="pl-done">Done</button></div>':'<button class="btn gold" id="pl-done">Done</button>')+'</div>';
  if(R.host)$('#pl-again').onclick=()=>{R.phase='lobby';R.qi=-1;Object.values(R.players).forEach(p=>{p.score=0;p.delta=0;p.ok=null;p.streak=0;});if(R.solo){hostBegin();}else{broadcastState(true);paintPlay();}};
  $('#pl-done').onclick=()=>{closeRoom();showView('games');};return;}
 box.innerHTML='<div class="pl-card pl-wait"><span class="spin"></span></div>';}
function miniBoard(R){return '<div class="board mini">'+ranked(R).slice(0,5).map((p,i)=>'<div class="brow'+(p.pid===GS.me?' me':'')+'"><span class="rk">'+(i+1)+'</span><span class="bn">'+esc(p.name)+'</span>'+(p.delta?'<span class="dl">+'+p.delta+'</span>':'')+'<b>'+fmt(p.score)+'</b></div>').join('')+'</div>';}
function raceRows(R){const pz=R.pz,L=R.lines;return Object.values(R.players).map(p=>{const pr=p.pid===GS.me?{line:pz.line,done:pz.line>=L.length}:(R.prog[p.pid]||{line:0});return '<div class="prow'+(p.pid===GS.me?' me':'')+'"><span class="bn">'+esc(p.name)+'</span><i><b style="width:'+Math.round(100*pr.line/L.length)+'%"></b></i>'+(pr.done?ico('check'):'<span class="lab">'+pr.line+'/'+L.length+'</span>')+'</div>';}).join('');}
function paintPuzzle(R,box){const pz=R.pz,L=R.lines,g=R.g,others=raceRows(R);box.dataset.k='pz'+pz.line+'.'+pz.pos;
 if(pz.line>=L.length){box.innerHTML='<div class="pl-card"><p class="eyebrow">All lines in place</p><div class="shloka">'+L.map(l=>'<div class="ln"><span class="dev">'+esc(l.dev)+'</span></div>').join('')+'</div><p class="lab">Race</p><div class="race">'+others+'</div><p class="note pl-wait"><span class="spin"></span> Waiting for the others…</p></div>';return;}
 const ln=L[pz.line];
 box.innerHTML='<div class="qhead"><span class="lab">Line '+(pz.line+1)+' of '+L.length+'</span></div>'+
  (g.settings.hard?'':'<p class="qhint">'+esc(ln.en)+'</p>')+
  '<div class="built">'+ln.tiles.slice(0,pz.pos).map(t=>'<span class="bt">'+esc(t)+'</span>').join('')+'<span class="caret"></span></div>'+
  '<div class="tiles">'+ln.deck.map((d,k)=>'<button class="tile'+(pz.used[k]?' used':'')+'" data-k="'+k+'"'+(pz.used[k]?' disabled':'')+'>'+esc(d.t)+'</button>').join('')+'</div>'+
  '<p class="lab">Race</p><div class="race">'+others+'</div>';
 box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,d=ln.deck[k];
  if(d.t===ln.tiles[pz.pos]){pz.used[k]=1;pz.pos++;
   if(pz.pos>=ln.tiles.length){pz.line++;pz.pos=0;pz.used={};toast(pz.line>=L.length?'Done!':'Line '+pz.line+' in place');sendProg();if(GS.live!==R||R.phase!=='race')return;}
   paintPuzzle(R,box);}
  else{pz.pen+=2000;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');if(navigator.vibrate)navigator.vibrate(60);}});}

/* ---------- games feed ---------- */
const gamesEl=$('#games');
async function loadGames(){
 try{const j=await API('/api/games');GS.local=false;GS.games=(j.games||[]).map(cleanGame).filter(Boolean);}
 catch(e){GS.local=true;GS.games=LS.get('tr-games',[]).map(cleanGame).filter(Boolean);}
 GS.loaded=true;renderGames();}
function renderGames(){gamesEl.innerHTML='';setTimeout(paintLive,0);
 if(!GS.games.length){const el=document.createElement('div');el.className='gcard gempty';
  el.innerHTML='<canvas></canvas><div class="shade"></div><div class="emptybox"><p class="eyebrow">Games</p><h2 class="sh-title">'+(GS.loaded?'No games yet':'Loading games…')+'</h2><p class="note">'+(GS.loaded?'Make a quiz or a puzzle race on any tattva, then play it live with friends.':'')+'</p>'+(GS.loaded?'<button class="btn gold" id="ge-make">'+ico('plus')+'Make a game</button>':'')+'</div>';
  gamesEl.appendChild(el);queuePoster(el.querySelector('canvas'),DEF(),0);const b=el.querySelector('#ge-make');if(b)b.onclick=()=>openMake();return;}
 GS.games.forEach(g=>{const V=TATTVAS[g.tattva-1],th=THEMES[g.settings.theme],el=document.createElement('article');el.className='gcard';el.id='g-'+g.id;el.style.setProperty('--th',th[1]);
  el.innerHTML='<canvas></canvas><div class="shade"></div><div class="gtint"></div>'+
   '<div class="gcap"><span class="gtype">'+ico(GTYPES[g.type].icon)+esc(GTYPES[g.type].name)+'</span><h2 class="gtitle"></h2>'+
   '<p class="gsub">Tattva '+g.tattva+' · '+esc(V.name)+'</p><p class="note gmeta"></p>'+
   '<div class="glive" hidden></div><div class="row2"><button class="btn line g-solo">'+ico('replay')+'Play solo</button><button class="btn gold g-host">'+ico('share')+'Host live</button></div></div>';
  el.querySelector('.gtitle').textContent=g.title;
  el.querySelector('.gmeta').textContent='by '+g.name+' · '+(g.type==='quiz'?g.settings.count+' questions · '+g.settings.secs+'s each':g.settings.lines+' lines'+(g.settings.hard?' · hard':''))+(g.plays?' · played '+fmt(g.plays)+'×':'');
  el.querySelector('.g-solo').onclick=()=>startRoom({g,solo:true,name:myName()||'you'});
  el.querySelector('.g-host').onclick=()=>askName(name=>startRoom({g,host:true,code:newCode(),name}));
  gamesEl.appendChild(el);if(gposter)gposter.observe(el);else queuePoster(el.querySelector('canvas'),{Tattva:g.tattva,Visuals:'Tattva film',Sound:['sitar'],Tone:'None',Recitation:'None'},0);});}
const gposter=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){gposter.unobserve(e.target);const g=GS.games.find(x=>'g-'+x.id===e.target.id);if(g)queuePoster(e.target.querySelector('canvas'),norm({Tattva:g.tattva}),0);}}),{root:gamesEl,rootMargin:'100% 0px'}):null;
function askName(cb){const cur=myName();if(cur){cb(cur);return;}
 openSheet('gname','<div class="shead"><div><h2 class="sh-title">Your player name</h2><p class="note">Shown to the others in the game.</p></div><button class="icon-btn glass" id="sh-x" aria-label="Close">'+ico('x')+'</button></div><input class="field" id="gn-in" maxlength="20" placeholder="e.g. Laksh" autocomplete="nickname"><p class="err" id="gn-err"></p><button class="btn gold" id="gn-go">Continue</button>');
 const inp=$('#gn-in');setTimeout(()=>inp.focus(),300);$('#sh-x').onclick=closeSheet;
 const go=()=>{const v=inp.value.replace(/[^\w .-]/g,'').trim().slice(0,20);if(!v){$('#gn-err').textContent='Type a name.';return;}LS.set('tr-gname',v);closeSheet();cb(v);};
 $('#gn-go').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};}
function openJoin(pre){openSheet('join','<div class="shead"><div><h2 class="sh-title">Join a game</h2><p class="note">Type the 6-letter code from the host’s screen.</p></div><button class="icon-btn glass" id="sh-x" aria-label="Close">'+ico('x')+'</button></div>'+
 '<input class="field codein" id="jn-code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123" value="'+esc(pre||'')+'">'+(myName()?'':'<input class="field" id="jn-name" maxlength="20" placeholder="Your name" autocomplete="nickname">')+'<p class="err" id="jn-err"></p><button class="btn gold" id="jn-go">Join</button>');
 const ci=$('#jn-code');setTimeout(()=>ci.focus(),300);$('#sh-x').onclick=closeSheet;ci.oninput=()=>{ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,'');$('#jn-err').textContent='';};
 const go=()=>{const c=ci.value.toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c)){$('#jn-err').textContent='Codes have 6 letters and numbers.';return;}
  let name=myName();const ni=$('#jn-name');if(!name){name=(ni.value||'').replace(/[^\w .-]/g,'').trim().slice(0,20);if(!name){$('#jn-err').textContent='Add your name.';return;}LS.set('tr-gname',name);}
  closeSheet();startRoom({code:c,name});};
 $('#jn-go').onclick=go;ci.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};}

/* ---------- make a game ---------- */
const GM={type:'quiz',tattva:1,count:8,secs:15,lines:4,hard:false,theme:'Gold',title:''};
function openMake(){showView('gmake');paintMake();}
function paintMake(){const b=$('#gm-body'),V=TATTVAS[GM.tattva-1];
 const chip=(k,v,lab,on)=>'<button class="chip'+(on?' on':'')+'" data-k="'+k+'" data-v="'+esc(String(v))+'">'+esc(lab)+'</button>';
 b.innerHTML='<p class="lab">Game type</p><div class="gtypes">'+Object.keys(GTYPES).map(k=>'<button class="gtcard'+(GM.type===k?' on':'')+'" data-k="type" data-v="'+k+'">'+ico(GTYPES[k].icon)+'<b>'+GTYPES[k].name+'</b><span>'+GTYPES[k].blurb+'</span></button>').join('')+'</div>'+
  '<p class="lab">Tattva</p><div class="chips">'+TATTVAS.map(t=>chip('tattva',t.n,t.n+' · '+t.name,GM.tattva===t.n)).join('')+'</div><p class="note">'+esc(V.teach)+'</p>'+
  (GM.type==='quiz'?'<p class="lab">Questions</p><div class="chips">'+[5,8,10].map(n=>chip('count',n,n+' questions',GM.count===n)).join('')+'</div><p class="lab">Time per question</p><div class="chips">'+[10,15,20].map(n=>chip('secs',n,n+' seconds',GM.secs===n)).join('')+'</div>'
   :'<p class="lab">Lines</p><div class="chips">'+chip('lines',2,'First 2 lines',GM.lines===2)+chip('lines',4,'Whole verse',GM.lines===4)+'</div><p class="lab">Difficulty</p><div class="chips">'+chip('hard',0,'Easy · meaning shown',!GM.hard)+chip('hard',1,'Hard · extra tiles, no hints',GM.hard)+'</div>')+
  '<p class="lab">Look</p><div class="chips">'+Object.keys(THEMES).map(k=>'<button class="chip th'+(GM.theme===k?' on':'')+'" data-k="theme" data-v="'+k+'" style="--th:'+THEMES[k][1]+'"><i></i>'+k+'</button>').join('')+'</div>'+
  '<label class="lab" for="gm-title">Title</label><input class="field" id="gm-title" maxlength="60" placeholder="Tattva '+GM.tattva+(GM.type==='quiz'?' quiz':' puzzle race')+'" value="'+esc(GM.title)+'">'+
  '<div class="row2"><button class="btn line" id="gm-try">'+ico('replay')+'Try it</button><button class="btn gold" id="gm-pub">Publish</button></div><p class="note">Publishing adds it to the Games feed. Anyone can play it solo or host it live with a join code.</p>';
 b.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{const k=el.dataset.k,v=el.dataset.v;GM.title=$('#gm-title').value;GM[k]=k==='type'||k==='theme'?v:k==='hard'?v==='1':+v;paintMake();});
 $('#gm-title').oninput=e=>GM.title=e.target.value;
 $('#gm-try').onclick=()=>startRoom({g:draftGame(),solo:true,name:myName()||'you'});
 $('#gm-pub').onclick=()=>{if(S.user)publishGame();else openSignin(publishGame);};}
function draftGame(){return cleanGame({id:'gdraft000',name:myName()||'you',title:GM.title.trim()||('Tattva '+GM.tattva+(GM.type==='quiz'?' quiz':' puzzle race')),type:GM.type,tattva:GM.tattva,settings:{count:GM.count,secs:GM.secs,lines:GM.lines,hard:GM.hard,theme:GM.theme,seed:Math.floor(Math.random()*1e9)}});}
async function publishGame(){const d=draftGame(),body={name:S.user?S.user.handle:'seeker',title:d.title,type:d.type,tattva:d.tattva,settings:d.settings};const btn=$('#gm-pub');if(btn)btn.disabled=true;
 try{let g;if(!GS.local){try{g=cleanGame((await API('/api/games',{method:'POST',body:JSON.stringify(body)})).game);}catch(e){if(e.status===501)GS.local=true;else throw e;}}
  if(GS.local){g=cleanGame(Object.assign({},body,{id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:Date.now()}));const l=LS.get('tr-games',[]);l.unshift(g);LS.set('tr-games',l.slice(0,40));}
  GS.games.unshift(g);GM.title='';showView('games');renderGames();gamesEl.scrollTop=0;toast('Published. Host it live to get a join code');}
 catch(e){toast(e.message||'Couldn’t publish. Try again.');}finally{if(btn)btn.disabled=false;}}
