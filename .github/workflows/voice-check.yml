name: voice-check
# After a deploy, make sure the singer voice exists (the site creates it on first use) and that it recites.
# The result is posted as a commit status ("voice-check"), so it can be read without opening logs.
on:
  push:
    branches: [main]
    paths: ['api/tts.js', 'api/_voice/**', '.github/workflows/voice-check.yml']
  workflow_dispatch:
permissions:
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit to be live, then test the voice
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          SITE=https://heytattva.vercel.app
          for i in $(seq 1 40); do
            B=$(curl -s "$SITE/api/tts?status=1" | python3 -c "import sys,json;print(json.load(sys.stdin).get('build',''))" 2>/dev/null)
            [ "$B" = "$SHA" ] && break; sleep 15
          done
          S=$(curl -s -m 60 "$SITE/api/tts?v=1&voice=singer&status=1")
          echo "status: $S"
          code=$(curl -s -m 60 -o v.mp3 -w "%{http_code}" "$SITE/api/tts?v=3&voice=singer")
          size=$(stat -c%s v.mp3); head -c 300 v.mp3 | grep -a -o '"error":"[^"]*"' > err.txt
          if [ "$code" = "200" ] && [ "$size" -gt 20000 ]; then state=success; else state=failure; fi
          desc=$(python3 - "$S" "$code" "$size" <<'P'
          import sys,json
          s,code,size=sys.argv[1:4]
          try: j=json.loads(s)
          except Exception: j={'raw':s[:60]}
          d=('voice %s created=%s' % (j.get('voice','-'), j.get('created','-'))) if j.get('ok') else ('error: '+str(j.get('error',j))[:90])
          print((d+' | recite v3: http %s, %s bytes' % (code,size))[:139])
          P
          )
          echo "$desc"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$(python3 -c "import json,sys;print(json.dumps({'state':sys.argv[1],'context':'voice-check','description':sys.argv[2]}))" "$state" "$desc")" > /dev/null
